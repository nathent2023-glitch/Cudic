<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg-l:#e9eefc;--bg-r:#fbfbff;--ink:#1d1a3a;--mute:#6b6990;--line:#d6d9f0;--field:#eef1fd;--field-b:#cfd5f2;
  --brand:#6d45d9;--brand-2:#8a5cf0;--card:#ffffff;--dot:#b9c0e6;--shadow:0 20px 50px -24px rgba(60,40,140,.35);
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-l:#15132b;--bg-r:#0e0d1d;--ink:#eeedff;--mute:#9b98c4;--line:#2d2a52;--field:#1a1836;--field-b:#363264;
  --card:#14122a;--dot:#38356a;--shadow:0 20px 50px -24px rgba(0,0,0,.8);--brand:#8a64f2;--brand-2:#a785ff}}
:root[data-theme="dark"]{--bg-l:#15132b;--bg-r:#0e0d1d;--ink:#eeedff;--mute:#9b98c4;--line:#2d2a52;--field:#1a1836;--field-b:#363264;--card:#14122a;--dot:#38356a;--shadow:0 20px 50px -24px rgba(0,0,0,.8);--brand:#8a64f2;--brand-2:#a785ff}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--body);color:var(--ink);background:var(--bg-r);display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.stage{position:relative;background:var(--bg-l);overflow:hidden;min-height:100vh;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;top:26px;left:36px;font:800 40px/1 'Baloo 2',var(--display);letter-spacing:-.01em;z-index:2}
.logo i{font-style:normal;color:var(--brand)}
.copy{position:absolute;left:36px;right:36px;bottom:40px;z-index:2;pointer-events:none}
.copy h1{font:800 clamp(34px,4.6vw,64px)/.98 var(--display);letter-spacing:-.035em;margin:0 0 16px;max-width:11em}
.tag{position:absolute;left:0;top:0;z-index:1;pointer-events:none;will-change:transform}
.tag svg{display:block;width:18px;height:18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.tag span{position:absolute;left:14px;top:16px;font:600 12px/1 var(--body);color:#fff;padding:5px 9px;border-radius:99px;white-space:nowrap}
.panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{width:100%;max-width:400px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.tabs{position:relative;display:flex;gap:4px;background:var(--field);border:1px solid var(--field-b);border-radius:12px;padding:4px}
.tabs button{position:relative;z-index:1;border:0;background:none;font:600 14px var(--body);color:var(--mute);padding:9px 18px;border-radius:9px;cursor:pointer;transition:color .2s}
.tabs button[aria-selected=true]{color:var(--ink)}
.pill{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:9px;background:var(--card);box-shadow:0 2px 8px -2px rgba(60,40,140,.3);transition:transform .3s cubic-bezier(.5,1.4,.5,1),width .3s}
.theme{border:1px solid var(--field-b);background:var(--field);color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px}
h2{font:800 28px/1.1 var(--display);letter-spacing:-.025em;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.gh{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--field-b);background:var(--card);color:var(--ink);font:600 14px var(--body);cursor:pointer;transition:transform .15s,box-shadow .2s}
.gh:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.gh svg{width:18px;height:18px;fill:currentColor}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.f{position:relative}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--field-b);background:var(--field);color:var(--ink);font:500 15px var(--body);transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:var(--mute);opacity:.7}
input:focus{outline:none;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);cursor:pointer;padding:8px;font:600 12px var(--body)}
.primary{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;color:#fff;font:700 15px var(--body);cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 24px -10px var(--brand);transition:transform .15s,box-shadow .2s}
.primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px var(--brand)}
.primary:active{transform:translateY(1px)}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:24px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.guest{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guest label{margin-top:10px}
.guest .row{grid-column:1/-1}
.ghost{grid-column:1/-1;margin-top:14px;padding:12px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font:700 14px var(--body);cursor:pointer;transition:background .2s,color .2s}
.ghost:hover{background:var(--brand);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--mute);margin:12px 0 0;cursor:pointer}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg-r);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media(max-width:860px){
  body{grid-template-columns:1fr}
  .stage{min-height:260px;height:260px}
  .copy{bottom:22px}.copy h1{font-size:30px;margin-bottom:0}
  .logo{top:22px;left:24px;font-size:28px}
}

/* signed-in state (added) */
.userbar{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--field);border:1px solid var(--field-b);border-radius:12px;padding:12px 14px;margin-bottom:18px;font:600 14px var(--body);overflow-wrap:anywhere}
.userbar button{border:0;background:none;color:var(--brand);font:700 13px var(--body);cursor:pointer;padding:0;flex-shrink:0}
.signed .top,.signed #title,.signed .sub,.signed .gh,.signed #auth,.signed .or{display:none}
</style>
</head>
<body>
<section class="stage" id="stage" aria-label="Interactive lobby preview">
  <canvas id="cv"></canvas>
  <div class="logo">cudic</div>
  <div class="copy">
    <h1>Make it your way. Share the link, and anyone can play.</h1>
  </div>
</section>

<main class="panel">
  <div class="card">
    <div class="userbar" id="userBar"><span id="userDisplay"></span><button type="button" id="signOutBtn">Sign out</button></div>
    <div class="top">
      <div class="tabs" role="tablist" id="tabs">
        <span class="pill" id="pill"></span>
        <button role="tab" aria-selected="true" data-m="in">Sign in</button>
        <button role="tab" aria-selected="false" data-m="up">Create account</button>
      </div>
      <button class="theme" id="theme" aria-label="Toggle theme">◐</button>
    </div>

    <h2 id="title">Welcome back</h2>
    <p class="sub" id="sub">Pick up where you left off.</p>

    <button class="gh" type="button">
      <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>

    <form id="auth" autocomplete="on">
      <div id="nameWrap" class="hide">
        <label for="dn">Display name</label>
        <input id="dn" type="text" placeholder="What should people call you?">
      </div>
      <label for="em">Email</label>
      <input id="em" type="email" placeholder="you@example.com" autocomplete="email" required>
      <label for="pw">Password</label>
      <div class="f">
        <input id="pw" type="password" placeholder="At least 8 characters" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye">Show</button>
      </div>
      <button class="primary" id="go" type="submit">Sign in</button>
    </form>

    <div class="or">or jump in without an account</div>

    <form class="guest" id="guest">
      <div class="row"><label for="gn">Your name</label>
      <input id="gn" type="text" placeholder="Nathen"></div>
      <div class="row"><label for="ln">Lobby name</label>
      <input id="ln" type="text" placeholder="e.g. friday-jam"></div>
      <label class="chk row"><input type="checkbox" id="persistentLobby"> Save chat history</label>
      <button class="ghost" type="submit">Join lobby</button>
    </form>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script src="/auth.js"></script>
<script>
(function(){
  // ---------- tabs ----------
  var tabs=document.getElementById('tabs'),pill=document.getElementById('pill'),btns=tabs.querySelectorAll('button');
  var title=document.getElementById('title'),sub=document.getElementById('sub'),go=document.getElementById('go'),nameWrap=document.getElementById('nameWrap'),pw=document.getElementById('pw');
  var mode='in';
  function movePill(b){pill.style.width=b.offsetWidth+'px';pill.style.transform='translateX('+(b.offsetLeft-4)+'px)'}
  function setMode(m){
    mode=m;
    btns.forEach(function(b){var on=b.dataset.m===m;b.setAttribute('aria-selected',on);if(on)movePill(b)});
    var up=m==='up';
    title.textContent=up?'Make an account':'Welcome back';
    sub.textContent=up?'Save your games and lobbies.':'Pick up where you left off.';
    go.textContent=up?'Create account':'Sign in';
    nameWrap.classList.toggle('hide',!up);
    pw.autocomplete=up?'new-password':'current-password';
  }
  btns.forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m)})});
  window.addEventListener('load',function(){movePill(btns[0])});
  document.fonts&&document.fonts.ready.then(function(){movePill(tabs.querySelector('[aria-selected=true]'))});
  window.addEventListener('resize',function(){movePill(tabs.querySelector('[aria-selected=true]'))});

  // ---------- misc ----------
  var toast=document.getElementById('toast'),tt;
  function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},2600)}
  document.getElementById('eye').addEventListener('click',function(){var s=pw.type==='password';pw.type=s?'text':'password';this.textContent=s?'Hide':'Show'});
  document.getElementById('theme').addEventListener('click',function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=dark?'light':'dark';
  });

  window.__login={say:say,setMode:setMode,mode:function(){return mode}};

  // ---------- living lobby ----------
  var stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W,H,dpr,GAP=26,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cur='<svg viewBox="0 0 18 18"><path d="M2 1l13 7-6 2-2 6z" fill="COL" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  var src=[
    {n:'you',c:'#6d45d9',x:-999,y:-999,you:1},
    {n:'maya',c:'#f0507a',a:.7,b:1.1,p:0,s:.00031},
    {n:'jo',c:'#16a37f',a:.9,b:.6,p:2,s:.00024},
    {n:'sam',c:'#f09a1a',a:.55,b:.85,p:4,s:.00037}
  ];
  src.forEach(function(o){
    var d=document.createElement('div');d.className='tag';
    d.innerHTML=cur.replace('COL',o.c)+'<span style="background:'+o.c+'">'+o.n+'</span>';
    stage.appendChild(d);o.el=d;
  });
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  size();addEventListener('resize',size);
  var tgt={x:W*.6,y:H*.45},moved=false;
  stage.addEventListener('pointermove',function(e){
    var r=stage.getBoundingClientRect();tgt.x=e.clientX-r.left;tgt.y=e.clientY-r.top;moved=true;
  });
  stage.addEventListener('pointerleave',function(){moved=false});
  stage.addEventListener('pointerdown',function(e){
    var r=stage.getBoundingClientRect();pulses.push({x:e.clientX-r.left,y:e.clientY-r.top,t:0,c:src[0].c});
  });
  var pulses=[],dot=getComputedStyle(document.documentElement).getPropertyValue('--dot');
  function hex(c){return c}
  function frame(t){
    dot=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim();
    var me=src[0];
    if(!moved&&me.x<-900){me.x=tgt.x;me.y=tgt.y}
    if(moved||me.x>-900){me.x+=(tgt.x-me.x)*.18;me.y+=(tgt.y-me.y)*.18}
    for(var i=1;i<src.length;i++){var o=src[i];
      o.x=W*(.5+.38*Math.sin(t*o.s*2+o.p)*o.a+.1*Math.sin(t*o.s*5.3));
      o.y=H*(.46+.36*Math.cos(t*o.s*2.6+o.p*1.3)*o.b);
    }
    src.forEach(function(o){o.el.style.transform='translate('+o.x+'px,'+o.y+'px)'});
    ctx.clearRect(0,0,W,H);
    var R=130;
    for(var x=GAP/2;x<W;x+=GAP)for(var y=GAP/2;y<H;y+=GAP){
      var best=0,bc=null;
      for(var k=0;k<src.length;k++){var s=src[k],dx=x-s.x,dy=y-s.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<R){var f=1-d/R;f*=f;if(f>best){best=f;bc=s.c}}}
      for(var p=0;p<pulses.length;p++){var q=pulses[p],pd=Math.abs(Math.hypot(x-q.x,y-q.y)-q.t*420);
        if(pd<40){var pf=(1-pd/40)*(1-q.t);if(pf>best){best=pf;bc=q.c}}}
      if(bc){ctx.fillStyle=bc;ctx.globalAlpha=.25+.75*best;ctx.beginPath();ctx.arc(x,y,1.4+4.2*best,0,6.283);ctx.fill()}
      else{ctx.fillStyle=dot;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x,y,1.3,0,6.283);ctx.fill()}
    }
    ctx.globalAlpha=1;
    pulses=pulses.filter(function(q){q.t+=.018;return q.t<1});
    if(!still)requestAnimationFrame(frame);
  }
  if(still){src[0].x=W*.55;src[0].y=H*.4;[1,2,3].forEach(function(i){src[i].s=0});frame(1000)}
  else requestAnimationFrame(frame);
  src[0].el.style.opacity=0;
  stage.addEventListener('pointermove',function(){src[0].el.style.opacity=1},{once:true});
})();
</script>
<script>
(function(){
  var L=window.__login;
  var go=document.getElementById('go'),em=document.getElementById('em'),pw=document.getElementById('pw'),dn=document.getElementById('dn');
  var gn=document.getElementById('gn'),ln=document.getElementById('ln'),chk=document.getElementById('persistentLobby');
  var card=document.querySelector('.card');
  var currentToken=null;

  document.querySelector('.gh').addEventListener('click',function(){signInWithGitHub()});

  document.getElementById('auth').addEventListener('submit',async function(e){
    e.preventDefault();
    var up=L.mode()==='up',label=go.textContent;
    go.disabled=true;go.textContent=up?'Creating…':'Signing in…';
    try{
      if(up){
        var res=await signUpWithEmail(em.value.trim(),pw.value,dn.value.trim());
        if(res&&res.session){location.href='/lobbies';return}
        L.say((res&&res.verifyEmail==='none')?'Account created! You can sign in now.':'Account created! Check your email.');
        setTimeout(function(){L.setMode('in')},2500);
      }else{
        await signInWithEmail(em.value.trim(),pw.value);
        location.href='/lobbies';
      }
    }catch(err){L.say(err&&err.message?err.message:'Something went wrong')}
    finally{go.disabled=false;go.textContent=label}
  });

  document.getElementById('guest').addEventListener('submit',function(e){
    e.preventDefault();
    var name=gn.value.trim(),lobby=ln.value.trim();
    if(!name||!lobby){L.say('Enter your name and a lobby name');return}
    localStorage.setItem('glox_username',name);
    var url='/chat?lobby='+encodeURIComponent(lobby)+'&username='+encodeURIComponent(name);
    if(chk.checked)url+='&persistent=1';
    if(currentToken)url+='&token='+currentToken;
    location.href=url;
  });

  document.getElementById('signOutBtn').addEventListener('click',async function(){
    try{await signOut()}catch(e){}
    localStorage.removeItem('glox_username');location.href='/';
  });

  async function initPage(){
    var session=null;
    try{session=await getSession()}catch(e){}
    if(session&&session.user){
      currentToken=session.access_token;
      var u=session.user;
      var name=(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||u.email;
      gn.value=name;gn.disabled=true;
      document.getElementById('userDisplay').textContent=name;
      document.getElementById('userBar').style.display='flex';
      card.classList.add('signed');
    }else{
      var saved=localStorage.getItem('glox_username');
      if(saved)gn.value=saved;
    }
  }

  if(typeof handleAuthCallback==='function'){
    handleAuthCallback().then(initPage).catch(initPage);
  }else{initPage()}
})();
</script>
</body>
</html>
