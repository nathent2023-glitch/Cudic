<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-divider { margin: 20px 0; }
    .auth-error { color: var(--danger); font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .auth-tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .auth-tab:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
    .auth-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .auth-form { display: none; }
    .auth-form.active { display: flex; flex-direction: column; gap: 12px; }
    .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.95rem; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .oauth-btn:hover { border-color: var(--accent); background: #1e1e30; }
    .oauth-btn svg { width: 20px; height: 20px; }
    .skip-link { display: block; text-align: center; color: var(--text-dim); font-size: 0.85rem; text-decoration: none; margin-top: 16px; }
    .skip-link:hover { color: var(--accent); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="lobby-page">
    <div class="lobby-card">
      <h1 class="logo">glox</h1>
      <p class="subtitle">sign in to chat</p>

      <!-- OAuth buttons -->
      <button class="oauth-btn" onclick="signInWithGitHub()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Sign in with GitHub
      </button>

      <button class="oauth-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>

      <div class="divider auth-divider"><span>or</span></div>

      <!-- Email/password tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Sign In</button>
        <button class="auth-tab" onclick="showTab('signup')">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <input type="email" id="loginEmail" placeholder="email" required>
        <input type="password" id="loginPass" placeholder="password" required minlength="6">
        <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        <div id="loginError" class="auth-error"></div>
      </form>

      <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
        <input type="text" id="signupName" placeholder="your display name" maxlength="20" required>
        <input type="email" id="signupEmail" placeholder="email" required>
        <input type="password" id="signupPass" placeholder="password" required minlength="6">
        <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>
        <div id="signupError" class="auth-error"></div>
      </form>

      <a href="/" class="skip-link">skip sign in — join as guest</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in...'; errEl.style.display = 'none';
      try {
        await signInWithEmail(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPass').value
        );
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const errEl = document.getElementById('signupError');
      btn.disabled = true; btn.textContent = 'Creating account...'; errEl.style.display = 'none';
      try {
        await signUpWithEmail(
          document.getElementById('signupEmail').value,
          document.getElementById('signupPass').value,
          document.getElementById('signupName').value
        );
        errEl.textContent = 'Check your email for a confirmation link!';
        errEl.style.color = 'var(--success)';
        errEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
        errEl.style.color = 'var(--danger)';
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
