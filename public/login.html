<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #FAF4E8;
      background-image: radial-gradient(circle, rgba(40, 36, 47, 0.10) 1px, transparent 1px);
      background-size: 22px 22px;
      color: #28242F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      display: flex;
      width: 900px;
      max-width: 95vw;
      min-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #E8DBBF;
      box-shadow: 0 25px 60px rgba(90, 70, 30, 0.18);
    }

    /* Left panel — visual */
    .login-visual {
      flex: 1;
      background: linear-gradient(135deg, #5B3DF0 0%, #8B5CF6 48%, #FF7A29 135%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .login-visual::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.16) 0%, transparent 50%),
                  radial-gradient(circle at 70% 30%, rgba(255, 227, 194, 0.22) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, -2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-0.5deg); }
    }

    .visual-content {
      position: relative;
      z-index: 1;
    }

    .visual-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .visual-tagline {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: 120px;
    }

    .visual-tagline h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .visual-tagline p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .visual-dots {
      display: flex;
      gap: 6px;
      margin-top: 24px;
    }

    .visual-dots span {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
    }

    .visual-dots span.active {
      background: #FFE3C2;
      width: 32px;
    }

    /* Right panel — form */
    .login-form-panel {
      flex: 1;
      background: #FFFDF7;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 32px;
    }

    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #28242F;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #6E6880;
      font-size: 0.9rem;
    }

    .form-header a {
      color: #5B3DF0;
      text-decoration: none;
      font-weight: 500;
    }

    .form-header a:hover { text-decoration: underline; }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      background: #F4ECDB;
      border-radius: 12px;
      padding: 4px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #6E6880;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .auth-tab.active {
      background: #5B3DF0;
      color: #fff;
    }

    .auth-tab:not(.active):hover { color: #28242F; }

    /* Form */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active { display: flex; }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: #F7F1E3;
      border: 1px solid #E8DBBF;
      border-radius: 12px;
      color: #28242F;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input::placeholder { color: #ABA2BE; }

    .input-group input:focus {
      border-color: #5B3DF0;
      box-shadow: 0 0 0 3px rgba(91, 61, 240, 0.15);
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .input-row .input-group { flex: 1; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #5B3DF0;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #4A2ED4; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 4px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E8DBBF;
    }

    .divider span {
      color: #ABA2BE;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* OAuth buttons */
    .oauth-buttons {
      display: flex;
      gap: 12px;
    }

    .oauth-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #E8DBBF;
      background: #FFFDF7;
      color: #28242F;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .oauth-btn:hover {
      border-color: #5B3DF0;
      background: #F4ECDB;
    }

    .oauth-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .auth-error {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      display: none;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
    }

    .skip-link {
      display: block;
      text-align: center;
      color: #ABA2BE;
      font-size: 0.85rem;
      text-decoration: none;
      margin-top: 20px;
      transition: color 0.2s;
    }

    .skip-link:hover { color: #5B3DF0; }

    /* Responsive */
    @media (max-width: 768px) {
      .login-container { flex-direction: column; min-height: auto; }
      .login-visual { display: none; }
      .login-form-panel { padding: 32px 24px; }
      .oauth-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Left visual panel -->
    <div class="login-visual">
      <div class="visual-content">
        <div class="visual-brand">glox</div>
      </div>
      <div class="visual-tagline">
        <h2>Real-time chat,<br>zero friction.</h2>
        <p>Join lobbies, talk to people, and have fun. No bloat, just vibes.</p>
        <div class="visual-dots">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="login-form-panel">
      <div class="form-header">
        <h1>Create an account</h1>
        <p>Already have an account? <a href="#" onclick="showTab('login'); return false;">Log in</a></p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('signup')">Sign Up</button>
        <button class="auth-tab" onclick="showTab('login')">Sign In</button>
      </div>

      <!-- OAuth -->
      <div class="oauth-buttons">
        <button class="oauth-btn" onclick="signInWithGitHub()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
        <button class="oauth-btn" onclick="signInWithGoogle()">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <!-- Sign Up form -->
      <form id="signupForm" class="auth-form active" onsubmit="handleSignup(event)">
        <div class="input-row">
          <div class="input-group">
            <input type="text" id="signupName" placeholder="Display name" maxlength="20" required>
          </div>
        </div>
        <div class="input-group">
          <input type="email" id="signupEmail" placeholder="Email" required>
        </div>
        <div class="input-group">
          <input type="password" id="signupPass" placeholder="Password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="signupBtn">Create account</button>
        <div id="signupError" class="auth-error"></div>
      </form>

      <!-- Sign In form -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <input type="email" id="loginEmail" placeholder="Email" required>
        </div>
        <div class="input-group">
          <input type="password" id="loginPass" placeholder="Password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
        <div id="loginError" class="auth-error"></div>
      </form>

      <a href="/" class="skip-link">skip sign in — join as guest</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'signup' && i === 0) || (tab === 'login' && i === 1));
      });
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in...'; errEl.style.display = 'none';
      try {
        await signInWithEmail(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPass').value
        );
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const errEl = document.getElementById('signupError');
      btn.disabled = true; btn.textContent = 'Creating account...'; errEl.style.display = 'none';
      try {
        await signUpWithEmail(
          document.getElementById('signupEmail').value,
          document.getElementById('signupPass').value,
          document.getElementById('signupName').value
        );
        errEl.textContent = 'Check your email for a confirmation link!';
        errEl.style.color = '#22c55e';
        errEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
        errEl.style.color = '#ef4444';
      } finally {
        btn.disabled = false; btn.textContent = 'Create account';
      }
    }
  </script>
</body>
</html>
