    <style>
        body {
            display: flex;
            overflow: hidden;
            height: 100%;
        }

        .servers-layout {
            flex: 1;
            width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--panel);
        }

        .servers-content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        .section-title {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1rem;
            margin: 24px 0 12px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .server-card {
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.15s;
            position: relative;
        }

        .server-card:hover {
            border-color: var(--signal);
        }

        .server-card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--signal-tint);
            color: var(--signal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-name {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .server-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        .badge {
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.65rem;
        }

        .badge-public {
            background: color-mix(in srgb, var(--success) 12%, transparent);
            color: var(--success);
        }

        .badge-private {
            background: color-mix(in srgb, var(--ember) 16%, transparent);
            color: var(--ember-deep);
        }

        .invite-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .invite-code {
            flex: 1;
            background: var(--ink);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-copy {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text-primary);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-copy:hover {
            border-color: var(--signal);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .card-actions button {
            flex: 1;
            padding: 7px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
        }

        .card-actions button:hover {
            background: var(--panel-raised);
            color: var(--text-primary);
        }

        .card-actions .btn-join {
            background: var(--signal);
            color: var(--on-signal, #fff);
            border-color: var(--signal);
        }

        .card-actions .btn-join:hover {
            background: var(--signal-hover);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90vw;
        }

        .modal h2 {
            font-family: var(--font-head);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal label {
            display: block;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            margin-bottom: 12px;
            outline: none;
        }

        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--signal);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .tpl-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tpl-card {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px;
            cursor: pointer;
            background: var(--panel-raised);
        }

        .tpl-card:hover { border-color: var(--signal); }

        .tpl-card.sel {
            border-color: var(--signal);
            background: var(--signal-tint);
        }

        .tpl-card b { display: block; font-size: 0.8rem; }
        .tpl-card span { font-size: 0.68rem; color: var(--text-secondary); display: block; margin-top: 2px; }
        .tpl-card em { font-style: normal; font-size: 0.65rem; color: var(--text-tertiary); }
    </style>
</head>

    <script>    var apiHost = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, 'https://') : ''; function getToken() { if (window.currentToken) return window.currentToken; try { var r = localStorage.getItem('sb-opimjwmgmzwapkzgxvhk-auth-token'); return r ? JSON.parse(r).access_token : null; } catch (e) { return null } } if(window.enhanceSelect){try{['srvSort','mVis'].forEach(function(id){var s=document.getElementById(id);if(s)enhanceSelect(s)})}catch(e){}}window.addEventListener('glox:auth', function () { try { if (typeof loadServers === 'function') loadServers(); } catch (e) { } }); var editingId = null; var tplList = [], tplPick = 'blank', starterRules = ''; fetch(apiHost + '/api/server-templates').then(function (r) { return r.json(); }).then(function (d) { tplList = d.templates || []; starterRules = d.starterRules || ''; renderTplPicker(); }).catch(function () {}); function renderTplPicker() { var g = document.getElementById('tplGrid'); var list = tplList.length ? tplList : [{ slug: 'blank', name: 'Blank', description: 'Just the basics.', channels: [{ slug: 'general' }, { slug: 'random' }] }]; g.innerHTML = list.map(function (t) { return '<div class="tpl-card' + (tplPick === t.slug ? ' sel' : '') + '" data-tpl="' + t.slug + '"><b>' + escapeHtml(t.name) + '</b><span>' + escapeHtml(t.description || '') + '</span><em>' + t.channels.map(function (c) { return '#' + c.slug; }).join(' · ') + '</em></div>'; }).join(''); g.querySelectorAll('.tpl-card').forEach(function (el) { el.onclick = function () { tplPick = el.getAttribute('data-tpl'); renderTplPicker(); var r = document.getElementById('mRules'); if (r && !r.value.trim() && starterRules) r.value = starterRules; }; }); } async function openRules(id, acceptMode) { var token = getToken(); var res = await fetch(apiHost + '/api/servers', { headers: token ? { 'Authorization': 'Bearer ' + token } : {} }); var d = await res.json(); var s = (d.servers || []).find(function (x) { return x.id === id; }); if (!s || !s.rules) { alert('No rules for this server.'); return; } document.getElementById('rulesTitle').textContent = 'Server rules'; document.getElementById('rulesText').textContent = s.rules; var acc = document.getElementById('rulesAccept'); acc.style.display = acceptMode ? '' : 'none'; acc.onclick = async function () { var t2 = getToken(); var r = await fetch(apiHost + '/api/servers/' + id + '/rules/accept', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t2, 'Content-Type': 'application/json' } }); var dd = await r.json(); if (dd.error) { alert(dd.error); return; } document.getElementById('rulesModal').classList.remove('open'); window.location.href = '/chat?server=' + id; }; document.getElementById('rulesModal').classList.add('open'); } document.getElementById('rulesClose').onclick = function () { document.getElementById('rulesModal').classList.remove('open'); }; document.getElementById('rulesModal').onclick = function (e) { if (e.target === this) this.classList.remove('open'); }; async function loadServers() { var token = getToken(); var headers = token ? { 'Authorization': 'Bearer ' + token } : {}; try { var res = await fetch(apiHost + '/api/servers', { headers: headers }); var data = await res.json(); var servers = data.servers || []; var mine = [], pub = [];        /* All public servers (including owned) go to pub list */ servers.forEach(function (s) { if (s.visibility === 'public') pub.push(s); });        /* Also fetch mine separately to get accurate count */ if (token) { var r2 = await fetch(apiHost + '/api/servers/mine', { headers: headers }); var d2 = await r2.json(); mine = d2.servers || []; } document.getElementById('ownCount').textContent = '(' + mine.length + '/50)'; renderGrid('ownGrid', mine, true); window._srvPub = pub; renderGrid('publicGrid', sortSrv(pub), false); document.getElementById('emptyState').style.display = (servers.length === 0) ? 'flex' : 'none'; } catch (e) { } } function renderGrid(id, list, isOwn) { var el = document.getElementById(id); if (!list.length) { el.innerHTML = '<div style="font-size:0.8rem;color:var(--text-tertiary);padding:8px">' + (isOwn ? 'No servers yet — create one!' : 'No public servers') + '</div>'; return; } el.innerHTML = list.map(function (s) { var icon = s.icon_url ? '<img src="' + escapeHtml(s.icon_url) + '">' : s.name.substring(0, 2).toUpperCase(); var badge = s.visibility === 'private' ? '<span class="badge badge-private">Private</span>' : '<span class="badge badge-public">Public</span>'; var chatHref = '/chat?server=' + s.id; var rulesBtn = s.rules ? '<button onclick="openRules(\'' + s.id + '\',false)">Rules</button>' : ''; var actions = isOwn ? '<div class="card-actions"><button onclick="openEdit(\'' + s.id + '\')">Edit</button><button onclick="copyInvite(\'' + s.invite_code + '\')">Copy invite</button><button onclick="deleteServer(\'' + s.id + '\')" style="color:var(--danger)">Delete</button></div><a href="' + chatHref + '" class="btn btn-primary" style="display:block;text-align:center;margin-top:8px;text-decoration:none;padding:8px">Open chat</a>' : '<div class="card-actions"><button class="btn-join" onclick="joinServer(\'' + s.id + '\',\'' + s.visibility + '\')">Join</button><a href="' + chatHref + '" style="flex:1;text-align:center;padding:7px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--text-secondary);font-size:0.78rem">Open chat</a>' + rulesBtn + '</div>'; var inviteRow = isOwn ? '<div class="invite-row"><input class="invite-code" value="' + s.invite_code + '" readonly onclick="this.select()"><button class="btn-copy" onclick="copyInvite(\'' + s.invite_code + '\')">Copy</button></div>' : ''; return '<div class="server-card">' + '<div class="server-card-head"><div class="server-icon">' + icon + '</div><div><div class="server-name">' + escapeHtml(s.name) + '</div><div style="font-size:0.7rem;color:var(--text-tertiary)">' + badge + '</div></div></div>' + '<div class="server-desc">' + escapeHtml(s.description || 'No d('modalTitle').textContent = 'New server'; document.getElementById('modalSave').textContent = 'Create'; document.getElementById('mName').value = ''; document.getElementById('mDesc').value = ''; document.getElementById('mIcon').value = ''; document.getElementById('mVis').value = 'public'; document.getElementById('mRules').value = starterRules; document.getElementById('serverModal').classList.add('open'); } function openEdit(id) { editingId = id; document.getElementById('templateWrap').style.display = 'none'; var token = getToken(); fetch(apiHost + '/api/servers', { headers: { 'Authorization': 'Bearer ' + token } }).then(function (r) { return r.json() }).then(function (d) { var s = (d.servers || []).find(function (x) { return x.id === id }); if (!s) return; document.getElementById('modalTitle').textContent = 'Edit server'; document.getElementById('modalSave').textContent = 'Save'; document.getElementById('mName').value = s.name; document.getElementById('mDesc').value = s.description || ''; document.getElementById('mIcon').value = s.icon_url || ''; document.getElementById('mVis').value = s.visibility; document.getElementById('mRules').value = s.rules || ''; document.getElementById('serverModal').classList.add('open'); }); } var srvSortMode = 'members'; function sortSrv(list) { var a = (list || []).slice(); if (srvSortMode === 'new') a.sort(function (x, y) { return new Date(y.created_at) - new Date(x.created_at); }); else if (srvSortMode === 'az') a.sort(function (x, y) { return String(x.name || '').localeCompare(String(y.name || '')); }); else a.sort(function (x, y) { return (y.member_count || 0) - (x.member_count || 0); }); return a; } document.getElementById('srvSort').addEventListener('change', function () { srvSortMode = this.value; if (window._srvPub) renderGrid('publicGrid', sortSrv(window._srvPub), false); }); document.getElementById('newServerBtn').onclick = openCreate; document.getElementById('modalCancel').onclick = function () { document.getElementById('serverModal').classList.remove('open') }; document.getElementById('serverModal').onclick = function (e) { if (e.target === this) this.classList.remove('open') }; document.getElementById('modalSave').onclick = async function () { var token = getToken(); if (!token) { alert('Sign in to create servers'); return; } var body = { name: document.getElementById('mName').value, description: document.getElementById('mDesc').value, icon_url: document.getElementById('mIcon').value, visibility: document.getElementById('mVis').value, rules: document.getElementById('mRules').value }; if (!editingId) body.template = tplPick; var url = editingId ? apiHost + '/api/servers/' + editingId : apiHost + '/api/servers'; var method = editingId ? 'PUT' : 'POST'; var res = await fetch(url, { method: method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); var d = await res.json(); if (d.error) alert(d.error); else { document.getElementById('serverModal').classList.remove('open'); location.reload(); } }; document.getElementById('joinBtn').onclick = async function () { var code = document.getElementById('inviteInput').value.trim(); if (!code) { alert('Enter an invite code'); return; }      /* Find server by invite code */ var token = getToken(); var res = await fetch(apiHost + '/api/servers', { headers: token ? { 'Authorization': 'Bearer ' + token } : {} }); var d = await res.json(); var srv = (d.servers || []).find(function (s) { return s.invite_code === code }); if (!srv) { alert('No server found with that invite code'); return; } joinServer(srv.id); };    /* Auto-fill invite from URL */ var inv = new URLSearchParams(window.location.search).get('invite'); if (inv) document.getElementById('inviteInput').value = inv;    /* Wait for auth to load */ setTimeout(loadServers, 400); setTimeout(loadServers, 1200);  </script>
