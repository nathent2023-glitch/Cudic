<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Servers</title>
  <link rel="stylesheet" href="/sidebar.css?v=2">
  <style>
    body { display: flex; overflow: hidden; height: 100%; }
    .servers-layout { flex: 1; width: 0; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--panel); }
    .servers-content { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .section-title { font-family: var(--font-head); font-weight: 600; font-size: 1rem; margin: 24px 0 12px; }
    .section-title:first-child { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .server-card { background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: border-color 0.15s; position: relative; }
    .server-card:hover { border-color: var(--signal); }
    .server-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .server-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--signal-tint); color: var(--signal); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; flex-shrink: 0; overflow: hidden; }
    .server-icon img { width: 100%; height: 100%; object-fit: cover; }
    .server-name { font-family: var(--font-head); font-weight: 600; font-size: 0.95rem; }
    .server-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 10px; min-height: 20px; }
    .server-meta { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--text-tertiary); }
    .badge { padding: 2px 7px; border-radius: 4px; font-weight: 500; font-size: 0.65rem; }
    .badge-public { background: rgba(79,216,151,0.12); color: #4FD897; }
    .badge-private { background: rgba(242,166,90,0.12); color: #F2A65A; }
    .invite-row { display: flex; gap: 8px; margin-top: 10px; }
    .invite-code { flex: 1; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); }
    .btn-copy { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text-primary); font-size: 0.75rem; cursor: pointer; }
    .btn-copy:hover { border-color: var(--signal); }
    .card-actions { display: flex; gap: 6px; margin-top: 10px; }
    .card-actions button { flex: 1; padding: 7px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text-secondary); font-size: 0.78rem; cursor: pointer; }
    .card-actions button:hover { background: var(--panel-raised); color: var(--text-primary); }
    .card-actions .btn-join { background: var(--signal); color: #fff; border-color: var(--signal); }
    .card-actions .btn-join:hover { background: var(--signal-hover); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 9999; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw; }
    .modal h2 { font-family: var(--font-head); font-weight: 600; margin-bottom: 16px; }
    .modal label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .modal input, .modal textarea, .modal select { width: 100%; background: var(--panel-raised); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; margin-bottom: 12px; outline: none; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--signal); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body data-page="servers">
  <div class="servers-layout">
    <div class="topbar">
      <h1>Servers</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="inviteInput" placeholder="Invite code" style="background:var(--panel-raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--text-primary);font-size:0.8rem;width:140px;outline:none" maxlength="16">
        <button id="joinBtn" class="btn btn-secondary" style="padding:8px 14px">Join</button>
        <button id="newServerBtn" class="btn btn-primary">+ New server</button>
      </div>
    </div>
    <div class="servers-content" id="serversContent">
      <div class="section-title">Your servers <span id="ownCount" style="font-weight:400;color:var(--text-tertiary);font-size:0.8rem"></span></div>
      <div class="grid" id="ownGrid"></div>
      <div class="section-title">Public servers</div>
      <div class="grid" id="publicGrid"></div>
      <div class="empty-wrap dotgrid" id="emptyState" style="display:none;min-height:300px">
        <div class="empty-card">
          <div class="empty-icon-circle"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 8h4M7 12h10"/></svg></div>
          <h2>No servers yet</h2>
          <p>Create your first server to start a group chat.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="serverModal">
    <div class="modal">
      <h2 id="modalTitle">New server</h2>
      <label>Server name</label>
      <input type="text" id="mName" placeholder="my-cool-server" maxlength="20">
      <label>Description</label>
      <textarea id="mDesc" placeholder="What's this server about?" maxlength="200" rows="2"></textarea>
      <label>Icon URL (optional)</label>
      <input type="text" id="mIcon" placeholder="https://...">
      <label>Visibility</label>
      <select id="mVis"><option value="public">Public — anyone can find and join</option><option value="private">Private — invite code required</option></select>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalSave">Create</button>
      </div>
    </div>
  </div>

  <script src="/config.js?v=2"></script>
  <script src="/sidebar.js?v=2"></script>
  <script>
    var apiHost=(typeof WS_URL!=='undefined'&&WS_URL)?WS_URL.replace(/^wss?:\/\//,'https://'):'';
    function getToken(){ try{ var r=localStorage.getItem('sb-opimjwmgmzwapkzgxvhk-auth-token'); return r?JSON.parse(r).access_token:null;}catch(e){return null}}
    function getUsername(){ var p=new URLSearchParams(window.location.search); return p.get('username')||localStorage.getItem('glox_username')||'Guest'; }

    var editingId=null;

    async function loadServers(){
      var token=getToken();
      var headers=token?{'Authorization':'Bearer '+token}:{};
      try{
        var res=await fetch(apiHost+'/api/servers',{headers:headers});
        var data=await res.json();
        var servers=data.servers||[];
        var mine=[],pub=[];
        servers.forEach(function(s){
          var isOwner=token&&s.owner_id&&window.currentUser&&s.owner_id===window.currentUser.id;
          if(isOwner) mine.push(s); else if(s.visibility==='public') pub.push(s);
        });
        // Also fetch mine separately to get accurate count
        if(token){
          var r2=await fetch(apiHost+'/api/servers/mine',{headers:headers});
          var d2=await r2.json();
          mine=d2.servers||mine;
        }
        document.getElementById('ownCount').textContent='('+mine.length+'/3)';
        renderGrid('ownGrid',mine,true);
        renderGrid('publicGrid',pub,false);
        document.getElementById('emptyState').style.display=(servers.length===0)?'flex':'none';
      }catch(e){}
    }

    function renderGrid(id, list, isOwn){
      var el=document.getElementById(id);
      if(!list.length){ el.innerHTML='<div style="font-size:0.8rem;color:var(--text-tertiary);padding:8px">'+(isOwn?'No servers yet — create one!':'No public servers')+'</div>'; return; }
      el.innerHTML=list.map(function(s){
        var icon=s.icon_url?'<img src="'+escapeHtml(s.icon_url)+'">':s.name.substring(0,2).toUpperCase();
        var badge=s.visibility==='private'?'<span class="badge badge-private">Private</span>':'<span class="badge badge-public">Public</span>';
        var lobby='server:'+s.id;
        var uname=getUsername();
        var chatHref='/chat?lobby='+encodeURIComponent(lobby)+'&username='+encodeURIComponent(uname);
        var actions=isOwn
          ? '<div class="card-actions"><button onclick="openEdit(\''+s.id+'\')">Edit</button><button onclick="copyInvite(\''+s.invite_code+'\')">Copy invite</button><button onclick="deleteServer(\''+s.id+'\')" style="color:var(--danger)">Delete</button></div><a href="'+chatHref+'" class="btn btn-primary" style="display:block;text-align:center;margin-top:8px;text-decoration:none;padding:8px">Open chat</a>'
          : '<div class="card-actions"><button class="btn-join" onclick="joinServer(\''+s.id+'\')">Join</button><a href="'+chatHref+'" style="flex:1;text-align:center;padding:7px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--text-secondary);font-size:0.78rem">Open chat</a></div>';
        return '<div class="server-card">'
          +'<div class="server-card-head"><div class="server-icon">'+icon+'</div><div><div class="server-name">'+escapeHtml(s.name)+'</div><div style="font-size:0.7rem;color:var(--text-tertiary)">'+badge+'</div></div></div>'
          +'<div class="server-desc">'+escapeHtml(s.description||'No description')+'</div>'
          +'<div class="invite-row"><input class="invite-code" value="'+s.invite_code+'" readonly onclick="this.select()"><button class="btn-copy" onclick="copyInvite(\''+s.invite_code+'\')">Copy</button></div>'
          +actions
          +'</div>';
      }).join('');
    }

    function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function copyInvite(code){ navigator.clipboard.writeText(window.location.origin+'/servers?invite='+code).then(function(){ alert('Invite link copied!'); }); }

    async function joinServer(id){
      var token=getToken(); if(!token){alert('Sign in to join servers');return;}
      var code=prompt('Invite code (leave blank for public servers):')||'';
      var res=await fetch(apiHost+'/api/servers/'+id+'/join',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({invite_code:code})});
      var d=await res.json();
      if(d.error) alert(d.error); else { alert('Joined!'); location.reload(); }
    }

    async function deleteServer(id){
      if(!confirm('Delete this server?')) return;
      var token=getToken();
      await fetch(apiHost+'/api/servers/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
      location.reload();
    }

    function openCreate(){
      editingId=null;
      document.getElementById('modalTitle').textContent='New server';
      document.getElementById('modalSave').textContent='Create';
      document.getElementById('mName').value='';document.getElementById('mDesc').value='';document.getElementById('mIcon').value='';document.getElementById('mVis').value='public';
      document.getElementById('serverModal').classList.add('open');
    }
    function openEdit(id){
      editingId=id;
      var token=getToken();
      fetch(apiHost+'/api/servers',{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.json()}).then(function(d){
        var s=(d.servers||[]).find(function(x){return x.id===id});
        if(!s) return;
        document.getElementById('modalTitle').textContent='Edit server';
        document.getElementById('modalSave').textContent='Save';
        document.getElementById('mName').value=s.name;document.getElementById('mDesc').value=s.description||'';document.getElementById('mIcon').value=s.icon_url||'';document.getElementById('mVis').value=s.visibility;
        document.getElementById('serverModal').classList.add('open');
      });
    }

    document.getElementById('newServerBtn').onclick=openCreate;
    document.getElementById('modalCancel').onclick=function(){document.getElementById('serverModal').classList.remove('open')};
    document.getElementById('serverModal').onclick=function(e){if(e.target===this) this.classList.remove('open')};
    document.getElementById('modalSave').onclick=async function(){
      var token=getToken(); if(!token){alert('Sign in to create servers');return;}
      var body={name:document.getElementById('mName').value,description:document.getElementById('mDesc').value,icon_url:document.getElementById('mIcon').value,visibility:document.getElementById('mVis').value};
      var url=editingId?apiHost+'/api/servers/'+editingId:apiHost+'/api/servers';
      var method=editingId?'PUT':'POST';
      var res=await fetch(url,{method:method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
      var d=await res.json();
      if(d.error) alert(d.error); else { document.getElementById('serverModal').classList.remove('open'); location.reload(); }
    };

    document.getElementById('joinBtn').onclick=async function(){
      var code=document.getElementById('inviteInput').value.trim();
      if(!code){alert('Enter an invite code');return;}
      // Find server by invite code
      var token=getToken();
      var res=await fetch(apiHost+'/api/servers',{headers:token?{'Authorization':'Bearer '+token}:{}});
      var d=await res.json();
      var srv=(d.servers||[]).find(function(s){return s.invite_code===code});
      if(!srv){ alert('No server found with that invite code'); return; }
      joinServer(srv.id);
    };

    // Auto-fill invite from URL
    var inv=new URLSearchParams(window.location.search).get('invite');
    if(inv) document.getElementById('inviteInput').value=inv;

    // Wait for auth to load
    setTimeout(loadServers, 400);
    setTimeout(loadServers, 1200);
  </script>
</body>
</html>
