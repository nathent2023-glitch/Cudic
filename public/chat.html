<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #16171a; overflow: hidden; }
    canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .chat-page { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="chat-page">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link">&larr; lobbies</a>
        <h2 class="sidebar-title" id="lobbyTitle"></h2>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-label">Online — <span id="userCount">0</span></h3>
        <ul id="userList" class="user-list"></ul>
      </div>
      <div class="sidebar-section" style="margin-top:auto;padding:12px">
        <a href="/editor" class="editor-btn">&#127918; Game Editor</a>
        <a href="/games" class="editor-btn" style="margin-top:6px;background:rgba(104,174,212,.08);border-color:rgba(104,174,212,.2);color:#68aed4">&#127918; Game Gallery</a>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="chat-main">
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn" title="Toggle user list">&#9776;</button>
        <span id="chatTitle"></span>
      </header>

      <div id="messages" class="messages"></div>

      <div id="typingIndicator" class="typing-indicator" style="display:none"></div>

      <form id="chatForm" class="chat-input-area">
        <input type="text" id="msgInput" placeholder="type a message..." maxlength="2000" autocomplete="off">
        <button type="submit" class="btn-send" title="Send">&#10148;</button>
      </form>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H, cubes = [], particles = [], mouseX = -9999, mouseY = -9999;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Cube {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.z = Math.random() * 400 + 100;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.rotX = Math.random() * Math.PI * 2;
        this.rotY = Math.random() * Math.PI * 2;
        this.rotSpeedX = (Math.random() - 0.5) * 0.02;
        this.rotSpeedY = (Math.random() - 0.5) * 0.02;
        this.size = Math.random() * 18 + 6;
        const colors = ['#7f0622','#d62411','#ff8426','#ffd100','#68aed4','#007899','#430067','#94216a','#234975'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotX += this.rotSpeedX;
        this.rotY += this.rotSpeedY;
        if (this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) this.reset();
        const dx = mouseX - this.x, dy = mouseY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          const force = (150 - dist) / 150 * 2;
          this.vx -= (dx / dist) * force;
          this.vy -= (dy / dist) * force;
          this.vx *= 0.92;
          this.vy *= 0.92;
        }
      }
      project(x, y, z) {
        const scale = 500 / (z + 500);
        return { x: x + (this.x - W / 2) * scale, y: y + (this.y - H / 2) * scale, s: scale };
      }
      draw() {
        const s = this.size, z = this.z;
        const verts = [[-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],[-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]];
        const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
        const cosX = Math.cos(this.rotX), sinX = Math.sin(this.rotX);
        const cosY = Math.cos(this.rotY), sinY = Math.sin(this.rotY);
        const projected = verts.map(([x,y,xx]) => {
          let nx = x, ny = y * cosX - xx * sinX, nz = y * sinX + xx * cosX;
          let fx = nx * cosY + nz * sinY, fy = ny, fz = -nx * sinY + nz * cosY;
          return this.project(fx, fy, fz + z);
        });
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = 0.2 + 0.15 * (1 - z / 500);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        edges.forEach(([a,b]) => {
          ctx.moveTo(projected[a].x, projected[a].y);
          ctx.lineTo(projected[b].x, projected[b].y);
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.size = Math.random() * 1.8 + 0.4;
        this.alpha = Math.random() * 0.3 + 0.1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = W;
        if (this.x > W) this.x = 0;
        if (this.y < 0) this.y = H;
        if (this.y > H) this.y = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(250,255,255,${this.alpha})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    for (let i = 0; i < 12; i++) cubes.push(new Cube());
    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.025)';
      ctx.lineWidth = 1;
      const gs = 50;
      for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      drawGrid();
      cubes.forEach(c => { c.update(); c.draw(); });
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
  </script>
  <script src="config.js"></script>
  <script src="client.js"></script>
</body>
</html>
