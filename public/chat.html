<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Chat</title>
  <link rel="stylesheet" href="/sidebar.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    body{background:#0d0e10;overflow:hidden}
    .chat-layout{display:flex;flex:1;overflow:hidden;height:100%;position:relative}

    .chat-sidebar{
      width:220px;background:#111214;border-right:1px solid rgba(255,255,255,.05);
      display:none;flex-direction:column;flex-shrink:0;overflow-y:auto;
      position:absolute;left:0;top:0;bottom:0;z-index:20;
    }
    .chat-sidebar.open{display:flex}
    .chat-sidebar-header{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
    .chat-sidebar-header .lobby-name{font-weight:700;font-size:.9rem;color:#fafdff;margin-bottom:2px}
    .chat-sidebar-header .back-link{color:#68aed4;font-size:.75rem;text-decoration:none;font-weight:500}
    .chat-sidebar-header .back-link:hover{color:#bfff3c}
    .user-section{padding:12px 16px}
    .user-section h3{font-size:.65rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .user-section li{list-style:none;padding:5px 0;font-size:.8rem;color:#aaa}
    .chat-sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05)}
    .chat-sidebar-footer a{display:block;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:#68aed4;font-size:.78rem;text-decoration:none;font-weight:600;text-align:center;margin-bottom:6px;transition:all .15s}
    .chat-sidebar-footer a:hover{border-color:rgba(191,255,60,.3);color:#bfff3c}

    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .chat-header{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;font-weight:600;font-size:.9rem}
    .chat-header .menu-btn{background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer;padding:4px 8px;border-radius:6px}
    .chat-header .menu-btn:hover{background:rgba(255,255,255,.06);color:#fafdff}
    .messages{flex:1;overflow-y:auto;padding:16px 20px}
    .msg{margin-bottom:10px;font-size:.85rem;line-height:1.5}
    .msg .author{font-weight:700;margin-right:6px}
    .msg .time{color:#52525b;font-size:.7rem;margin-left:6px}
    .system{color:#52525b;font-size:.78rem;text-align:center;margin:8px 0;font-style:italic}
    .system.join{color:#10d275}
    .system.leave{color:#ff2674}
    .typing-indicator{padding:4px 20px;color:#52525b;font-size:.75rem;font-style:italic}
    .chat-input-area{display:flex;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);gap:8px}
    .chat-input-area input{flex:1;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#fafdff;font-size:.87rem;font-family:inherit;outline:none;transition:border-color .15s}
    .chat-input-area input:focus{border-color:#bfff3c}
    .chat-input-area .btn-send{padding:12px 18px;background:#bfff3c;border:none;border-radius:12px;color:#0d0e10;font-weight:700;font-size:.87rem;cursor:pointer;font-family:inherit;transition:background .15s}
    .chat-input-area .btn-send:hover{background:#a8e62e}
  </style>
</head>
<body data-page="chat">
  <div class="chat-layout">
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <a href="/" class="back-link">&larr; lobbies</a>
        <div class="lobby-name" id="lobbyTitle"></div>
      </div>
      <div class="user-section">
        <h3>Online — <span id="userCount">0</span></h3>
        <ul id="userList"></ul>
      </div>
      <div class="chat-sidebar-footer">
        <a href="/editor">Game Editor</a>
        <a href="/games">Game Gallery</a>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn" title="Toggle user list">&#9776;</button>
        <span id="chatTitle"></span>
      </header>
      <div id="messages" class="messages"></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none"></div>
      <form id="chatForm" class="chat-input-area">
        <input type="text" id="msgInput" placeholder="type a message..." maxlength="2000" autocomplete="off">
        <button type="submit" class="btn-send" title="Send">&#10148;</button>
      </form>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/client.js"></script>
</body>
</html>
