<!DOCTYPE html><html lang="en"><head><script>try{if(localStorage.getItem('glox_theme')!=='light')document.documentElement.dataset.theme='dark';}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cudic — Chat</title>
  <meta name="description" content="Direct messages and server channels on Cudic. Talk live, keep the history, and share what you're building.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cudic">
  <meta property="og:title" content="Chat — Cudic">
  <meta property="og:description" content="Direct messages and server channels on Cudic. Talk live, keep the history, and share what you're building.">
  <meta property="og:url" content="https://cudic.vercel.app/chat">
  <meta property="og:image" content="https://cudic.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chat — Cudic">
  <meta name="twitter:description" content="Direct messages and server channels on Cudic. Talk live, keep the history, and share what you're building.">
  <meta name="twitter:image" content="https://cudic.vercel.app/og.png">
  <link rel="canonical" content="https://cudic.vercel.app/chat">
  <link rel="icon" type="image/svg+xml" href="/cudic_sfsvg.svg">
  <link rel="stylesheet" href="/sidebar.css?v=18">
  <style>
    body { display: flex; overflow: hidden; height: 100%; }
    .chat-layout {
      flex: 1; width: 0; display: flex; overflow: hidden; min-width: 0;
      background: var(--panel); position: relative;
    }
    .chat-main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      min-width: 0; min-height: 0;
    }

    /* ── Conversation sidebar ─────────────────────────────── */
    .chat-sidebar {
      width: 300px; background: var(--panel); border-right: 1px solid var(--line);
      display: none; flex-direction: column; flex-shrink: 0; overflow: hidden;
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 20;
    }
    .chat-sidebar.open { display: flex; }
    @media (min-width: 900px) { .chat-sidebar { display: flex; position: static; } }
    .conv-head {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
      font-family: var(--font-head); font-weight: 600; font-size: 1rem;
    }
    .conv-new {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: var(--panel-raised);
      color: var(--text-primary); font-size: 1.1rem; line-height: 1; cursor: pointer;
    }
    .conv-new:hover { border-color: var(--signal); color: var(--signal); }
    .conv-search { padding: 10px 12px 4px; flex-shrink: 0; }
    .conv-search input {
      width: 100%; box-sizing: border-box; background: var(--panel-raised);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 8px 10px; color: var(--text-primary); font-size: 0.83rem;
      font-family: inherit; outline: none;
    }
    .conv-search input:focus { border-color: var(--signal); }
    .conv-list div.conv-row { cursor: default; }
    .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
    .conv-section {
      font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary);
      padding: 12px 8px 4px; display: flex; align-items: center; justify-content: space-between;
    }
    .conv-server {
      font-family: var(--font-head); font-weight: 600; font-size: 0.85rem;
      color: var(--text-primary); padding: 12px 8px 4px;
    }
    .conv-row {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px; border: none; border-radius: var(--radius-sm);
      background: none; cursor: pointer; text-align: left; font-family: inherit;
    }
    .conv-row:hover { background: var(--panel-raised); }
    .conv-row.active { background: var(--signal-tint); }
    .conv-ava {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--signal-tint); color: var(--signal);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 600; font-size: 0.8rem; overflow: hidden;
    }
    .conv-ava img { width: 100%; height: 100%; object-fit: cover; }
    .conv-hash {
      width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
      background: var(--panel-raised); color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 600; font-size: 1rem;
    }
    .conv-main { flex: 1; min-width: 0; }
    .conv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .conv-name {
      font-weight: 600; font-size: 0.875rem; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .conv-time { font-size: 0.7rem; color: var(--text-tertiary); flex-shrink: 0; }
    .conv-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .conv-prev {
      font-size: 0.78rem; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
    }
    .conv-unread {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; flex-shrink: 0;
      background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Search view (main panel) ─────────────────────────────── */
    #searchView { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
    .search-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; font-family: var(--font-head);
      font-weight: 600; font-size: 1rem; flex-shrink: 0;
    }
    .search-head button {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: transparent;
      color: var(--text-secondary); font-size: 1rem; line-height: 1; cursor: pointer;
    }
    .search-head button:hover { border-color: var(--signal); color: var(--signal); }
    #searchView input[type="text"] {
      width: 100%; box-sizing: border-box; background: var(--panel-raised);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 10px 12px; color: var(--text-primary); font-size: 0.9rem;
      font-family: inherit; outline: none; margin-bottom: 8px; flex-shrink: 0;
    }
    #searchView input[type="text"]:focus { border-color: var(--signal); }
    .req-badge {
      display: inline-block; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--danger); color: #fff;
      font-size: 0.65rem; font-weight: 700; line-height: 18px; margin-left: 4px;
    }
    .newmsg-label { font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); margin: 8px 0 4px; }
    .person-row {
      display: flex; align-items: center; gap: 10px; padding: 6px 4px;
      font-size: 0.85rem; color: var(--text-primary);
    }
    .person-row .conv-ava { width: 30px; height: 30px; font-size: 0.7rem; }
    .person-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person-row button {
      padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--line); background: var(--panel-raised);
      color: var(--text-primary); font-size: 0.75rem; font-family: inherit; flex-shrink: 0;
    }
    .person-row button.go { background: var(--signal); border-color: var(--signal); color: var(--on-signal, #fff); }
    .person-row button:disabled { opacity: 0.55; cursor: default; }
    .person-row .dim { font-size: 0.72rem; color: var(--text-tertiary); }

    /* ── Message pane ─────────────────────────────────────── */
    .topbar {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-head); font-weight: 600; font-size: 1rem;
      background: var(--panel); flex-shrink: 0; min-width: 0;
    }
    .topbar .topic {
      font-family: var(--font-body); font-weight: 400; font-size: 0.8rem;
      color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .topbar .online { font-family: var(--font-body); font-weight: 400; font-size: 0.75rem; color: var(--text-tertiary); flex-shrink: 0; }
    .topbar .online .dot { color: var(--success); }
    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg {
      display: flex; gap: 10px; margin-bottom: 14px; font-size: 0.9375rem; line-height: 1.6;
      color: var(--text-primary); font-weight: 400; letter-spacing: 0.01em;
      font-family: var(--font-body);
    }
    .msg-ava {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: var(--signal-tint); color: var(--signal);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 600; font-size: 0.75rem;
      overflow: hidden; margin-top: 2px;
    }
    .msg-ava img { width: 100%; height: 100%; object-fit: cover; }
    .msg-main { flex: 1; min-width: 0; }
    .msg-text { overflow-wrap: break-word; }
    /* Own messages: right-aligned tinted bubble with read ticks. */
    .msg.mine { justify-content: flex-end; }
    .msg.mine .msg-ava { display: none; }
    .msg.mine .msg-main { display: flex; flex-direction: column; align-items: flex-end; }
    .msg.mine .author { display: none; }
    .msg.mine .msg-text { background: var(--signal-tint); border-radius: 12px 4px 12px 12px; padding: 8px 12px; max-width: 75%; }
    .msg .ticks { font-size: 0.7rem; color: var(--text-tertiary); margin-left: 6px; }
    .msg .ticks.seen { color: var(--signal); }
    .msg .author { font-weight: 600; margin-right: 8px; color: var(--signal); font-family: var(--font-head); }
    .msg .time { color: var(--text-tertiary); font-size: 0.75rem; margin-left: 8px; font-weight: 400; }
    .system { color: var(--text-secondary); font-size: 0.8125rem; text-align: center; margin: 8px 0; font-style: italic; opacity: 0.95; }
    .system.join { color: var(--success); }
    .system.leave { color: var(--danger); }
    .typing-indicator { padding: 4px 20px; color: var(--text-tertiary); font-size: 0.8rem; font-style: italic; }
    .chat-input-area {
      display: flex; gap: 10px; padding: 10px 16px;
      border-top: 1px solid var(--line); background: var(--panel);
    }
    .chat-input-area input {
      flex: 1; background: var(--panel-raised); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text-primary);
      font-size: 0.875rem; font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    .chat-input-area input::placeholder { color: var(--text-tertiary); }
    .chat-input-area input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
    .btn-send {
      background: var(--signal); color: var(--on-signal, #fff); border: none;
      border-radius: var(--radius-sm); padding: 10px 18px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; font-family: var(--font-head); transition: background 0.15s;
    }
    .btn-send:hover { background: var(--signal-hover); }
    #rulesOverlay {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0, 0, 0, 0.6);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .rules-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 24px; width: 400px; max-width: 90vw;
      max-height: 80vh; overflow-y: auto;
    }
    .rules-card h2 { font-family: var(--font-head); font-weight: 600; margin: 0 0 12px; font-size: 1.1rem; }
    .rules-card p { font-size: 0.85rem; line-height: 1.7; white-space: pre-wrap; margin: 0 0 16px; }
    .rules-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style></head>
<body data-page="chat">
  <div class="chat-layout page-panel">
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="conv-head">
        <span>Messages</span>
        <button class="conv-new" id="newMsgBtn" title="New message" aria-label="New message">+</button>
      </div>
      <div class="conv-search"><input type="text" id="convSearch" placeholder="Find a conversation" aria-label="Find a conversation" maxlength="40" autocomplete="off"></div>
      <div class="conv-list" id="convList">
        <div class="conv-row" aria-hidden="true"><div class="conv-ava sk"></div><div class="conv-main"><div class="sk" style="height:14px;width:45%;border-radius:4px;margin-bottom:6px"></div><div class="sk" style="height:11px;width:80%;border-radius:4px"></div></div></div>
        <div class="conv-row" aria-hidden="true"><div class="conv-ava sk"></div><div class="conv-main"><div class="sk" style="height:14px;width:60%;border-radius:4px;margin-bottom:6px"></div><div class="sk" style="height:11px;width:70%;border-radius:4px"></div></div></div>
        <div class="conv-row" aria-hidden="true"><div class="conv-ava sk"></div><div class="conv-main"><div class="sk" style="height:14px;width:40%;border-radius:4px;margin-bottom:6px"></div><div class="sk" style="height:11px;width:75%;border-radius:4px"></div></div></div>
        <div class="conv-row" aria-hidden="true"><div class="conv-ava sk"></div><div class="conv-main"><div class="sk" style="height:14px;width:55%;border-radius:4px;margin-bottom:6px"></div><div class="sk" style="height:11px;width:65%;border-radius:4px"></div></div></div>
      </div>
    </aside>
    <main class="chat-main" id="chatMain">
      <div id="searchView" hidden>
        <div class="search-head"><span>New message</span><button id="searchClose" aria-label="Close search">×</button></div>
        <input type="text" id="peopleSearch" placeholder="Search name or #id" aria-label="Search people" maxlength="40" autocomplete="off">
        <div id="panelStatus" style="font-size:0.8rem;color:var(--danger)"></div>
        <div id="peopleResults"></div>
        <div class="newmsg-label">Requests <span class="req-badge" id="reqBadge" hidden></span></div>
        <div id="reqIncoming"></div>
        <div id="reqOutgoing"></div>
        <div class="newmsg-label">Friends</div>
        <div id="friendsList"><div class="dim" style="font-size:0.8rem;color:var(--text-tertiary)">Loading…</div></div>
      </div>
      <div class="topbar" id="chatTopbar" hidden>
        <span id="chatTitle"></span>
        <span class="topic" id="chatTopic"></span>
        <span class="online" id="onlineCount"></span>
      </div>
      <div id="messages" class="messages" hidden></div>
      <div id="chatEmpty" class="empty-wrap">
        <div class="empty-card">
          <div class="empty-icon-circle"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 20l1.1-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg></div>
          <h2 id="emptyTitle">No conversations yet</h2>
          <p id="emptyText">Message a friend or join a server to get started.</p>
          <button class="btn btn-primary" id="emptyFind">Find friends</button>
          <p style="margin-top:12px"><a href="/servers" style="color:var(--signal);font-size:0.85rem">Browse servers →</a></p>
        </div>
      </div>
      <div id="typingIndicator" class="typing-indicator" style="display:none"></div>
      <form id="chatForm" class="chat-input-area" hidden>
        <input type="text" id="msgInput" placeholder="Type a message…" aria-label="Type a message" maxlength="2000" autocomplete="off">
        <button type="submit" class="btn-send">Send</button>
      </form>
      <div id="rulesOverlay" hidden>
        <div class="rules-card">
          <h2>Server rules</h2>
          <p id="rulesOverlayText"></p>
          <div class="rules-actions">
            <button class="btn btn-secondary" id="rulesOverlayLater">Later</button>
            <button class="btn btn-primary" id="rulesOverlayAccept">I agree — continue</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/config.js"></script>
  <script src="/auth.js"></script>
  <script src="/sidebar.js?v=2"></script>
  <script src="/client.js?v=3"></script>
</body></html>
