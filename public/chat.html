<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Chat</title>
  <link rel="stylesheet" href="/sidebar.css?v=2">
  <link rel="stylesheet" href="/style.css?v=2">
  <style>
    body { display: flex; overflow: hidden; height: 100%; }

    .chat-layout {
      flex: 1;
      width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: var(--panel);
    }

    .chat-sidebar {
      width: 220px;
      background: var(--ink);
      border-right: 1px solid var(--line);
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      position: absolute;
      left: 220px;
      top: 0;
      bottom: 0;
      z-index: 20;
    }

    .chat-sidebar.open { display: flex; }

    .chat-sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .chat-sidebar-header .lobby-name { font-weight: 600; font-size: 0.9375rem; color: var(--text-primary); margin-bottom: 2px; font-family: var(--font-head); }
    .chat-sidebar-header .back-link { color: var(--signal); font-size: 0.75rem; text-decoration: none; font-weight: 500; }
    .chat-sidebar-header .back-link:hover { text-decoration: underline; }

    .user-section { padding: 12px 16px; }
    .user-section h3 { font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 500; }
    .user-section li { list-style: none; padding: 5px 0; font-size: 0.8rem; color: var(--text-secondary); }

    .chat-sidebar-footer { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); }
    .chat-sidebar-footer a { display: block; padding: 8px 12px; background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 0.78rem; text-decoration: none; font-weight: 500; text-align: center; margin-bottom: 6px; transition: all 0.15s; }
    .chat-sidebar-footer a:hover { border-color: var(--signal); color: var(--signal); }

    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1rem;
      background: var(--panel);
      flex-shrink: 0;
    }

    .topbar .menu-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
    }

    .topbar .menu-btn:hover { background: var(--panel-raised); color: var(--text-primary); }
    .topbar .menu-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; }

    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin-bottom: 10px; font-size: 0.875rem; line-height: 1.5; }
    .msg .author { font-weight: 600; margin-right: 6px; color: var(--signal); }
    .msg .time { color: var(--text-tertiary); font-size: 0.75rem; margin-left: 6px; }

    .system { color: var(--text-tertiary); font-size: 0.8125rem; text-align: center; margin: 8px 0; font-style: italic; }
    .system.join { color: var(--success); }
    .system.leave { color: var(--danger); }

    .typing-indicator { padding: 4px 20px; color: var(--text-tertiary); font-size: 0.8rem; font-style: italic; }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .chat-input-area input {
      flex: 1;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .chat-input-area input::placeholder { color: var(--text-tertiary); }
    .chat-input-area input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }

    .btn-send {
      background: var(--signal);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-head);
      transition: background 0.15s;
    }

    .btn-send:hover { background: var(--signal-hover); }
  </style>
</head>
<body data-page="chat">
  <!-- Sidebar injected by sidebar.js -->

  <div class="chat-layout">
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <a href="/" class="back-link">&larr; lobbies</a>
        <div class="lobby-name" id="lobbyTitle"></div>
      </div>
      <div class="user-section">
        <h3>Online — <span id="userCount">0</span></h3>
        <ul id="userList"></ul>
      </div>
      <div class="chat-sidebar-footer">
        <a href="/editor">Game Editor</a>
        <a href="/games">Game Gallery</a>
      </div>
    </aside>

    <main class="chat-main" id="chatMain">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" title="Toggle user list">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        </button>
        <span id="chatTitle"></span>
      </div>
      <div id="messages" class="messages"></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none"></div>
      <form id="chatForm" class="chat-input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." maxlength="2000" autocomplete="off">
        <button type="submit" class="btn-send">Send</button>
      </form>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/client.js"></script>
</body>
</html>
