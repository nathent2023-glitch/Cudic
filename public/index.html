<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      width: 880px;
      max-width: 94vw;
      min-height: 540px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 16px 70px rgba(0,0,0,.4);
    }

    /* ── Left visual ── */
    .visual {
      flex: 1.05;
      background: #18181b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 30px;
      position: relative;
      border-right: 1px solid rgba(255,255,255,.06);
    }

    .visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(59,130,246,.08) 0%, transparent 100%),
        radial-gradient(ellipse 50% 60% at 80% 20%, rgba(16,185,129,.05) 0%, transparent 100%);
      pointer-events: none;
    }

    .visual-brand { font-size: 1.25rem; font-weight: 700; color: #fafafa; position: relative; letter-spacing: -.02em; }
    .visual-brand span { color: #3b82f6; }

    .visual-bottom { position: relative; }
    .visual-bottom h2 { font-size: 1.6rem; font-weight: 700; color: #fafafa; line-height: 1.25; letter-spacing: -.02em; margin-bottom: 10px; }
    .visual-bottom p { color: #71717a; font-size: .85rem; line-height: 1.6; max-width: 280px; }

    /* ── Right panel ── */
    .panel {
      flex: 1;
      background: #09090b;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .panel h1 { font-size: 1.35rem; font-weight: 600; color: #fafafa; margin-bottom: 3px; letter-spacing: -.01em; }
    .panel .sub { color: #71717a; font-size: .85rem; margin-bottom: 22px; }

    /* ── OAuth ── */
    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.1);
      background: #18181b;
      color: #fafafa;
      font-size: .87rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
      font-family: inherit;
      margin-bottom: 20px;
    }
    .oauth-btn:hover { background: #1f1f23; border-color: rgba(255,255,255,.16); }
    .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
    .divider span { color: #52525b; font-size: .73rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; margin-bottom: 18px; background: #18181b; border-radius: 10px; padding: 3px; border: 1px solid rgba(255,255,255,.06); }
    .tab {
      flex: 1; padding: 9px; background: transparent; border: none; color: #71717a;
      cursor: pointer; font-size: .84rem; font-weight: 500; border-radius: 8px;
      transition: all .15s ease; font-family: inherit;
    }
    .tab.active { background: #27272a; color: #fafafa; }
    .tab:not(.active):hover { color: #a1a1aa; }

    /* ── Forms ── */
    .form { display: none; flex-direction: column; gap: 12px; }
    .form.active { display: flex; }

    .field input {
      width: 100%;
      padding: 11px 13px;
      background: #18181b;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: #fafafa;
      font-size: .87rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input::placeholder { color: #52525b; }
    .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

    .btn {
      width: 100%;
      padding: 11px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: .87rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s ease, transform .1s ease;
      margin-top: 2px;
    }
    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .error {
      color: #ef4444;
      font-size: .8rem;
      text-align: center;
      display: none;
      padding: 8px 12px;
      background: rgba(239,68,68,.08);
      border-radius: 8px;
      border: 1px solid rgba(239,68,68,.12);
    }

    .or-divider { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
    .or-divider span { color: #52525b; font-size: .73rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }

    /* ── Active lobbies ── */
    .lobbies-label { color: #52525b; font-size: .73rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; margin-top: 8px; margin-bottom: 4px; }
    .lobby-list { display: flex; flex-direction: column; gap: 5px; max-height: 110px; overflow-y: auto; }
    .lobby-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 12px; background: #18181b; border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px; cursor: pointer; transition: all .15s ease; font-family: inherit;
      color: #fafafa; font-size: .84rem;
    }
    .lobby-item:hover { border-color: rgba(59,130,246,.3); background: #1a1a1e; }
    .lobby-item .name { font-weight: 500; }
    .lobby-item .count { color: #71717a; font-size: .78rem; }

    /* ── User bar ── */
    .user-bar {
      display: none; align-items: center; justify-content: space-between;
      padding: 9px 13px; background: #18181b; border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px; margin-bottom: 14px;
    }
    .user-bar span { color: #3b82f6; font-size: .83rem; font-weight: 500; }
    .btn-sm {
      padding: 5px 12px; background: transparent; border: 1px solid rgba(255,255,255,.1);
      border-radius: 7px; color: #71717a; font-size: .78rem; cursor: pointer;
      font-family: inherit; transition: all .15s ease;
    }
    .btn-sm:hover { border-color: #ef4444; color: #ef4444; }

    @media (max-width: 768px) {
      .container { flex-direction: column; min-height: auto; }
      .visual { display: none; }
      .panel { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left visual -->
    <div class="visual">
      <div class="visual-brand">glox<span>.</span></div>
      <div class="visual-bottom">
        <h2>Start a conversation,<br>join the room.</h2>
        <p>Pick a lobby or create your own. Real-time chat, no setup required.</p>
      </div>
    </div>

    <!-- Right panel -->
    <div class="panel">
      <h1 id="heading">Welcome to Glox</h1>
      <p class="sub" id="subText">Sign in or create an account to get started.</p>

      <!-- User bar (shown when signed in) -->
      <div id="userBar" class="user-bar">
        <span id="userDisplay"></span>
        <button class="btn-sm" onclick="handleSignOut()">sign out</button>
      </div>

      <!-- OAuth -->
      <button class="oauth-btn" onclick="signInWithGitHub()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <!-- Tabs: Sign In / Sign Up -->
      <div class="tabs" id="authTabs">
        <button class="tab active" onclick="showTab('login')">Sign in</button>
        <button class="tab" onclick="showTab('signup')">Create account</button>
      </div>

      <!-- Sign In -->
      <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
        <div class="field"><input type="email" id="loginEmail" placeholder="Email" required></div>
        <div class="field"><input type="password" id="loginPass" placeholder="Password" required minlength="6"></div>
        <button type="submit" class="btn" id="loginBtn">Sign in</button>
        <div id="loginError" class="error"></div>
      </form>

      <!-- Sign Up -->
      <form id="signupForm" class="form" onsubmit="handleSignup(event)">
        <div class="field"><input type="text" id="signupName" placeholder="Display name" maxlength="20" required></div>
        <div class="field"><input type="email" id="signupEmail" placeholder="Email" required></div>
        <div class="field"><input type="password" id="signupPass" placeholder="Password" required minlength="6"></div>
        <button type="submit" class="btn" id="signupBtn">Create account</button>
        <div id="signupError" class="error"></div>
      </form>

      <!-- Guest join -->
      <div class="or-divider"><span>or join without an account</span></div>

      <form id="guestForm" onsubmit="handleGuest(event)" autocomplete="off" style="display:flex;flex-direction:column;gap:12px;">
        <div class="field"><input type="text" id="guestName" placeholder="Your name" maxlength="20" required></div>
        <div class="field"><input type="text" id="lobbyName" placeholder="Lobby name" maxlength="30" required></div>
        <button type="submit" class="btn">Join lobby</button>
      </form>

      <!-- Active lobbies -->
      <p class="lobbies-label" id="lobbiesLabel" style="display:none;">Active lobbies</p>
      <div id="lobbyList" class="lobby-list"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const guestForm = document.getElementById('guestForm');
    const userBar = document.getElementById('userBar');
    const userDisplay = document.getElementById('userDisplay');
    const heading = document.getElementById('heading');
    const subText = document.getElementById('subText');
    const lobbyList = document.getElementById('lobbyList');
    const lobbiesLabel = document.getElementById('lobbiesLabel');

    let currentUser = null;

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
      });
      loginForm.classList.toggle('active', tab === 'login');
      signupForm.classList.toggle('active', tab === 'signup');
    }

    // Auth session check
    (async () => {
      try {
        const session = await getSession();
        if (session && session.user) {
          currentUser = session.user;
          const name = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email;
          document.getElementById('guestName').value = name;
          document.getElementById('guestName').readOnly = true;
          userDisplay.textContent = name;
          userBar.style.display = 'flex';
          heading.textContent = 'Welcome back';
          subText.textContent = `Signed in as ${name}`;
          document.getElementById('authTabs').style.display = 'none';
          loginForm.style.display = 'none';
          signupForm.style.display = 'none';
          document.querySelector('.or-divider span').textContent = 'pick a lobby';
        } else {
          const saved = localStorage.getItem('glox_username');
          if (saved) document.getElementById('guestName').value = saved;
        }
      } catch {
        const saved = localStorage.getItem('glox_username');
        if (saved) document.getElementById('guestName').value = saved;
      }
    })();

    async function handleSignOut() {
      await signOut();
      localStorage.removeItem('glox_username');
      window.location.href = '/';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in...'; errEl.style.display = 'none';
      try {
        await signInWithEmail(document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
      } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const errEl = document.getElementById('signupError');
      btn.disabled = true; btn.textContent = 'Creating account...'; errEl.style.display = 'none';
      try {
        await signUpWithEmail(
          document.getElementById('signupEmail').value,
          document.getElementById('signupPass').value,
          document.getElementById('signupName').value
        );
        errEl.textContent = 'Check your email for a confirmation link.';
        errEl.style.color = '#22c55e';
        errEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block'; errEl.style.color = '#ef4444';
      } finally { btn.disabled = false; btn.textContent = 'Create account'; }
    }

    function handleGuest(e) {
      e.preventDefault();
      const name = document.getElementById('guestName').value.trim();
      const lobby = document.getElementById('lobbyName').value.trim();
      if (!name || !lobby) return;
      localStorage.setItem('glox_username', name);
      listWs.close();
      let url = `/chat?lobby=${encodeURIComponent(lobby)}&username=${encodeURIComponent(name)}`;
      if (currentUser) url += `&token=${currentUser.access_token}`;
      window.location.href = url;
    }

    // Lobby list via WebSocket
    const wsHost = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, '') : location.host;
    const proto = (typeof WS_URL !== 'undefined' && WS_URL && WS_URL.startsWith('wss')) ? 'wss' : location.protocol === 'https:' ? 'wss' : 'ws';
    const listWs = new WebSocket(`${proto}://${wsHost}`);

    listWs.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'lobby_list') {
        if (msg.lobbies.length) {
          lobbiesLabel.style.display = 'block';
          lobbyList.innerHTML = msg.lobbies.map(l => `
            <button class="lobby-item" data-name="${l.name}">
              <span class="name">#${l.name}</span>
              <span class="count">${l.count} ${l.count === 1 ? 'person' : 'people'}</span>
            </button>
          `).join('');
          lobbyList.querySelectorAll('.lobby-item').forEach(btn => {
            btn.addEventListener('click', () => {
              document.getElementById('lobbyName').value = btn.dataset.name;
              guestForm.dispatchEvent(new Event('submit'));
            });
          });
        } else {
          lobbiesLabel.style.display = 'none';
          lobbyList.innerHTML = '';
        }
      }
    };
  </script>
</body>
</html>
