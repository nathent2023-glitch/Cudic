    <style>
        body {
            display: flex;
            overflow: hidden;
            height: 100%;
        }

        .games-layout {
            flex: 1;
            width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--panel);
        }

        .games-content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .game-card:hover {
            border-color: var(--signal);
        }

        .game-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 2rem;
        }

        .game-thumb svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .game-info {
            padding: 12px 14px;
        }

        .game-title {
            font-family: var(--font-head);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .game-creator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-creator-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--signal-tint);
            color: var(--signal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .game-creator-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .game-creator-id {
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        /* ── Your Projects: split action bar ──
           Two halves pinned to the corners, hairline above + hairline down
           the middle. Hovering one slides it across to cover the whole bar. */
        .game-actions {
            position: relative;
            display: flex;
            align-items: stretch;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }

        .game-actions::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--line);
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .game-actions button {
            flex: 1 1 0;
            min-width: 0;
            /* No horizontal padding — it can never shrink below 0 with it,
               which left a visible sliver of the other button behind. */
            padding: 11px 0;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            border: none;
            border-radius: 0;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            transition: flex-grow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.2s ease,
                        background 0.15s ease,
                        color 0.15s ease;
        }

        .game-actions .ga-primary { color: var(--signal); }
        .game-actions .ga-danger { color: var(--danger); }

        /* Hovered half swallows the bar; the other collapses away. */
        .game-actions:hover::after { opacity: 0; }
        .game-actions:hover button { flex-grow: 0; opacity: 0; }
        .game-actions button:hover { flex-grow: 1; opacity: 1; }

        .game-actions .ga-primary:hover { background: var(--signal-tint); }
        .game-actions .ga-danger:hover { background: rgba(224, 68, 46, 0.10); }

        /* Touch / no-hover: keep both readable at 50/50. */
        @media (hover: none) {
            .game-actions:hover button { flex-grow: 1; opacity: 1; }
            .game-actions::after { opacity: 1; }
        }

        /* ── Micro-motion (GSAP, progressive enhancement) ── */
        #tabsBar { position: relative; }
        #tabInk {
            position: absolute; bottom: -1px; left: 0;
            height: 2px; width: 0; background: var(--signal);
            border-radius: 2px; pointer-events: none;
        }
        .dotlayer {
            position: absolute; inset: 0; pointer-events: none;
            background-image: radial-gradient(circle, rgba(46, 42, 75, 0.10) 1px, transparent 1px);
            background-size: 34px 34px; opacity: 0.7;
        }
        .empty-glow {
            position: absolute; top: -70px; left: 50%;
            width: 220px; height: 220px; margin-left: -110px;
            background: radial-gradient(circle, var(--signal-tint) 0%, transparent 65%);
            pointer-events: none;
        }
        .empty-icon-circle { will-change: transform; }
        .empty-card .btn { will-change: transform; }
        #emptyText.typing::after {
            content: '▍'; color: var(--signal);
            animation: caret 0.8s steps(1) infinite;
        }
        @keyframes caret { 50% { opacity: 0; } }
    </style>
</head>

    <script>    var grid = document.getElementById('gameGrid'), empty = document.getElementById('emptyState'), content = document.getElementById('gamesContent'), tabBrowse = document.getElementById('tabBrowse'), tabMine = document.getElementById('tabMine'), emptyTitle = document.getElementById('emptyTitle'), emptyText = document.getElementById('emptyText'); var apiBase = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, 'https://') : ''; function getToken() { var p = new URLSearchParams(window.location.search).get('token'); if (p) return p; try { var r = localStorage.getItem('sb-opimjwmgmzwapkzgxvhk-auth-token'); return r ? JSON.parse(r).access_token : null; } catch (e) { return null } } function setTab(m) { var on = 'background:none;border:none;border-bottom:2px solid transparent;color:var(--text-primary);font:inherit;font-weight:600;padding:10px 4px;cursor:pointer', off = 'background:none;border:none;border-bottom:2px solid transparent;color:var(--text-tertiary);font:inherit;padding:10px 4px;cursor:pointer'; tabBrowse.style.cssText = m === 'browse' ? on : off; tabMine.style.cssText = m === 'mine' ? on : off; if (m === 'browse') loadGames(); else loadMine(); if (window.motionTab) motionTab(m); } tabBrowse.onclick = function () { setTab('browse') }; tabMine.onclick = function () { setTab('mine') }; function cardHtml(g, mine) { var thumb = g.thumbnail ? '<img src="' + g.thumbnail + '" style="width:100%;height:100%;object-fit:cover">' : '<svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7L12 3Z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>'; var badge = mine ? ' <span style="font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:99px;background:' + (g.published ? 'var(--signal-tint);color:var(--signal)' : 'var(--panel-raised);color:var(--text-tertiary);border:1px solid var(--line)') + '">' + (g.published ? 'Published' : 'Draft') + '</span>' : ''; var creator; if (mine) { creator = '<div class="game-creator"><div class="game-creator-name">You</div></div>'; } else { var owner = g.users || {}; var ownerName = owner.display_name || 'Unknown'; var ownerInit = ownerName.split(' ').map(function (w) { return w[0] }).join('').substring(0, 2).toUpperCase(); var ownerId = owner.user_id ? '#' + owner.user_id : ''; creator = '<div class="game-creator"><div class="game-creator-avatar">' + ownerInit + '</div><div><div class="game-creator-name">' + escapeHtml(ownerName) + '</div><div class="game-creator-id">' + ownerId + '</div></div></div>'; } var dest = mine ? '/studio?id=' + g.id : '/view.html?id=' + g.id; var actions = mine ? '<div class="game-actions">' +
      '<button class="' + (g.published ? 'ga-danger' : 'ga-primary') + '" onclick="event.stopPropagation();togglePublish(\'' + g.id + '\',' + (g.published ? 'false' : 'true') + ')">' + (g.published ? 'Unpublish' : 'Publish') + '</button>' +

    '</div>' : ''; return '<div class="game-card" onclick="window.location.href=\'' + dest + '\'">' + '<div class="game-thumb">' + thumb + '</div>' + '<div class="game-info">' + '<div class="game-title">' + escapeHtml(g.title) + badge + '</div>' + creator + '</div>' + actions + '</div>'; } function showGrid(list, mine) { grid.innerHTML = list.map(function (g) { return cardHtml(g, mine) }).join(''); grid.style.display = ''; empty.style.display = 'none'; content.style.overflowY = 'auto'; } function showEmpty(title, text) { emptyTitle.textContent = title; emptyText.textContent = text; grid.style.display = 'none'; empty.style.display = 'flex'; content.style.overflowY = 'hidden'; } async function loadGames() { try { var res = await fetch(apiBase + '/api/games'); var data = await res.json(); if (data.games && data.games.length) showGrid(data.games, false); else showEmpty('No games published yet', 'Publish your first game from the editor to see it here.'); } catch (e) { showEmpty('No games published yet', 'Publish your first game from the editor to see it here.'); } } async function loadMine() { var token = getToken(); if (!token) { showEmpty('Sign in to see your projects', 'Your studio projects live here once you sign in.'); return; } try { var res = await fetch(apiBase + '/api/games/mine', { headers: { 'Authorization': 'Bearer ' + token } }); if (res.status === 401) { showEmpty('Sign in to see your projects', 'Your studio projects live here once you sign in.'); return; } var data = await res.json(); if (data.games && data.games.length) showGrid(data.games, true); else showEmpty('No projects yet', 'Create your first project in Studio.'); } catch (e) { showEmpty('No projects yet', 'Create your first project in Studio.'); } } async function togglePublish(id, pub) { var token = getToken(); if (!token) return; try { var res = await fetch(apiBase + '/api/games/' + encodeURIComponent(id), { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '         else gsap.to(ink, { x: el.offsetLeft, width: el.offsetWidth, duration: D(0.35), ease: 'expo.out', overwrite: true });
