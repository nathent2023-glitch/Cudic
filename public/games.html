<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glox — Game Gallery</title>
    <link rel="stylesheet" href="/sidebar.css?v=7">
    <style>
        body {
            display: flex;
            overflow: hidden;
            height: 100%;
        }

        .games-layout {
            flex: 1;
            width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--panel);
        }

        .games-content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .game-card:hover {
            border-color: var(--signal);
        }

        .game-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 2rem;
        }

        .game-thumb svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .game-info {
            padding: 12px 14px;
        }

        .game-title {
            font-family: var(--font-head);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .game-creator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-creator-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--signal-tint);
            color: var(--signal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .game-creator-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .game-creator-id {
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }
    </style>
</head>

<body data-page="games">
    <div class="games-layout">
        <div class="topbar">
            <h1>Game gallery</h1> <a href="/studio" class="btn btn-ember"
                style="width:auto;padding:9px 16px;text-decoration:none"> <svg viewBox="0 0 24 24" width="16"
                    height="16" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round">
                    <path d="M12 5v14M5 12h14" />
                </svg> New game </a>
        </div>
        <div class="tabs" style="display:flex;gap:8px;padding:0 32px;border-bottom:1px solid var(--line)">
            <button id="tabBrowse" class="tabbtn" style="background:none;border:none;border-bottom:2px solid var(--signal);color:var(--text-primary);font:inherit;font-weight:600;padding:10px 4px;cursor:pointer">Browse</button>
            <button id="tabMine" class="tabbtn" style="background:none;border:none;border-bottom:2px solid transparent;color:var(--text-tertiary);font:inherit;padding:10px 4px;cursor:pointer">Your Projects</button>
        </div>
        <div class="games-content" id="gamesContent">
            <div class="grid" id="gameGrid"></div>
            <div class="empty-wrap dotgrid" id="emptyState" style="display:none;min-height:400px">
                <div class="empty-card">
                    <div class="empty-icon-circle"> <svg viewBox="0 0 24 24">
                            <rect x="3" y="8" width="18" height="9" rx="3" />
                            <path d="M8 11v3M6.5 12.5h3M16 12h.01M18 14h.01" />
                        </svg> </div>
                    <h2 id="emptyTitle">No games published yet</h2>
                    <p id="emptyText">Publish your first game from the editor to see it here.</p> <a href="/studio"
                        class="btn btn-primary" style="width:auto;padding:10px 20px;text-decoration:none"> <svg
                            viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.6"
                            fill="none" stroke-linecap="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg> Create a game </a>
                </div>
            </div>
        </div>
    </div>
    <script src="/config.js"></script>
    <script src="/sidebar.js"></script>
    <script>    var grid = document.getElementById('gameGrid'), empty = document.getElementById('emptyState'), content = document.getElementById('gamesContent'), tabBrowse = document.getElementById('tabBrowse'), tabMine = document.getElementById('tabMine'), emptyTitle = document.getElementById('emptyTitle'), emptyText = document.getElementById('emptyText'); var apiBase = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, 'https://') : ''; function getToken() { var p = new URLSearchParams(window.location.search).get('token'); if (p) return p; try { var r = localStorage.getItem('sb-opimjwmgmzwapkzgxvhk-auth-token'); return r ? JSON.parse(r).access_token : null; } catch (e) { return null } } function setTab(m) { var on = 'background:none;border:none;border-bottom:2px solid var(--signal);color:var(--text-primary);font:inherit;font-weight:600;padding:10px 4px;cursor:pointer', off = 'background:none;border:none;border-bottom:2px solid transparent;color:var(--text-tertiary);font:inherit;padding:10px 4px;cursor:pointer'; tabBrowse.style.cssText = m === 'browse' ? on : off; tabMine.style.cssText = m === 'mine' ? on : off; if (m === 'browse') loadGames(); else loadMine(); } tabBrowse.onclick = function () { setTab('browse') }; tabMine.onclick = function () { setTab('mine') }; function cardHtml(g, mine) { var thumb = g.thumbnail ? '<img src="' + g.thumbnail + '" style="width:100%;height:100%;object-fit:cover">' : '<svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7L12 3Z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>'; var badge = mine ? ' <span style="font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:99px;background:' + (g.published ? 'var(--signal-tint);color:var(--signal)' : 'var(--panel-raised);color:var(--text-tertiary);border:1px solid var(--line)') + '">' + (g.published ? 'Published' : 'Draft') + '</span>' : ''; var creator; if (mine) { creator = '<div class="game-creator"><div class="game-creator-name">You</div></div>'; } else { var owner = g.users || {}; var ownerName = owner.display_name || 'Unknown'; var ownerInit = ownerName.split(' ').map(function (w) { return w[0] }).join('').substring(0, 2).toUpperCase(); var ownerId = owner.user_id ? '#' + owner.user_id : ''; creator = '<div class="game-creator"><div class="game-creator-avatar">' + ownerInit + '</div><div><div class="game-creator-name">' + escapeHtml(ownerName) + '</div><div class="game-creator-id">' + ownerId + '</div></div></div>'; } var dest = mine ? '/studio?id=' + g.id : '/view.html?id=' + g.id; return '<div class="game-card" onclick="window.location.href=\'' + dest + '\'">' + '<div class="game-thumb">' + thumb + '</div>' + '<div class="game-info">' + '<div class="game-title">' + escapeHtml(g.title) + badge + '</div>' + creator + '</div></div>'; } function showGrid(list, mine) { grid.innerHTML = list.map(function (g) { return cardHtml(g, mine) }).join(''); grid.style.display = ''; empty.style.display = 'none'; content.style.overflowY = 'auto'; } function showEmpty(title, text) { emptyTitle.textContent = title; emptyText.textContent = text; grid.style.display = 'none'; empty.style.display = 'flex'; content.style.overflowY = 'hidden'; } async function loadGames() { try { var res = await fetch(apiBase + '/api/games'); var data = await res.json(); if (data.games && data.games.length) showGrid(data.games, false); else showEmpty('No games published yet', 'Publish your first game from the editor to see it here.'); } catch (e) { showEmpty('No games published yet', 'Publish your first game from the editor to see it here.'); } } async function loadMine() { var token = getToken(); if (!token) { showEmpty('Sign in to see your projects', 'Your studio projects live here once you sign in.'); return; } try { var res = await fetch(apiBase + '/api/games/mine', { headers: { 'Authorization': 'Bearer ' + token } }); if (res.status === 401) { showEmpty('Sign in to see your projects', 'Your studio projects live here once you sign in.'); return; } var data = await res.json(); if (data.games && data.games.length) showGrid(data.games, true); else showEmpty('No projects yet', 'Create your first project in Studio.'); } catch (e) { showEmpty('No projects yet', 'Create your first project in Studio.'); } } function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML } setTab('browse');  </script>
</body>

</html>
