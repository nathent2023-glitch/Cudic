<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 400 260" width="1600" height="1040" shape-rendering="crispEdges"><style>@keyframes blink{50%{opacity:0}}@keyframes bob{50%{transform:translateY(-2px)}}@keyframes drift{to{transform:translateX(12px)}}@keyframes swing{50%{transform:translateY(1px)}}@keyframes eb{0%,93%{opacity:0}94%,100%{opacity:1}}@keyframes jump{30%,60%{transform:translateY(-7px)}}
.caret,.pulse{animation:blink 1s steps(1) infinite}.tw1{animation:blink 2.4s steps(1) infinite}.tw2{animation:blink 2.4s steps(1) infinite -1.2s}
.bob{animation:bob 2s steps(2) infinite}.cl{animation:drift 16s steps(12) infinite alternate}.legA{animation:swing 1s steps(1) infinite}.legB{animation:swing 1s steps(1) infinite -.5s}.eb{animation:eb 4.5s steps(1) infinite}
.jump{animation:jump .5s steps(5) 1!important}.acc rect{fill:var(--acc,#3f7cff)}.acct rect{fill:var(--acct,#f7f5ec)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(20 22)"><g class="cl" style="animation-duration:14s;animation-delay:-0s;animation-direction:alternate"><rect x="0" y="6" width="38" height="2" fill="#1b2352"/><rect x="0" y="4" width="38" height="2" fill="#242c5c"/><rect x="6" y="2" width="26" height="2" fill="#242c5c"/><rect x="11" y="0" width="15" height="2" fill="#2f3a78"/></g></g><g transform="translate(205 14)"><g class="cl" style="animation-duration:17s;animation-delay:-4s;animation-direction:alternate-reverse"><rect x="0" y="6" width="46" height="2" fill="#1b2352"/><rect x="0" y="4" width="46" height="2" fill="#242c5c"/><rect x="7" y="2" width="32" height="2" fill="#242c5c"/><rect x="14" y="0" width="18" height="2" fill="#2f3a78"/></g></g><g transform="translate(120 58)"><g class="cl" style="animation-duration:20s;animation-delay:-8s;animation-direction:alternate"><rect x="0" y="6" width="30" height="2" fill="#1b2352"/><rect x="0" y="4" width="30" height="2" fill="#242c5c"/><rect x="4" y="2" width="21" height="2" fill="#242c5c"/><rect x="9" y="0" width="12" height="2" fill="#2f3a78"/></g></g><g transform="translate(250 82)"><g class="cl" style="animation-duration:23s;animation-delay:-12s;animation-direction:alternate-reverse"><rect x="0" y="6" width="34" height="2" fill="#1b2352"/><rect x="0" y="4" width="34" height="2" fill="#242c5c"/><rect x="5" y="2" width="23" height="2" fill="#242c5c"/><rect x="10" y="0" width="13" height="2" fill="#2f3a78"/></g></g><g transform="translate(40 96)"><g class="cl" style="animation-duration:26s;animation-delay:-16s;animation-direction:alternate"><rect x="0" y="6" width="40" height="2" fill="#1b2352"/><rect x="0" y="4" width="40" height="2" fill="#242c5c"/><rect x="6" y="2" width="28" height="2" fill="#242c5c"/><rect x="12" y="0" width="16" height="2" fill="#2f3a78"/></g></g></svg>