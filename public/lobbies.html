<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Glox — Lobbies</title>  <link rel="stylesheet" href="/sidebar.css?v=5">  <style>    body { display: flex; overflow: hidden; height: 100%; }    .lobbies-layout { flex: 1; width: 0; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--panel); }    .lobbies-content { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; align-items: center; }    .lobbies-card { width: 100%; max-width: 560px; background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 24px; }    .lobbies-card h2 { font-family: var(--font-head); font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }    .lobbies-card p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 18px; }    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }    .field label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }    .field input { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--text-primary); font-size: 0.9rem; font-family: inherit; outline: none; }    .field input:focus { border-color: var(--signal); }    .field input:disabled { opacity: 0.6; }    .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; margin-bottom: 14px; }    .check-row input { accent-color: var(--signal); width: 16px; height: 16px; }    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; width: 100%; max-width: 860px; }    .lobby-card { background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s; }    .lobby-card:hover { border-color: var(--signal); }    .lobby-head { display: flex; align-items: center; justify-content: space-between; }    .lobby-name { font-family: var(--font-head); font-weight: 600; font-size: 1rem; }    .lobby-count { font-size: 0.75rem; color: var(--text-tertiary); }    .badge { padding: 2px 7px; border-radius: 4px; font-weight: 500; font-size: 0.65rem; }    .badge-persist { background: rgba(79,216,151,0.12); color: #4FD897; }    .badge-temp { background: rgba(255,255,255,0.06); color: var(--text-tertiary); }  </style></head><body data-page="chat">  <div class="lobbies-layout">    <div class="topbar"><h1>Lobbies</h1></div>    <div class="lobbies-content">      <div class="lobbies-card">        <h2>Join a lobby</h2>        <p>Pick a name and a lobby to start chatting. <span id="welcomeHint" style="color:var(--text-tertiary)">#welcome and #hello are always there.</span></p>        <div class="field"><label>Your name</label><input type="text" id="joinName" placeholder="Nathen" maxlength="20"></div>        <div class="field"><label>Lobby name</label><input type="text" id="joinLobby" placeholder="e.g. friday-jam" maxlength="30"></div>        <label class="check-row"><input type="checkbox" id="joinPersist"> Save chat history (persistent)</label>        <button class="btn btn-primary" id="joinBtn" style="width:100%;padding:11px">Join lobby</button>      </div>      <div style="width:100%;max-width:860px">        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">          <h3 style="font-family:var(--font-head);font-weight:600;">Active lobbies</h3>          <span id="lobbyCount" style="font-size:0.8rem;color:var(--text-tertiary)"></span>        </div>        <div class="grid" id="lobbyGrid"></div>        <div id="emptyLobbies" style="display:none;text-align:center;padding:32px;color:var(--text-tertiary);font-size:0.85rem">No active lobbies — be the first to create one!</div>      </div>    </div>  </div>  <script src="/config.js"></script>  <script src="/sidebar.js"></script>  <script>    (function(){      var nameEl=document.getElementById('joinName'), lobbyEl=document.getElementById('joinLobby'), persistEl=document.getElementById('joinPersist');      var grid=document.getElementById('lobbyGrid'), emptyEl=document.getElementById('emptyLobbies'), countEl=document.getElementById('lobbyCount');      var joinBtn=document.getElementById('joinBtn');      /* Pre-fill name from auth or localStorage */ try{        var raw=localStorage.getItem('sb-opimjwmgmzwapkzgxvhk-auth-token');        if(raw){          var s=JSON.parse(raw), parts=s.access_token.split('.'), payload=JSON.parse(atob(parts[1]));          var n=payload.user_metadata?.full_name||payload.user_metadata?.name||payload.email||'';          if(n) { nameEl.value=n; nameEl.disabled=true; }          window.currentToken=s.access_token;        }      }catch(e){}      if(!nameEl.value) {        var saved=localStorage.getItem('glox_username');        if(saved) nameEl.value=saved;      }      joinBtn.onclick=function(){        var name=nameEl.value.trim(), lobby=lobbyEl.value.trim();        if(!name||!lobby){ nameEl.style.borderColor='var(--danger)'; lobbyEl.style.borderColor='var(--danger)'; setTimeout(function(){nameEl.style.borderColor='';lobbyEl.style.borderColor='';},1500); return; }        localStorage.setItem('glox_username', name);        var url='/chat?lobby='+encodeURIComponent(lobby)+'&username='+encodeURIComponent(name);        if(persistEl.checked) url+='&persistent=1';        if(window.currentToken) url+='&token='+window.currentToken;        window.location.href=url;      };      [nameEl,lobbyEl].forEach(function(el){ el.addEventListener('keydown',function(e){ if(e.key==='Enter') joinBtn.click(); }); });      /* Lobby list via WebSocket */ var wsHost=(typeof WS_URL!=='undefined'&&WS_URL)?WS_URL.replace(/^wss?:\/\//,''):location.host;      var proto=(typeof WS_URL!=='undefined'&&WS_URL&&WS_URL.startsWith('wss'))?'wss':location.protocol==='https:'?'wss':'ws';      var ws=new WebSocket(proto+'://'+wsHost);      ws.onmessage=function(e){        try{          var msg=JSON.parse(e.data);          if(msg.type==='lobby_list'){            renderLobbies(msg.lobbies||[]);          }        }catch(err){}      };      function renderLobbies(list){        /* Filter out server lobbies */ list=list.filter(function(l){ return !l.name.startsWith('server:'); });        countEl.textContent=list.length?list.length+' online':'';        if(!list.length){ grid.innerHTML=''; emptyEl.style.display='block'; return; }        emptyEl.style.display='none';        grid.innerHTML=list.map(function(l){          var isPersist=['welcome','hello'].includes(l.name);          var badge=isPersist?'<span class="badge badge-persist">Persistent</span>':'<span class="badge badge-temp">24h</span>';          return '<div class="lobby-card">'            +'<div class="lobby-head"><span class="lobby-name">#'+escapeHtml(l.name)+'</span>'+badge+'</div>'            +'<div class="lobby-count">'+l.count+(l.count===1?' person':' people')+' online</div>'            +'<button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="joinExisting(\''+escapeHtml(l.name)+'\')">Join</button>'            +'</div>';        }).join('');      }      window.joinExisting=function(name){        lobbyEl.value=name;        joinBtn.click();      };      function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }    })();  </script>    </body></html>
