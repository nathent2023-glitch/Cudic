<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glox — Game Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0d0e10;color:#fafdff;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}
    .topbar{display:flex;align-items:center;gap:6px;padding:0 12px;background:#16171a;border-bottom:1px solid rgba(255,255,255,.06);z-index:10;height:42px;flex-shrink:0}
    .brand{font-weight:800;font-size:1rem;letter-spacing:-.03em;margin-right:8px}
    .brand span{color:#bfff3c}
    .nav-btn{color:#68aed4;text-decoration:none;font-size:.78rem;font-weight:500;padding:5px 10px;border-radius:7px;transition:all .12s}
    .nav-btn:hover{color:#fafdff;background:rgba(255,255,255,.06)}
    .sep{width:1px;height:18px;background:rgba(255,255,255,.07);margin:0 2px}
    .title-input{background:transparent;border:none;color:#fafdff;font-size:.84rem;font-weight:600;font-family:inherit;width:180px;outline:none;padding:4px 8px;border-radius:6px}
    .title-input:focus{background:rgba(255,255,255,.06)}
    .spacer{flex:1}
    .btn{padding:5px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fafdff;font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
    .btn:hover{background:rgba(255,255,255,.08)}
    .btn.primary{background:#bfff3c;color:#16171a;border-color:#bfff3c}
    .btn.play{background:#10d275;color:#fff;border-color:#10d275}
    .btn.play:hover{background:#0eb868}
    .main-wrap{display:flex;flex:1;overflow:hidden}
    .panel-left{width:200px;flex-shrink:0;background:#131416;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}
    .panel-header{padding:8px 12px;font-size:.7rem;font-weight:600;color:#52525b;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-between}
    .panel-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.04)}
    .panel-tab{flex:1;padding:8px;text-align:center;font-size:.7rem;font-weight:600;color:#52525b;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
    .panel-tab.active{color:#bfff3c;border-bottom-color:#bfff3c}
    .panel-tab:hover{color:#fafdff}
    .panel-content{flex:1;overflow-y:auto;padding:4px}
    .panel-content.hidden{display:none}
    .h-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.78rem;color:#aaa;transition:all .1s}
    .h-item:hover{background:rgba(255,255,255,.04);color:#fafdff}
    .h-item.selected{background:rgba(191,255,60,.08);color:#bfff3c}
    .h-icon{width:14px;text-align:center;font-size:.68rem;font-weight:700}
    .ctx-menu{position:fixed;z-index:200;background:#1a1b1e;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;max-height:70vh;overflow-y:auto}
    .ctx-menu.open{display:block}
    .ctx-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;font-size:.76rem;color:#aaa;cursor:pointer;transition:all .08s}
    .ctx-item:hover{background:rgba(191,255,60,.08);color:#fafdff}
    .ctx-item .ctx-icon{width:18px;text-align:center;font-size:.7rem;font-weight:700;color:#52525b}
    .ctx-sep{height:1px;background:rgba(255,255,255,.06);margin:3px 6px}
    .ctx-item.danger{color:#ff2674}
    .ctx-item.danger:hover{background:rgba(255,38,116,.1)}
    .panel-label{font-size:.65rem;color:#52525b;font-weight:600;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
    .center-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .toolbar{display:flex;align-items:center;gap:3px;padding:4px 10px;background:#111214;border-bottom:1px solid rgba(255,255,255,.04);height:32px;flex-shrink:0}
    .t-btn{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:none;background:transparent;color:#666;font-size:.72rem;cursor:pointer;font-weight:700;transition:all .1s}
    .t-btn:hover{background:rgba(255,255,255,.06);color:#fafdff}
    .t-btn.active{background:rgba(191,255,60,.1);color:#bfff3c}
    .t-sep{width:1px;height:16px;background:rgba(255,255,255,.05);margin:0 3px}
    .viewport{flex:1;position:relative;overflow:hidden;background:#252630;min-height:100px}
    .viewport canvas{display:block;width:100%!important;height:100%!important}
    .bottom-resize{height:5px;cursor:ns-resize;background:#131416;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0}
    .bottom-resize:hover{background:rgba(191,255,60,.3)}
    .bottom{height:200px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;background:#131416;flex-shrink:0}
    .bottom.collapsed{height:28px;min-height:28px}
    .bottom-tabs{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.04);height:28px;flex-shrink:0}
    .bottom-tab{padding:4px 14px;font-size:.7rem;font-weight:600;color:#52525b;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
    .bottom-tab.active{color:#bfff3c;border-bottom-color:#bfff3c}
    .bottom-tab:hover{color:#fafdff}
    .bottom-spacer{flex:1}
    .bottom-content{flex:1;overflow:hidden;position:relative}
    .bottom-content.hidden{display:none}
    #console{padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:.72rem;overflow-y:auto;height:100%;color:#aaa}
    .log-info{color:#68aed4}.log-warn{color:#ffd100}.log-error{color:#ff2674}
    .log-info::before{content:'[INFO] ';font-weight:600}
    .log-warn::before{content:'[WARN] ';font-weight:600}
    .log-error::before{content:'[ERROR] ';font-weight:600}
    .panel-right{width:260px;flex-shrink:0;background:#131416;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}
    .panel-right .panel-content{overflow-y:auto;padding:0}
    .prop-group{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
    .prop-group label{display:block;font-size:.68rem;font-weight:600;color:#52525b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
    .prop-row{display:flex;gap:5px;align-items:center;margin-bottom:5px}
    .prop-row span{font-size:.7rem;color:#666;width:16px;text-align:center;flex-shrink:0}
    .p-input{flex:1;padding:4px 7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:5px;color:#fafdff;font-size:.76rem;font-family:inherit;outline:none}
    .p-input:focus{border-color:#bfff3c}
    .p-input[type="color"]{padding:2px;height:26px;cursor:pointer}
    .empty-state{padding:20px 12px;text-align:center;color:#52525b;font-size:.76rem;line-height:1.5}
    .script-tag{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;margin:2px;border-radius:5px;background:rgba(191,255,60,.06);border:1px solid rgba(191,255,60,.12);font-size:.7rem;color:#bfff3c;cursor:pointer}
    .script-tag:hover{background:rgba(191,255,60,.12)}
    .script-tag .del{color:#ff2674;font-size:.65rem;padding:0 3px;border-radius:3px}
    .script-tag .del:hover{background:rgba(255,38,116,.15)}
    .add-btn{display:block;width:100%;padding:6px;margin-top:6px;border-radius:6px;border:1px dashed rgba(255,255,255,.08);background:transparent;color:#52525b;font-size:.72rem;cursor:pointer;font-family:inherit;transition:all .12s}
    .add-btn:hover{border-color:#bfff3c;color:#bfff3c}
    .play-overlay{position:fixed;inset:0;z-index:100;background:#000;display:none}
    .play-overlay.active{display:flex;flex-direction:column}
    .play-overlay iframe{flex:1;width:100%;border:none}
    .play-bar{height:32px;background:#16171a;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
    .play-bar .btn{font-size:.72rem;padding:4px 12px}
    .p-select{flex:1;padding:4px 7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:5px;color:#fafdff;font-size:.76rem;font-family:inherit;outline:none}
    .p-select option{background:#131416;color:#fafdff}
    .file-tree{padding:6px 0}
    .file-item{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:.76rem;color:#aaa;cursor:pointer;transition:all .1s}
    .file-item:hover{background:rgba(255,255,255,.04);color:#fafdff}
    .file-item.active{color:#bfff3c;background:rgba(191,255,60,.06)}
    .file-item .fi{font-size:.7rem;color:#52525b}
    .file-item.folder .fi{color:#ffd100}
    .shader-preview{height:60px;border-radius:6px;border:1px solid rgba(255,255,255,.06);margin:6px 0;background:#1a1b1e;overflow:hidden}
    .cam-preview{position:absolute;bottom:0;right:0;width:220px;height:165px;background:#1a1b1e;border:1px solid rgba(255,255,255,.08);border-radius:6px 0 0 0;overflow:hidden;z-index:5;display:none}
    .cam-preview.active{display:block}
    .cam-preview-label{position:absolute;top:4px;left:6px;font-size:.6rem;color:#bfff3c;font-weight:600;text-transform:uppercase;letter-spacing:.04em;z-index:6;pointer-events:none}
    .cam-preview canvas{display:block;width:100%;height:100%}
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">glox<span>.</span></div>
  <a href="/" class="nav-btn">&#8592; Home</a>
  <a href="/games" class="nav-btn">Gallery</a>
  <div class="sep"></div>
  <input class="title-input" id="gameTitle" value="Untitled Game" spellcheck="false">
  <div class="spacer"></div>
  <span style="font-size:.65rem;color:#444;margin-right:4px" id="undoHint"></span>
  <button class="btn" id="btnSave">Save</button>
  <button class="btn primary" id="btnPublish">Publish</button>
  <button class="btn play" id="btnPlay">&#9654; Play</button>
</div>

<div class="main-wrap">
  <div class="panel-left">
    <div class="panel-header">Scene <span style="font-size:.6rem;color:#444" id="objCount">0 objects</span></div>
    <div class="panel-content" id="hierarchyPanel"><div id="hierarchy"></div></div>
  </div>

  <div class="center-col">
    <div class="toolbar">
      <button class="t-btn" id="btnUndo" title="Undo (Ctrl+Z)">&#8617;</button>
      <button class="t-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">&#8618;</button>
      <div class="t-sep"></div>
      <button class="t-btn active" id="toolMove" data-tool="translate" title="Move (G)">&#432;</button>
      <button class="t-btn" id="toolRotate" data-tool="rotate" title="Rotate (R)">&#8635;</button>
      <button class="t-btn" id="toolScale" data-tool="scale" title="Scale (S)">&#8644;</button>
      <div class="t-sep"></div>
      <button class="t-btn" id="btnDup" title="Duplicate (Ctrl+D)">D+</button>
      <button class="t-btn" id="btnDel" title="Delete (Del)" style="color:#ff2674">X</button>
      <div class="t-sep"></div>
      <button class="t-btn" id="btnGrid" title="Grid">G</button>
      <button class="t-btn" id="btnWire" title="Wireframe">W</button>
    </div>
    <div class="viewport" id="viewport"><div class="cam-preview" id="camPreview"><div class="cam-preview-label">Camera Preview</div><canvas id="camPreviewCanvas"></canvas></div></div>
    <div class="bottom-resize" id="bottomHandle"></div>
    <div class="bottom" id="bottomPanel">
      <div class="bottom-tabs">
        <div class="bottom-tab active" data-btab="code">&#9998; Code</div>
        <div class="bottom-tab" data-btab="console">&#9638; Console</div>
        <div class="bottom-tab" data-btab="files">&#128193; Files</div>
        <div class="bottom-spacer"></div>
        <button class="t-btn" id="btnToggleBottom" title="Toggle">&#9660;</button>
      </div>
      <div class="bottom-content" id="codePanel"><div id="monacoEditor" style="width:100%;height:100%"></div></div>
      <div class="bottom-content hidden" id="consolePanel"><div id="console"></div></div>
      <div class="bottom-content hidden" id="filesPanel">
        <div class="file-tree" id="fileTree"></div>
      </div>
    </div>
  </div>

  <div class="panel-right">
    <div class="panel-tabs">
      <div class="panel-tab active" data-right="props">Inspector</div>
      <div class="panel-tab" data-right="scripts">Scripts</div>
      <div class="panel-tab" data-right="material">Material</div>
    </div>
    <div class="panel-content" id="propsPanel">
      <div class="empty-state" id="propsEmpty">Select an object to inspect its properties</div>
      <div id="propsContent" style="display:none">
        <div class="prop-group"><label>Name</label><input class="p-input" id="propName"></div>
        <div class="prop-group">
          <label>Position</label>
          <div class="prop-row"><span>X</span><input class="p-input" id="propPosX" type="number" step="0.1"></div>
          <div class="prop-row"><span>Y</span><input class="p-input" id="propPosY" type="number" step="0.1"></div>
          <div class="prop-row"><span>Z</span><input class="p-input" id="propPosZ" type="number" step="0.1"></div>
        </div>
        <div class="prop-group">
          <label>Rotation</label>
          <div class="prop-row"><span>X</span><input class="p-input" id="propRotX" type="number" step="1"></div>
          <div class="prop-row"><span>Y</span><input class="p-input" id="propRotY" type="number" step="1"></div>
          <div class="prop-row"><span>Z</span><input class="p-input" id="propRotZ" type="number" step="1"></div>
        </div>
        <div class="prop-group">
          <label>Scale</label>
          <div class="prop-row"><span>X</span><input class="p-input" id="propScaleX" type="number" step="0.1" min="0.01"></div>
          <div class="prop-row"><span>Y</span><input class="p-input" id="propScaleY" type="number" step="0.1" min="0.01"></div>
          <div class="prop-row"><span>Z</span><input class="p-input" id="propScaleZ" type="number" step="0.1" min="0.01"></div>
        </div>
        <div class="prop-group" id="cameraAttachGroup" style="display:none">
          <label>Attach To Object</label>
          <select class="p-select" id="cameraAttach"><option value="">None (Free Camera)</option></select>
        </div>
      </div>
    </div>
    <div class="panel-content hidden" id="scriptsPanel">
      <div class="empty-state" id="scriptsEmpty">Select an object to manage scripts</div>
      <div id="scriptsContent" style="display:none;padding:8px 12px">
        <div id="scriptList"></div>
        <button class="add-btn" id="btnAddScript">+ Add Script</button>
      </div>
    </div>
    <div class="panel-content hidden" id="materialPanel">
      <div class="empty-state" id="matEmpty">Select an object to edit material</div>
      <div id="matContent" style="display:none">
        <div class="prop-group">
          <label>Type</label>
          <select class="p-select" id="matType">
            <option value="standard">Standard (PBR)</option>
            <option value="phong">Phong</option>
            <option value="lambert">Lambert</option>
            <option value="toon">Toon</option>
            <option value="shader">Custom Shader</option>
          </select>
        </div>
        <div class="prop-group" id="matColorGroup">
          <label>Color</label>
          <div class="prop-row"><input class="p-input" id="matColor" type="color"><input class="p-input" id="matColorHex" value="#bfff3c"></div>
        </div>
        <div class="prop-group" id="matMetalnessGroup">
          <label>Metalness</label>
          <div class="prop-row"><input class="p-input" id="matMetalness" type="range" min="0" max="1" step="0.01" value="0.1"></div>
        </div>
        <div class="prop-group" id="matRoughnessGroup">
          <label>Roughness</label>
          <div class="prop-row"><input class="p-input" id="matRoughness" type="range" min="0" max="1" step="0.01" value="0.6"></div>
        </div>
        <div class="prop-group" id="matEmissiveGroup" style="display:none">
          <label>Emissive</label>
          <div class="prop-row"><input class="p-input" id="matEmissive" type="color" value="#000000"></div>
        </div>
        <div class="prop-group" id="matShininessGroup" style="display:none">
          <label>Shininess</label>
          <div class="prop-row"><input class="p-input" id="matShininess" type="range" min="0" max="100" step="1" value="30"></div>
        </div>
        <div class="prop-group" id="matShaderGroup" style="display:none">
          <label>Vertex Shader</label>
          <textarea class="p-input" id="matVertShader" rows="4" style="width:100%;font-family:monospace;font-size:.7rem;resize:vertical;background:rgba(255,255,255,.04);color:#fafdff;border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:6px">varying vec3 vNormal;
void main() {
  vNormal = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}</textarea>
          <label style="margin-top:8px">Fragment Shader</label>
          <textarea class="p-input" id="matFragShader" rows="4" style="width:100%;font-family:monospace;font-size:.7rem;resize:vertical;background:rgba(255,255,255,.04);color:#fafdff;border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:6px">varying vec3 vNormal;
void main() {
  float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
  gl_FragColor = vec4(0.75, 1.0, 0.24, 1.0) * intensity;
}</textarea>
          <button class="add-btn" id="btnApplyShader" style="margin-top:6px">Apply Shader</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu"></div>

<div class="play-overlay" id="playOverlay">
  <div class="play-bar">
    <button class="btn" id="btnStop" style="border-color:#ff2674;color:#ff2674">&#9632; Stop</button>
    <span style="font-size:.76rem;color:#888">Play Mode — press Esc or Stop to exit</span>
  </div>
  <iframe id="playFrame" srcdoc="<html><body style='margin:0;background:#000'></body></html>"></iframe>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script>
(function(){
  window.currentToken = new URLSearchParams(window.location.search).get('token') || null;
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const container = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x252630);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
camera.position.set(8, 6, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 15, 10); dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
scene.add(dirLight);
scene.add(new THREE.HemisphereLight(0x68aed4, 0x430067, 0.4));

const gridHelper = new THREE.GridHelper(40, 40, 0x555568, 0x3a3a4a);
scene.add(gridHelper);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e1f26, roughness: 0.9 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; ground.name = '__ground';
scene.add(ground);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.08;

const transform = new TransformControls(camera, renderer.domElement);
transform.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; });
scene.add(transform);

let sceneObjects = [];
let selectedObj = null;
let currentTool = 'translate';
let playMode = false;
let gridVisible = true;
let wireframeMode = false;

const primitiveGeos = {
  box: () => new THREE.BoxGeometry(1, 1, 1),
  sphere: () => new THREE.SphereGeometry(0.5, 24, 16),
  cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1, 24),
  plane: () => new THREE.PlaneGeometry(2, 2),
  cone: () => new THREE.ConeGeometry(0.5, 1, 24),
  torus: () => new THREE.TorusGeometry(0.4, 0.15, 16, 32),
};
const primitiveColors = { box: 0xbfff3c, sphere: 0x68aed4, cylinder: 0xff8426, plane: 0x444455, cone: 0xff2674, torus: 0x94216a };

/* ════════════════════════════════════════════════════
   UNDO / REDO SYSTEM
   ════════════════════════════════════════════════════ */
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 80;

function snapshot() {
  return sceneObjects.filter(o => o.name !== '__ground').map(o => ({
    name: o.name, type: o.userData.type,
    position: [o.position.x, o.position.y, o.position.z],
    rotation: [o.rotation.x, o.rotation.y, o.rotation.z],
    scale: [o.scale.x, o.scale.y, o.scale.z],
    color: o.userData.color,
    scripts: JSON.parse(JSON.stringify(o.userData.scripts || [])),
    matType: o.userData.matType || 'standard',
    matProps: Object.assign({}, o.userData.matProps || {}),
    attachTo: o.userData.attachTo || null,
  }));
}

function pushUndo() {
  undoStack.push(JSON.stringify(snapshot()));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  updateUndoHint();
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(snapshot()));
  const state = JSON.parse(undoStack.pop());
  restoreFromSnapshot(state);
  updateUndoHint();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(snapshot()));
  const state = JSON.parse(redoStack.pop());
  restoreFromSnapshot(state);
  updateUndoHint();
}

function restoreFromSnapshot(data) {
  const prev = selectedObj;
  sceneObjects.forEach(o => scene.remove(o));
  sceneObjects = [];
  data.forEach(d => {
    let mesh;
    if (d.type === 'light') { mesh = new THREE.PointLight(0xffffff, 1, 20); }
    else if (d.type === 'camera') { mesh = new THREE.PerspectiveCamera(60, 1, 0.1, 100); }
    else {
      const geo = primitiveGeos[d.type] ? primitiveGeos[d.type]() : new THREE.BoxGeometry(1, 1, 1);
      const color = d.color ? new THREE.Color(d.color) : new THREE.Color(0xbfff3c);
      const mat = buildMaterial(d.matType || 'standard', color, d.matProps || {});
      mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
    }
    mesh.name = d.name || 'Object';
    mesh.userData = { type: d.type, color: d.color, scripts: d.scripts || [], matType: d.matType || 'standard', matProps: d.matProps || {} };
    if (d.position) mesh.position.set(d.position[0], d.position[1], d.position[2]);
    if (d.rotation) mesh.rotation.set(d.rotation[0], d.rotation[1], d.rotation[2]);
    if (d.scale) mesh.scale.set(d.scale[0], d.scale[1], d.scale[2]);
    scene.add(mesh);
    sceneObjects.push(mesh);
  });
  selectedObj = null;
  selectObject(sceneObjects.length > 0 ? sceneObjects[Math.min(sceneObjects.indexOf(prev), sceneObjects.length - 1)] : null);
  refreshHierarchy();
}

function updateUndoHint() {
  document.getElementById('undoHint').textContent = undoStack.length > 0 ? undoStack.length + ' undo' : '';
}

/* ════════════════════════════════════════════════════
   MATERIAL SYSTEM
   ════════════════════════════════════════════════════ */
function buildMaterial(type, color, props) {
  props = props || {};
  switch (type) {
    case 'phong':
      return new THREE.MeshPhongMaterial({ color, emissive: props.emissive ? new THREE.Color(props.emissive) : 0x000000, shininess: props.shininess || 30 });
    case 'lambert':
      return new THREE.MeshLambertMaterial({ color });
    case 'toon':
      return new THREE.MeshToonMaterial({ color });
    case 'shader':
      return new THREE.ShaderMaterial({
        vertexShader: props.vertShader || 'void main(){ gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: props.fragShader || 'void main(){ gl_FragColor=vec4(0.75,1.0,0.24,1.0); }',
      });
    default:
      return new THREE.MeshStandardMaterial({ color, roughness: props.roughness != null ? props.roughness : 0.6, metalness: props.metalness != null ? props.metalness : 0.1 });
  }
}

function refreshFileTree() {
  const el = document.getElementById('fileTree');
  let html = '';

  var folderNames = Object.keys(fileFolders);
  folderNames.forEach(function(fn) {
    var items = fileFolders[fn].map(function(idx) { return sceneObjects[idx]; }).filter(Boolean);
    var itemsJson = JSON.stringify(items.map(function(o) { return sceneObjects.indexOf(o); }));
    html += '<div class="file-item folder" data-ffolder="1" data-ffolder-items=\'' + itemsJson + '\'><span class="fi">&#128193;</span> ' + fn + ' (' + items.length + ')</div>';
    items.forEach(function(o) {
      if (o.name === '__ground') return;
      var icon = o.userData.type === 'box' ? '&#9632;' : o.userData.type === 'sphere' ? '&#9679;' :
                 o.userData.type === 'cylinder' ? '&#9670;' : o.userData.type === 'cone' ? '&#9650;' :
                 o.userData.type === 'torus' ? '&#9711;' : o.userData.type === 'light' ? '&#9728;' :
                 o.userData.type === 'camera' ? '&#128247;' : '&#9654;';
      html += '<div class="file-item' + (selectedObj === o ? ' active' : '') + '" style="padding-left:24px" data-foidx="' + sceneObjects.indexOf(o) + '"><span class="fi">' + icon + '</span> ' + o.name + '</div>';
    });
  });

  sceneObjects.forEach((o, i) => {
    if (o.name === '__ground') return;
    var inFolder = false;
    folderNames.forEach(function(fn) { if (fileFolders[fn].indexOf(i) !== -1) inFolder = true; });
    if (inFolder) return;

    const icon = o.userData.type === 'box' ? '&#9632;' : o.userData.type === 'sphere' ? '&#9679;' :
                 o.userData.type === 'cylinder' ? '&#9670;' : o.userData.type === 'cone' ? '&#9650;' :
                 o.userData.type === 'torus' ? '&#9711;' : o.userData.type === 'light' ? '&#9728;' :
                 o.userData.type === 'camera' ? '&#128247;' : '&#9654;';
    html += '<div class="file-item' + (selectedObj === o ? ' active' : '') + '" data-fidx="' + i + '"><span class="fi">' + icon + '</span> ' + o.name + '.' + o.userData.type + '</div>';
    if (o.userData.scripts && o.userData.scripts.length) {
      o.userData.scripts.forEach((s, si) => {
        html += '<div class="file-item" style="padding-left:28px" data-fsidx="' + i + '" data-fssi="' + si + '"><span class="fi" style="color:#bfff3c">&#9998;</span> ' + s.name + '.js</div>';
      });
    }
  });

  el.innerHTML = html;
  var count = sceneObjects.filter(function(o) { return o.name !== '__ground'; }).length;
  document.getElementById('objCount').textContent = count + ' object' + (count !== 1 ? 's' : '');
}

function addPrimitive(type) {
  pushUndo();
  var mesh;
  if (type === 'empty') {
    mesh = new THREE.Object3D();
    mesh.position.set(0, 0.5, 0);
  } else if (type === 'light') {
    mesh = new THREE.PointLight(0xffffff, 1, 20);
    mesh.position.set(2, 3, 2); mesh.castShadow = true;
  } else if (type === 'directional_light') {
    mesh = new THREE.DirectionalLight(0xfff4e0, 1.5);
    mesh.position.set(5, 8, 5); mesh.castShadow = true;
    mesh.shadow.mapSize.width = 2048; mesh.shadow.mapSize.height = 2048;
    mesh.shadow.camera.left = -10; mesh.shadow.camera.right = 10;
    mesh.shadow.camera.top = 10; mesh.shadow.camera.bottom = -10;
  } else if (type === 'spot_light') {
    mesh = new THREE.SpotLight(0xffffff, 1, 30, Math.PI / 6, 0.3, 1);
    mesh.position.set(3, 5, 3); mesh.castShadow = true;
    mesh.target.position.set(0, 0, 0); scene.add(mesh.target);
  } else if (type === 'ambient_light') {
    mesh = new THREE.AmbientLight(0x404060, 0.4);
  } else if (type === 'hemisphere_light') {
    mesh = new THREE.HemisphereLight(0x87ceeb, 0x362907, 0.6);
  } else if (type === 'gradient_sky') {
    var skyGeo = new THREE.SphereGeometry(50, 32, 15);
    var skyCanvas = document.createElement('canvas');
    skyCanvas.width = 512; skyCanvas.height = 512;
    var skyCtx = skyCanvas.getContext('2d');
    var grad = skyCtx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0a0a2e'); grad.addColorStop(0.4, '#1a1a5e');
    grad.addColorStop(0.6, '#4a6fa5'); grad.addColorStop(1, '#87ceeb');
    skyCtx.fillStyle = grad; skyCtx.fillRect(0, 0, 512, 512);
    var skyTex = new THREE.CanvasTexture(skyCanvas);
    var skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide });
    mesh = new THREE.Mesh(skyGeo, skyMat);
    mesh.name = 'GradientSky';
  } else if (type === 'starfield_sky') {
    var sfGeo = new THREE.SphereGeometry(50, 32, 15);
    var sfCanvas = document.createElement('canvas');
    sfCanvas.width = 512; sfCanvas.height = 512;
    var sfCtx = sfCanvas.getContext('2d');
    sfCtx.fillStyle = '#050510'; sfCtx.fillRect(0, 0, 512, 512);
    for (var si = 0; si < 400; si++) {
      var sx = Math.random() * 512, sy = Math.random() * 512;
      var sr = Math.random() * 1.5 + 0.3;
      var brightness = Math.floor(Math.random() * 155 + 100);
      sfCtx.beginPath(); sfCtx.arc(sx, sy, sr, 0, Math.PI * 2);
      sfCtx.fillStyle = 'rgb(' + brightness + ',' + brightness + ',' + (brightness + 30) + ')';
      sfCtx.fill();
    }
    var sfTex = new THREE.CanvasTexture(sfCanvas);
    var sfMat = new THREE.MeshBasicMaterial({ map: sfTex, side: THREE.BackSide });
    mesh = new THREE.Mesh(sfGeo, sfMat);
    mesh.name = 'StarfieldSky';
  } else if (type === 'solid_sky') {
    var ssGeo = new THREE.SphereGeometry(50, 32, 15);
    var ssMat = new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide });
    mesh = new THREE.Mesh(ssGeo, ssMat);
    mesh.name = 'SolidSky';
  } else if (type === 'camera') {
    mesh = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
    mesh.position.set(0, 2, 5);
  } else {
    var geo = primitiveGeos[type]();
    var color = primitiveColors[type] || 0xbfff3c;
    var mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
    mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.position.y = type === 'plane' ? 0.01 : 0.5;
    if (type === 'plane') mesh.rotation.x = -Math.PI / 2;
  }
  mesh.name = mesh.name || (type.charAt(0).toUpperCase() + type.slice(1) + '_' + (sceneObjects.length + 1));
  mesh.userData = { type, color: mesh.material ? '#' + mesh.material.color.getHexString() : '#ffffff', scripts: [], matType: 'standard', matProps: {} };
  scene.add(mesh);
  sceneObjects.push(mesh);
  if (mesh.isCamera) createFrustumHelper(mesh);
  selectObject(mesh);
  logToConsole('Created ' + mesh.name, 'info');
}

function deleteSelected() {
  if (!selectedObj) return;
  pushUndo();
  logToConsole('Deleted ' + selectedObj.name, 'warn');
  if (selectedObj.isCamera) removeFrustumHelper(selectedObj);
  scene.remove(selectedObj);
  sceneObjects = sceneObjects.filter(function(o) { return o !== selectedObj; });
  transform.detach();
  selectedObj = null;
  selectObject(null);
}

function duplicateSelected() {
  if (!selectedObj) return;
  pushUndo();
  var clone = selectedObj.clone();
  if (selectedObj.material) clone.material = selectedObj.material.clone();
  clone.position.x += 1;
  clone.name = selectedObj.name + '_copy';
  clone.userData = { type: selectedObj.userData.type, color: selectedObj.userData.color, scripts: JSON.parse(JSON.stringify(selectedObj.userData.scripts || [])), matType: selectedObj.userData.matType, matProps: Object.assign({}, selectedObj.userData.matProps || {}) };
  scene.add(clone);
  sceneObjects.push(clone);
  selectObject(clone);
}

function serializeScene() {
  return sceneObjects.filter(function(o) { return o.name !== '__ground'; }).map(function(o) {
    var color = o.userData.color;
    if (!color && o.material && o.material.color) color = '#' + o.material.color.getHexString();
    return {
      name: o.name, type: o.userData.type,
      position: [o.position.x, o.position.y, o.position.z],
      rotation: [o.rotation.x, o.rotation.y, o.rotation.z],
      scale: [o.scale.x, o.scale.y, o.scale.z],
      color: color,
      scripts: o.userData.scripts || [],
      matType: o.userData.matType || 'standard',
      matProps: o.userData.matProps || {},
      attachTo: o.userData.attachTo || null,
    };
  });
}

function deserializeScene(data) {
  Object.keys(camHelpers).forEach(function(k) { if (camHelpers[k]) scene.remove(camHelpers[k]); });
  for (var k in camHelpers) delete camHelpers[k];
  sceneObjects.forEach(function(o) { scene.remove(o); });
  sceneObjects = [];
  (data || []).forEach(function(d) {
    var mesh;
    if (d.type === 'light') {
      mesh = new THREE.PointLight(0xffffff, 1, 20);
    } else if (d.type === 'camera') {
      mesh = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
    } else if (d.type === 'empty') {
      mesh = new THREE.Object3D();
    } else {
      var geo = primitiveGeos[d.type] ? primitiveGeos[d.type]() : new THREE.BoxGeometry(1, 1, 1);
      var color = d.color ? new THREE.Color(d.color) : new THREE.Color(0xbfff3c);
      var mat = buildMaterial(d.matType || 'standard', color, d.matProps || {});
      mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
    }
    mesh.name = d.name || 'Object';
    mesh.userData = { type: d.type, color: d.color, scripts: d.scripts || [], matType: d.matType || 'standard', matProps: d.matProps || {} };
    if (d.position) mesh.position.set(d.position[0], d.position[1], d.position[2]);
    if (d.rotation) mesh.rotation.set(d.rotation[0], d.rotation[1], d.rotation[2]);
    if (d.scale) mesh.scale.set(d.scale[0], d.scale[1], d.scale[2]);
    if (mesh.isCamera) createFrustumHelper(mesh);
    scene.add(mesh);
    sceneObjects.push(mesh);
  });
  refreshHierarchy();
}

function onResize() {

  if (w > 0 && h > 0) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
}

/* ════════════════════════════════════════════════════
   RAYCASTING
   ════════════════════════════════════════════════════ */
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', function(e) {
  if (transform.dragging) return;
  if (e.button === 2) return;
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var targets = sceneObjects.filter(function(o) { return o.name !== '__ground'; });
  var hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) selectObject(hits[0].object);
  else selectObject(null);
});

renderer.domElement.addEventListener('contextmenu', function(e) {
  e.preventDefault(); e.stopPropagation();
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var targets = sceneObjects.filter(function(o) { return o.name !== '__ground'; });
  var hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) {
    var obj = hits[0].object;
    selectObject(obj);
    var objItems = [
      { icon: '&#9998;', label: 'Rename', action: 'rename_obj' },
      { icon: 'D+', label: 'Duplicate', action: 'duplicate_obj' },
      '---',
    ].concat(buildAddItems(), [
      '---',
      { icon: 'X', label: 'Delete', action: 'delete_obj', danger: true },
    ]);
    showCtxMenu(e.clientX, e.clientY, objItems, obj);
  } else {
    showCtxMenu(e.clientX, e.clientY, sceneCtxItems, null);
  }
});

transform.addEventListener('objectChange', function() { if (selectedObj) updatePropsUI(); });

/* ════════════════════════════════════════════════════
   KEYBOARD
   ════════════════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (window._monacoEditor && document.activeElement && document.activeElement.closest('.monaco-editor')) return;
  if (e.key === 'g') setTool('translate');
  if (e.key === 'r') setTool('rotate');
  if (e.key === 's' && !e.ctrlKey) setTool('scale');
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  if (e.ctrlKey && e.key === 'd') { e.preventDefault(); duplicateSelected(); }
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.key === 'Escape') { if (playMode) exitPlayMode(); else selectObject(null); }
});

function setTool(tool) {
  currentTool = tool;
  transform.setMode(tool);
  document.getElementById('toolMove').classList.toggle('active', tool === 'translate');
  document.getElementById('toolRotate').classList.toggle('active', tool === 'rotate');
  document.getElementById('toolScale').classList.toggle('active', tool === 'scale');
}

const ctxMenu = document.getElementById('ctxMenu');
let ctxMenuTarget = null;

function showCtxMenu(x, y, items, target) {
  ctxMenuTarget = target || null;
  let html = '';
  items.forEach(function(item) {
    if (item === '---') { html += '<div class="ctx-sep"></div>'; return; }
    var cls = item.danger ? ' ctx-item danger' : ' ctx-item';
    html += '<div class="' + cls + '" data-ctx="' + item.action + '"><span class="ctx-icon">' + (item.icon || '') + '</span>' + item.label + '</div>';
  });
  ctxMenu.innerHTML = html;
  ctxMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
  ctxMenu.style.top = Math.min(y, window.innerHeight - items.length * 30) + 'px';
  ctxMenu.classList.add('open');
}

function hideCtxMenu() { ctxMenu.classList.remove('open'); ctxMenuTarget = null; }

ctxMenu.addEventListener('click', function(e) {
  var item = e.target.closest('[data-ctx]');
  if (!item) return;
  var action = item.dataset.ctx;
  hideCtxMenu();
  handleCtxAction(action, ctxMenuTarget);
});

function handleCtxAction(action, target) {
  if (action === 'add_box') addPrimitive('box');
  else if (action === 'add_sphere') addPrimitive('sphere');
  else if (action === 'add_cylinder') addPrimitive('cylinder');
  else if (action === 'add_cone') addPrimitive('cone');
  else if (action === 'add_torus') addPrimitive('torus');
  else if (action === 'add_plane') addPrimitive('plane');
  else if (action === 'add_light') addPrimitive('light');
  else if (action === 'add_directional_light') addPrimitive('directional_light');
  else if (action === 'add_spot_light') addPrimitive('spot_light');
  else if (action === 'add_ambient_light') addPrimitive('ambient_light');
  else if (action === 'add_hemisphere_light') addPrimitive('hemisphere_light');
  else if (action === 'add_gradient_sky') addPrimitive('gradient_sky');
  else if (action === 'add_starfield_sky') addPrimitive('starfield_sky');
  else if (action === 'add_solid_sky') addPrimitive('solid_sky');
  else if (action === 'add_camera') addPrimitive('camera');
  else if (action === 'add_empty') addPrimitive('empty');
  else if (action === 'delete_obj') { if (target) { selectedObj = target; deleteSelected(); } }
  else if (action === 'duplicate_obj') { if (target) { selectedObj = target; duplicateSelected(); } }
  else if (action === 'rename_obj') {
    if (target) {
      var newName = prompt('Rename:', target.name);
      if (newName && newName.trim()) { pushUndo(); target.name = newName.trim(); refreshHierarchy(); }
    }
  }
  else if (action === 'new_folder') { addFolder(); }
  else if (action === 'new_script_file') { addNewScriptFile(target); }
  else if (action === 'delete_file') { if (target && target.type === 'file') { pushUndo(); var obj = sceneObjects[target.objIdx]; if (obj && obj.userData.scripts) { obj.userData.scripts.splice(target.scriptIdx, 1); refreshFileTree(); refreshScriptList(); } } }
  else if (action === 'rename_file') {
    if (target && target.type === 'file') {
      var obj = sceneObjects[target.objIdx];
      if (obj && obj.userData.scripts && obj.userData.scripts[target.scriptIdx]) {
        var nn = prompt('Rename script:', obj.userData.scripts[target.scriptIdx].name);
        if (nn && nn.trim()) { pushUndo(); obj.userData.scripts[target.scriptIdx].name = nn.trim(); refreshFileTree(); }
      }
    }
  }
  else if (action === 'delete_folder') { if (target && target.type === 'folder') { pushUndo(); target.items.forEach(function(i) { scene.remove(i); }); sceneObjects = sceneObjects.filter(function(o) { return target.items.indexOf(o) === -1; }); selectObject(null); refreshHierarchy(); } }
}

var currentGameId = new URLSearchParams(window.location.search).get('id');
async function getApiBase() {
  try { var r = await fetch('/config.js'); var t = await r.text(); var m = t.match(/WS_URL\s*=\s*['"]([^'"]+)/); if (m) return m[1].replace(/^wss?:\/\//, 'https://'); } catch(e) {}
  return '';
}
document.getElementById('btnSave').addEventListener('click', function() { saveGame(false); });
document.getElementById('btnPublish').addEventListener('click', function() { saveGame(true); });

async function saveGame(publish) {
  var token = window.currentToken;
  if (!token) { alert('Sign in to save games'); return; }
  var title = document.getElementById('gameTitle').value || 'Untitled Game';
  var sceneData = JSON.stringify(serializeScene());
  var apiBase = await getApiBase();
  try {
    if (currentGameId) {
      await fetch(apiBase + '/api/games/' + currentGameId, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ title, scene: sceneData, published: publish }) });
    } else {
      var res = await fetch(apiBase + '/api/games', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ title, scene: sceneData, published: publish }) });
      var d = await res.json();
      if (d.game) { currentGameId = d.game.id; window.history.replaceState({}, '', '/editor?id=' + currentGameId); }
    }
    logToConsole(publish ? 'Published!' : 'Saved!', 'info');
  } catch (err) { logToConsole('Save failed: ' + err.message, 'error'); }
}

async function loadGame() {
  if (!currentGameId) return;
  var apiBase = await getApiBase();
  try { var res = await fetch(apiBase + '/api/games/' + currentGameId); var d = await res.json(); if (d.game) { document.getElementById('gameTitle').value = d.game.title; var sd = typeof d.game.scene === 'string' ? JSON.parse(d.game.scene) : d.game.scene; deserializeScene(sd); } } catch(e) {}
}

function enterPlayMode() {
  playMode = true; transform.detach();
  document.getElementById('playOverlay').classList.add('active');
  var frame = document.getElementById('playFrame');
  var sceneData = serializeScene();
  function onReady() {
    window.removeEventListener('message', waitForReady);
    try { frame.contentWindow.postMessage({ type: 'play', scene: sceneData }, '*'); } catch(e) {}
  }
  function waitForReady(e) {
    if (e.data && e.data.type === 'ready') onReady();
  }
  window.addEventListener('message', waitForReady);
  frame.removeAttribute('srcdoc');
  frame.src = '/play.html';
}
function exitPlayMode() {
  playMode = false; document.getElementById('playOverlay').classList.remove('active');
  var frame = document.getElementById('playFrame');
  try { frame.contentWindow.postMessage({ type: 'stop' }, '*'); } catch(e) {}
  frame.removeAttribute('src');
  frame.srcdoc = '<html><body style="margin:0;background:#000"></body></html>';
}

document.getElementById('btnStop').addEventListener('click', exitPlayMode);

function loadMonaco() {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';
  s.onload = function() {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function() {
      var ed = monaco.editor.create(document.getElementById('monacoEditor'), {
        value: '// Select an object and attach a script\n// Available: scene, objects, camera, self (current object)\n// Function update() runs every frame\n\nfunction update() {\n  self.rotation.y += 0.01;\n}',
        language: 'javascript', theme: 'vs-dark', fontSize: 13,
        minimap: { enabled: false }, automaticLayout: false,
        scrollBeyondLastLine: false, padding: { top: 8 },
        fontFamily: "'JetBrains Mono', 'Fira Code', monospace", tabSize: 2,
      });
      window._monacoEditor = ed;
      ed.onDidChangeModelContent(function() {
        if (selectedObj) {
          if (!selectedObj.userData.scripts) selectedObj.userData.scripts = [];
          if (selectedObj.userData.scripts.length === 0) {
            selectedObj.userData.scripts.push({ name: 'Script', code: ed.getValue() });
          } else {
            selectedObj.userData.scripts[0].code = ed.getValue();
          }
          refreshFileTree();
        }
      });
      ed.layout();
    });
  };
  document.head.appendChild(s);
}

function refreshCameraPreview() {
  var cam = null;
  if (selectedObj && selectedObj.isCamera) cam = selectedObj;
  var anyCam = !cam;
  if (!cam) {
    for (var i = 0; i < sceneObjects.length; i++) {
      if (sceneObjects[i].isCamera) { cam = sceneObjects[i]; break; }
    }
  }
  if (cam) {
    camPreviewEl.classList.add('active');
    var w = camPreviewCanvas.parentElement.clientWidth || 220;
    var h = camPreviewCanvas.parentElement.clientHeight || 165;
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
    camPreviewRenderer.setSize(w, h);
    camPreviewRenderer.setScissor(0, 0, w, h);
    camPreviewRenderer.setViewport(0, 0, w, h);
    camPreviewRenderer.render(scene, cam);
  } else {
    camPreviewEl.classList.remove('active');
  }
}

/* ════════════════════════════════════════════════════
   RENDER LOOP
   ════════════════════════════════════════════════════ */
function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  updateAllFrustumHelpers();
  renderer.render(scene, camera);
  if (!playMode) refreshCameraPreview();
}
animate();
loadGame();
refreshHierarchy();
</script>
