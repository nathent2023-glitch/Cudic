<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>*{margin:0;padding:0;overflow:hidden}body{background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x252630);

let camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
camera.position.set(5, 4, 5);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(10, 15, 10);
dl.castShadow = true;
dl.shadow.mapSize.set(1024, 1024);
scene.add(dl);
scene.add(new THREE.HemisphereLight(0x68aed4, 0x430067, 0.4));

scene.add(new THREE.GridHelper(40, 40, 0x555568, 0x3a3a4a));

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

const primitiveGeos = {
  box: () => new THREE.BoxGeometry(1, 1, 1),
  sphere: () => new THREE.SphereGeometry(0.5, 24, 16),
  cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1, 24),
  plane: () => new THREE.PlaneGeometry(2, 2),
  cone: () => new THREE.ConeGeometry(0.5, 1, 24),
  torus: () => new THREE.TorusGeometry(0.4, 0.15, 16, 32),
};

let gameObjects = [];
let updateFns = [];
let running = false;

function buildScene(sceneData) {
  gameObjects.forEach(o => scene.remove(o));
  gameObjects = [];
  let userCamera = null;
  (sceneData || []).forEach(d => {
    let obj;
    if (d.type === 'light') {
      obj = new THREE.PointLight(0xffffff, 1, 20);
    } else if (d.type === 'directional_light') {
      obj = new THREE.DirectionalLight(0xfff4e0, 1.5);
    } else if (d.type === 'spot_light') {
      obj = new THREE.SpotLight(0xffffff, 1, 30, Math.PI / 6, 0.3, 1);
    } else if (d.type === 'ambient_light') {
      obj = new THREE.AmbientLight(0x404060, 0.4);
    } else if (d.type === 'hemisphere_light') {
      obj = new THREE.HemisphereLight(0x87ceeb, 0x362907, 0.6);
    } else if (d.type === 'camera') {
      obj = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
      userCamera = obj;
    } else if (d.type === 'empty') {
      obj = new THREE.Object3D();
    } else if (d.type === 'gradient_sky') {
      const skyGeo = new THREE.SphereGeometry(50, 32, 15);
      const skyCanvas = document.createElement('canvas');
      skyCanvas.width = 512; skyCanvas.height = 512;
      const skyCtx = skyCanvas.getContext('2d');
      const grad = skyCtx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#0a0a2e'); grad.addColorStop(0.4, '#1a1a5e');
      grad.addColorStop(0.6, '#4a6fa5'); grad.addColorStop(1, '#87ceeb');
      skyCtx.fillStyle = grad; skyCtx.fillRect(0, 0, 512, 512);
      obj = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyCanvas), side: THREE.BackSide }));
    } else if (d.type === 'starfield_sky') {
      const sfGeo = new THREE.SphereGeometry(50, 32, 15);
      const sfCanvas = document.createElement('canvas');
      sfCanvas.width = 512; sfCanvas.height = 512;
      const sfCtx = sfCanvas.getContext('2d');
      sfCtx.fillStyle = '#050510'; sfCtx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 400; i++) {
        const sx = Math.random() * 512, sy = Math.random() * 512;
        const sr = Math.random() * 1.5 + 0.3;
        const b = Math.floor(Math.random() * 155 + 100);
        sfCtx.beginPath(); sfCtx.arc(sx, sy, sr, 0, Math.PI * 2);
        sfCtx.fillStyle = `rgb(${b},${b},${b + 30})`; sfCtx.fill();
      }
      obj = new THREE.Mesh(sfGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sfCanvas), side: THREE.BackSide }));
    } else if (d.type === 'solid_sky') {
      obj = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 15), new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide }));
    } else {
      const geo = primitiveGeos[d.type] ? primitiveGeos[d.type]() : new THREE.BoxGeometry(1, 1, 1);
      const color = d.color ? new THREE.Color(d.color) : new THREE.Color(0xbfff3c);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
      obj = new THREE.Mesh(geo, mat);
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
    obj.name = d.name || 'Object';
    obj.userData = { type: d.type, color: d.color, scripts: d.scripts || [] };
    if (d.position) obj.position.set(d.position[0], d.position[1], d.position[2]);
    if (d.rotation) obj.rotation.set(d.rotation[0], d.rotation[1], d.rotation[2]);
    if (d.scale) obj.scale.set(d.scale[0], d.scale[1], d.scale[2]);
    scene.add(obj);
    gameObjects.push(obj);
  });
  if (userCamera) {
    camera = userCamera;
    controls.object = camera;
    resize();
  }
}

function startScripts() {
  updateFns = [];
  gameObjects.forEach(obj => {
    const scripts = obj.userData.scripts || [];
    scripts.forEach(s => {
      if (!s.code || !s.code.trim()) return;
      try {
        const fn = new Function('scene', 'objects', 'camera', 'self', 'update', s.code);
        fn(scene, gameObjects, camera, obj, null);
      } catch(e) {
        parent.postMessage({ type: 'console', level: 'error', text: obj.name + ': ' + e.message }, '*');
      }
    });
    const scripts2 = obj.userData.scripts || [];
    scripts2.forEach(s => {
      if (!s.code || !s.code.trim()) return;
      try {
        const wrapper = new Function('scene', 'objects', 'camera', 'self', `
          ${s.code}
          if (typeof update === 'function') return update;
          return null;
        `);
        const updateFn = wrapper(scene, gameObjects, camera, obj);
        if (typeof updateFn === 'function') {
          updateFns.push({ self: obj, fn: updateFn });
        }
      } catch(e) {}
    });
  });
}

window.addEventListener('message', (e) => {
  const data = e.data;
  if (data.type === 'play') {
    buildScene(data.scene);
    running = true;
    startScripts();
    parent.postMessage({ type: 'console', level: 'info', text: 'Game started — ' + gameObjects.length + ' objects' }, '*');
  }
  if (data.type === 'stop') {
    running = false;
    updateFns = [];
    if (data.scene) buildScene(data.scene);
  }
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (running) {
    updateFns.forEach(({ self, fn }) => {
      try { fn(); } catch(e) { parent.postMessage({ type: 'console', level: 'error', text: self.name + ': ' + e.message }, '*'); }
    });
  }
  renderer.render(scene, camera);
}
animate();

parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
