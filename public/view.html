  <style>
    body { display: flex; overflow: hidden; height: 100%; }
    .game-layout { flex: 1; width: 0; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--panel); }
    .game-content { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .game-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .game-head h1 { font-family: var(--font-head); font-weight: 600; font-size: 1.3rem; }
    .author { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); }
    .author-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--signal-tint); color: var(--signal); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 600; font-size: 0.7rem; flex-shrink: 0; }
    .spacer { flex: 1; }
    .game-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .game-grid > * { min-width: 0; }
    @media (max-width: 900px) { .game-grid { grid-template-columns: 1fr; } }
    .player-card { background: #000; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; position: relative; aspect-ratio: 16/9; }
    .player-card.scrollable { overflow: auto; }
    .player-card iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .player-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #000; color: var(--text-secondary); font-size: 0.9rem; }
    .side-card { background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }
    .side-card h2 { font-family: var(--font-head); font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; }
    .side-card h3 { font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
    .side-card p { font-size: 0.85rem; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
    .side-card .dim { color: var(--text-tertiary); }
    .meta { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 14px; }
    .comment { padding: 10px 0; border-top: 1px solid var(--line); }
    .comment:first-child { border-top: none; }
    .comment-head { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: 4px; }
    .comment-head strong { color: var(--text-primary); font-size: 0.8rem; }
    .comment-del { margin-left: auto; background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 0.72rem; font-family: inherit; }
    .comment-del:hover { color: var(--danger); }
    .comment-body { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    #commentBox { width: 100%; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.83rem; font-family: inherit; padding: 9px 12px; margin: 12px 0 8px; outline: none; resize: vertical; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 9999; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; width: 400px; max-width: 90vw; }
    .modal h2 { font-family: var(--font-head); font-weight: 600; margin-bottom: 16px; }
    .modal label { display: block; font-size: var(--text-xs); color: var(--text-secondary); margin-bottom: 4px; }
    .modal input, .modal textarea { width: 100%; box-sizing: border-box; background: var(--panel-raised); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; margin-bottom: 12px; outline: none; resize: vertical; }
    .modal input:focus, .modal textarea:focus { border-color: var(--signal); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

<body data-page="games">
  <div class="game-layout page-panel"><div class="game-content" id="content" style="display:none">
    <div class="game-head">
      <a class="btn-secondary" href="/games" style="padding:9px 14px">&larr; Gallery</a>
      <h1 id="gameTitle">Loading…</h1>
      <div class="author"><div class="author-avatar" id="authorAvatar">?</div><span id="authorName"></span></div>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="scrollBtn" title="Allow the game page to scroll (for website-style games)">Scroll: off</button>
      <button class="btn btn-secondary" id="fsBtn">Fullscreen</button>
      <a class="btn-primary" id="studioBtn" href="#" style="display:none">Open in Studio</a>
      <button class="btn btn-secondary" id="forkBtn" style="display:none">Fork</button>
      <button class="btn btn-secondary" id="shareBtn">Share</button>
    </div>
    <div class="game-grid">
      <div class="player-card" id="playerCard"><div class="player-overlay" id="overlay"><span id="overlayText">Loading…</span></div></div>
      <div id="playerErr" style="display:none;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:0.8rem;color:#ff7b7b;background:var(--panel-raised)"></div>
      <div class="side-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">Notes and Credits</h2>
          <button class="btn btn-secondary" id="editGameBtn" style="display:none;padding:6px 12px;font-size:0.75rem">Edit</button>
        </div>
        <h3>Notes</h3>
        <p id="gameDesc" class="dim">No notes yet.</p>
        <h3>Credits</h3>
        <p id="gameCredits" class="dim">No credits yet.</p>
        <div class="meta" id="gameMeta"></div>
      </div>
    </div>
    <div class="side-card" id="commentsCard" style="margin-top:20px">
      <h2>Comments <span id="commentCount" class="dim" style="font-weight:400"></span></h2>
      <div id="commentList"><p class="dim">Loading…</p></div>
      <div id="commentForm" style="display:none">
        <textarea id="commentBox" rows="2" maxlength="2000" placeholder="Say something…"></textarea>
        <button class="btn btn-primary" id="commentPost">Post</button>
      </div>
      <p id="commentSignin" class="dim" style="display:none;margin-top:12px">Sign in to comment.</p>
    </div>
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <h2>Edit game</h2>
        <label for="editTitle">Title</label>
        <input type="text" id="editTitle" maxlength="60">
        <label for="editDesc">Notes</label>
        <textarea id="editDesc" rows="4" maxlength="2000" placeholder="What is this game? How do you play?"></textarea>
        <label for="editCredits">Credits</label>
        <textarea id="editCredits" rows="3" maxlength="1000" placeholder="Who made it? What did you use?"></textarea>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="editCancel">Cancel</button>
          <button class="btn btn-primary" id="editSave">Save</button>
        </div>
      </div>
    </div>
  </div></div>
  <script src="/config.js"></script>
  <script src="/auth.js"></script>

  <script>
  (function(){
    var id = new URLSearchParams(location.search).get('id');
    var api = '';
    var game = null;
    function apiBase(){
      if (api) return api;
      api = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, 'https://') : '';
      return api;
    }
    if (!id) { document.getElementById('overlayText').textContent = 'Missing game id'; return; }
    document.getElementById('studioBtn').href = '/studio?id=' + encodeURIComponent(id);
    // Share: native sheet on touch, clipboard everywhere else
    document.getElementById('shareBtn').addEventListener('click', function(){
      var url = location.origin + location.pathname + '?id=' + encodeURIComponent(id);
      var btn = this;
      if ((navigator.maxTouchPoints || 0) > 0 && navigator.share) {
        navigator.share({ title: document.title, url: url }).catch(function(){});
        return;
      }
      function copied(){
        btn.textContent = 'Copied';
        setTimeout(function(){ btn.textContent = 'Share'; }, 1500);
      }
      function legacy(){
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); copied(); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(copied).catch(legacy);
      } else legacy();
    });
    // Owner check: only the owner gets the Studio button (server still enforces on save)
    var isOwner = false;
    function checkOwner(ownerId) {
      try {
        getSupabase().then(function(db){
          if (!db) return;
          db.auth.getSession().then(function(r){
            var uid = (r.data && r.data.session && r.data.session.user && r.data.session.user.id) || null;
            if (uid && ownerId && uid === ownerId) {
              isOwner = true;
              document.getElementById('studioBtn').style.display = '';
              document.getElementById('editGameBtn').style.display = '';
            }
          });
        }).catch(function(){});
      } catch (e) {}
    }
    // Edit game modal
    var editModal = document.getElementById('editModal');
    document.getElementById('editGameBtn').addEventListener('click', function(){
      document.getElementById('editTitle').value = game.title || '';
      document.getElementById('editDesc').value = game.description || '';
      document.getElementById('editCredits').value = game.credits || '';
      editModal.classList.add('open');
    });
    document.getElementById('editCancel').addEventListener('click', function(){ editModal.classList.remove('open'); });
    editModal.addEventListener('click', function(e){ if (e.target === editModal) editModal.classList.remove('open'); });
    document.getElementById('editSave').addEventListener('click', function(){
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      getSession().then(function(s){
        if (!s) { btn.disabled = false; btn.textContent = 'Save'; return; }
        fetch(apiBase() + '/api/games/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.token },
          body: JSON.stringify({
            title: document.getElementById('editTitle').value.trim(),
            description: document.getElementById('editDesc').value.trim(),
            credits: document.getElementById('editCredits').value.trim()
          })
        }).then(function(r){ return r.json(); }).then(function(d){
          btn.disabled = false;
          btn.textContent = 'Save';
          if (d.error && !d.game) { alert('Save failed: ' + d.error); return; }
          editModal.classList.remove('open');
          location.reload();
        }).catch(function(){ btn.disabled = false; btn.textContent = 'Save'; alert('Save failed.'); });
      });
    });
    var session = null;
    function getSession() {
      if (session) return Promise.resolve(session);
      try {
        return getSupabase().then(function(db){
          if (!db) return null;
          return db.auth.getSession().then(function(r){
            var s = r.data && r.data.session;
            session = s ? { uid: s.user.id, token: s.access_token } : null;
            return session;
          });
        }).catch(function(){ return null; });
      } catch (e) { return Promise.resolve(null); }
    }
    function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
    function commentDate(t) { try { return new Date(t).toLocaleString(); } catch (e) { return ''; } }
    function initComments(game) {
      function loadComments() {
        fetch(apiBase() + '/api/games/' + encodeURIComponent(id) + '/comments')
          .then(function(r){ return r.json(); })
          .then(function(d){
            var list = d.comments || [];
            document.getElementById('commentCount').textContent = list.length ? '(' + list.length + ')' : '';
            var box = document.getElementById('commentList');
            if (!list.length) { box.innerHTML = '<p class="dim">No comments yet.</p>'; return; }
            getSession().then(function(s){
              var uid = s && s.uid;
              box.innerHTML = list.map(function(c){
                var canDel = uid && (c.user_id === uid || game.owner_id === uid);
                return '<div class="comment"><div class="comment-head"><strong>' + escapeHtml(c.display_name) + '</strong><span>' + escapeHtml(commentDate(c.created_at)) + '</span>' +
                  (canDel ? '<button class="comment-del" data-cid="' + c.id + '">Delete</button>' : '') +
                  '</div><div class="comment-body">' + escapeHtml(c.text) + '</div></div>';
              }).join('');
              box.querySelectorAll('.comment-del').forEach(function(b){
                b.addEventListener('click', function(){ deleteComment(b.getAttribute('data-cid')); });
              });
            });
          })
          .catch(function(){ document.getElementById('commentList').innerHTML = '<p class="dim">Could not load comments.</p>'; });
      }
      function postComment() {
        var ta = document.getElementById('commentBox');
        var text = ta.value.trim();
        if (!text) return;
        getSession().then(function(s){
          if (!s) return;
          fetch(apiBase() + '/api/games/' + encodeURIComponent(id) + '/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.token },
            body: JSON.stringify({ text: text.substring(0, 2000) })
          }).then(function(r){ return r.json(); }).then(function(d){
            if (d.comment) { ta.value = ''; loadComments(); }
            else { alert('Could not post comment: ' + (d.error || 'server did not accept it')); }
          }).catch(function(){ alert('Could not post comment: server unreachable or feature not deployed yet.'); });
        });
      }
      function deleteComment(cid) {
        getSession().then(function(s){
          if (!s) return;
          fetch(apiBase() + '/api/comments/' + encodeURIComponent(cid), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + s.token }
          }).then(function(){ loadComments(); }).catch(function(){});
        });
      }
      loadComments();
      getSession().then(function(s){
        if (!s) {
          document.getElementById('commentSignin').style.display = 'block';
          return;
        }
        document.getElementById('commentForm').style.display = 'block';
        document.getElementById('commentPost').addEventListener('click', postComment);
      });
    }
    fetch(apiBase() + '/api/games/' + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(d){
        game = d.game || null;
        if (!game) { document.getElementById('overlayText').textContent = 'Game not found'; return; }
        var files = game.files;
        if (typeof files === 'string') { try { files = JSON.parse(files); } catch (e) { files = null; } }
        // scene-JSON games open in Studio, which converts them to files on boot
        if (!files || !Object.keys(files).length) { location.href = '/studio?id=' + encodeURIComponent(id); return; }
        document.title = (game.title || 'Untitled') + ' — Cudic';
        document.getElementById('gameTitle').textContent = game.title || 'Untitled Game';
        var author = game.users || {};
        var name = author.display_name || 'Unknown';
        document.getElementById('authorName').textContent = name + (author.user_id ? ' #' + author.user_id : '');
        document.getElementById('authorAvatar').textContent = name.substring(0, 2).toUpperCase();
        if (game.description) { var de = document.getElementById('gameDesc'); de.textContent = game.description; de.classList.remove('dim'); }
        if (game.credits) { var ce = document.getElementById('gameCredits'); ce.textContent = game.credits; ce.classList.remove('dim'); }
        if (game.created_at) document.getElementById('gameMeta').textContent = 'Published ' + new Date(game.created_at).toLocaleDateString();
        checkOwner(game.owner_id);
        initComments(game);
        getSession().then(function(s){
          if (!s) return;
          var fb = document.getElementById('forkBtn');
          fb.style.display = '';
          fb.addEventListener('click', function(){
            fb.disabled = true;
            fb.textContent = 'Forking…';
            fetch(apiBase() + '/api/games/' + encodeURIComponent(id) + '/fork', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + s.token }
            }).then(function(r){ return r.json(); }).then(function(d){
              if (d.game) window.location.href = '/studio?id=' + encodeURIComponent(d.game.id);
              else { alert('Fork failed: ' + (d.error || 'unknown')); fb.disabled = false; fb.textContent = 'Fork'; }
            }).catch(function(){ alert('Fork failed.'); fb.disabled = false; fb.textContent = 'Fork'; });
          });
        });
        document.getElementById('content').style.display = 'block';
        var card = document.getElementById('playerCard');
        document.getElementById('overlay').remove();
        var f = document.createElement('iframe');
        f.setAttribute('sandbox', 'allow-scripts');
        f.setAttribute('allowfullscreen', 'true');
        f.setAttribute('scrolling', 'no');
        f.src = '/run.html?v=2';
        card.appendChild(f);
        // Viewers can allow scrolling for website-style games; remembered per game
        var scrollKey = 'glox-scroll:' + id;
        function applyScroll(on) {
          card.classList.toggle('scrollable', on);
          f.setAttribute('scrolling', on ? 'yes' : 'no');
          document.getElementById('scrollBtn').textContent = on ? 'Scroll: on' : 'Scroll: off';
        }
        var scrollOn = false;
        try { scrollOn = localStorage.getItem(scrollKey) === '1'; } catch (e) {}
        applyScroll(scrollOn);
        document.getElementById('scrollBtn').addEventListener('click', function(){
          scrollOn = !scrollOn;
          try { localStorage.setItem(scrollKey, scrollOn ? '1' : '0'); } catch (e) {}
          applyScroll(scrollOn);
        });
        var playerStarted = false;
        function playerFail(msg) {
          var el = document.getElementById('playerErr');
          el.textContent = msg;
          el.style.display = 'block';
        }
        window.addEventListener('message', function wait(e) {
          if (e.data && e.data.type === 'ready') {
            // Compat rule: keep in step with run.html's ready version.
            if (e.data.v !== 2) {
              window.removeEventListener('message', wait);
              playerFail('Player files are outdated — hard-refresh (Ctrl+Shift+R) to load the latest player.');
              return;
            }
            playerStarted = true;
            window.removeEventListener('message', wait);
            try { f.contentWindow.postMessage({ type: 'code', files: files, assets: game.assets || {}, assetsBase: (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) ? SUPABASE_URL + '/storage/v1/object/public/' : '' }, '*'); } catch (err) {}
          }
        });
        window.addEventListener('message', function(e){
          if (!e.data || e.data.type !== 'console') return;
          playerStarted = true;
          if (e.data.level === 'error') playerFail('Game error: ' + e.data.text);
        });
        // ── Cloud saves: the game frame is sandboxed and never sees the
        // login token, so this page mediates. Game -> run frame -> here.
        // Guests persist nothing; they get one sign-in nudge per session.
        var saveSession = null, cloudSave = null;
        var saveKey = 'cudic-save:' + id;
        function saveHeaders(extra) {
          var h = extra || {};
          if (saveSession) h['Authorization'] = 'Bearer ' + saveSession.token;
          try { if (typeof seatId === 'function') { var s = seatId(); if (s) h['X-Seat'] = s; } } catch (e) {}
          return h;
        }
        function loadCloudSave() {
          fetch(apiBase() + '/api/saves/' + encodeURIComponent(id), { headers: saveHeaders() })
            .then(function (r) {
              if (r.status === 403) {
                r.json().then(function (d) {
                  if (d && d.error === 'session_superseded' && typeof pauseSeat === 'function') pauseSeat('device');
                }).catch(function () {});
                return null;
              }
              if (!r.ok) return null;
              return r.json();
            })
            .then(function (d) { if (d && d.data) cloudSave = { data: d.data, updated_at: d.updated_at }; })
            .catch(function () {});
        }
        function nagGuest() {
          try {
            if (sessionStorage.getItem('cudic-save-nag:' + id)) return;
            sessionStorage.setItem('cudic-save-nag:' + id, '1');
          } catch (e) { return; }
          var n = document.createElement('div');
          n.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-raised);border:1px solid var(--signal);color:var(--text-primary);border-radius:12px;padding:12px 18px;font-size:0.85rem;font-weight:600;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center';
          var sp = document.createElement('span');
          sp.textContent = 'Sign up or log in to sync your progress across every device.';
          var go = document.createElement('a');
          go.href = '/login'; go.textContent = 'Sign in';
          go.className = 'btn btn-primary';
          go.style.cssText = 'margin-left:12px;padding:6px 14px;font-size:0.8rem;text-decoration:none';
          var x = document.createElement('button');
          x.textContent = '×'; x.setAttribute('aria-label', 'Dismiss');
          x.style.cssText = 'background:none;border:none;color:var(--text-tertiary);font-size:1rem;cursor:pointer;margin-left:8px';
          x.onclick = function () { n.remove(); };
          n.appendChild(sp); n.appendChild(go); n.appendChild(x);
          document.body.appendChild(n);
          setTimeout(function () { if (n.parentNode) n.remove(); }, 12000);
        }
        getSession().then(function (s) {
          saveSession = s;
          if (s) loadCloudSave();
          else nagGuest();
        });
        window.addEventListener('message', function (e) {
          var d = e.data || {};
          if (!d || (d.type !== 'cudic-save-get' && d.type !== 'cudic-save-set' && d.type !== 'cudic-save-del')) return;
          try { if (!f || e.source !== f.contentWindow) return; } catch (err) { return; }
          if (d.type === 'cudic-save-get') {
            try { f.contentWindow.postMessage({ type: 'cudic-save-data', req: d.req, save: cloudSave, authed: !!saveSession, storageKey: saveKey }, '*'); } catch (err) {}
          } else if (!saveSession) {
            try { f.contentWindow.postMessage({ type: 'cudic-save-ack', req: d.req, ok: false, error: 'signed-out' }, '*'); } catch (err) {}
          } else if (d.type === 'cudic-save-set') {
            if (!d.data || typeof d.data !== 'object' || Array.isArray(d.data) || JSON.stringify(d.data).length > 100 * 1024) {
              try { f.contentWindow.postMessage({ type: 'cudic-save-ack', req: d.req, ok: false, error: 'bad-data' }, '*'); } catch (err) {}
              return;
            }
            fetch(apiBase() + '/api/saves/' + encodeURIComponent(id), { method: 'PUT', headers: saveHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ data: d.data }) })
              .then(function (r) {
                if (r.status === 403) { if (typeof pauseSeat === 'function') pauseSeat('device'); }
                return r.json().catch(function () { return {}; });
              })
              .then(function (j) {
                var ok = !j.error;
                if (ok) cloudSave = { data: d.data, updated_at: j.updated_at };
                try { f.contentWindow.postMessage({ type: 'cudic-save-ack', req: d.req, ok: ok, error: j.error }, '*'); } catch (err) {}
              })
              .catch(function () {
                try { f.contentWindow.postMessage({ type: 'cudic-save-ack', req: d.req, ok: false, error: 'network' }, '*'); } catch (err) {}
              });
          } else if (d.type === 'cudic-save-del') {
            fetch(apiBase() + '/api/saves/' + encodeURIComponent(id), { method: 'DELETE', headers: saveHeaders() })
              .then(function () { cloudSave = null; })
              .catch(function () {});
            try { f.contentWindow.postMessage({ type: 'cudic-save-ack', req: d.req, ok: true }, '*'); } catch (err) {}
          }
        });
        setTimeout(function(){
          if (!playerStarted) playerFail('Player did not start. Hard-refresh (Ctrl+Shift+R); if it persists, open the project in Studio and re-save.');
        }, 6000);
        document.getElementById('fsBtn').addEventListener('click', function(){
          if (card.requestFullscreen) card.requestFullscreen();
        });
      })
      .catch(function(){ document.getElementById('overlayText').textContent = 'Could not load game'; });
  })();
  </script>
</body></html>
