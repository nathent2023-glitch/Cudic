<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
// Code runner: inlines local .js/.css into index.html, then boots it via
// document.write (NOT blob: navigation — the player iframe is sandboxed
// without allow-same-origin and blob: loads are blocked there by design;
// allow-same-origin is NOT an option: it would expose the parent origin +
// localStorage token to user-published games).
// Protocol: parent posts {type:'code', files, assets, assetsBase},
// we post {type:'ready'} + {type:'console',...}.
window.addEventListener('message', async (e) => {
  const d = e.data || {};
  if (d.type !== 'code' || !d.files) return;
  const files = d.files;
  const assets = d.assets || {};
  const assetsBase = d.assetsBase || '';
  function esc(s, tag) { return String(s).replace(new RegExp('</' + tag, 'gi'), '<\\/' + tag); }
  // Match a reference the way the Studio preview does (normalizeRef in
  // studio/src/glox.ts): './app.js', '/app.js', 'app.js?v=3', 'dist/app.js' and
  // case differences all name the same file. When the two rules drifted, a
  // project previewed fine and 404'd the moment it was published. Keep in step.
  function norm(p) {
    return String(p).trim().split(/[?#]/)[0].replace(/^\.\//, '').replace(/^\/+/, '').replace(/^workspace\//i, '');
  }
  function find(p) {
    const n = norm(p).toLowerCase();
    return Object.keys(files).find(k => { const l = k.toLowerCase(); return l === n || l.endsWith('/' + n); });
  }
  function mimeOf(p) {
    if (/\.png$/i.test(p)) return 'image/png';
    if (/\.jpe?g$/i.test(p)) return 'image/jpeg';
    if (/\.gif$/i.test(p)) return 'image/gif';
    if (/\.svg$/i.test(p)) return 'image/svg+xml';
    if (/\.webp$/i.test(p)) return 'image/webp';
    if (/\.mp3$/i.test(p)) return 'audio/mpeg';
    if (/\.wav$/i.test(p)) return 'audio/wav';
    if (/\.ogg$/i.test(p)) return 'audio/ogg';
    if (/\.mp4$/i.test(p)) return 'video/mp4';
    if (/\.webm$/i.test(p)) return 'video/webm';
    if (/\.pdf$/i.test(p)) return 'application/pdf';
    return 'application/octet-stream';
  }
  function dataUrl(mime, content) {
    return new Promise((res, rej) => {
      try {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.readAsDataURL(new Blob([content], { type: mime }));
      } catch (err) { rej(err); }
    });
  }
  // ── Multi-file ES modules ────────────────────────────────────────────────
  // A relative `import './x.js'` between project files cannot resolve in this
  // frame: the inlined document's base URL is run.html, so the specifier 404s.
  // Rewrite those specifiers to import-map ids whose targets are data: URLs of
  // the files (published files live in the database, so there is no server
  // path for them, and blob: is blocked in this sandbox by design).
  // The Studio preview does the same with the same ids — keep the two in step.
  const mods = {}; // 'cudic~a.js' -> { path, code }
  const modId = (p) => 'cudic~' + p.toLowerCase();
  const MODULE_FILE = /\.(m?js|json)$/i;
  // Resolve a specifier against the importing file's own directory, so
  // src/main.js importing './util.js' finds src/util.js.
  function resolveSpec(from, spec) {
    if (!/^\.\.?\//.test(spec)) return null; // bare, CDN or absolute: not ours
    const parts = norm(from).split('/').slice(0, -1);
    for (const seg of String(spec).split('/')) {
      if (seg === '.' || seg === '') continue;
      if (seg === '..') parts.pop();
      else parts.push(seg);
    }
    const hit = find(parts.join('/'));
    return hit && MODULE_FILE.test(hit) ? hit : null;
  }
  function mapImports(code, from) {
    return String(code).replace(/(from\s+|import\s*\(\s*|import\s+)(["'])([^"']+)\2/g, (m, pre, q, spec) => {
      const hit = resolveSpec(from, spec);
      if (!hit) return m;
      const id = modId(hit);
      if (!mods[id]) mods[id] = { path: hit, code: null }; // queued
      return pre + q + id + q;
    });
  }
  // Mapped files import further mapped files: keep going until the queue is dry.
  function drainModules() {
    for (;;) {
      const id = Object.keys(mods).find((k) => mods[k].code === null);
      if (!id) return;
      const m = mods[id];
      const src = files[m.path] || '';
      m.code = mapImports(/\.json$/i.test(m.path) ? src : esc(src, 'script'), m.path);
    }
  }
  function moduleImports() {
    const mine = {};
    for (const id of Object.keys(mods)) {
      const m = mods[id];
      mine[id] = 'data:' + (/\.json$/i.test(m.path) ? 'application/json' : 'text/javascript') +
        ';base64,' + btoa(unescape(encodeURIComponent(m.code || '')));
    }
    return mine;
  }
  // Returns a tag to inject, or '' when the project already has an importmap —
  // then ours is merged into it, because a second map is newer-Chrome-only and
  // older Chrome drops a document's maps entirely. Ids never collide.
  function mergeMapTag(mine) {
    const ids = Object.keys(mine);
    if (!ids.length) return '';
    const tag = '<script type="importmap">' + JSON.stringify({ imports: mine }) + '<\/script>';
    const found = /<script\b[^>]*type=["']importmap["'][^>]*>([\s\S]*?)<\/script\s*>/i.exec(index);
    if (!found) return tag;
    try {
      const theirs = JSON.parse(found[1]);
      theirs.imports = Object.assign({}, theirs.imports, mine);
      // Function replacement: the tag is emitted verbatim, never $-expanded.
      index = index.replace(found[0], () => '<script type="importmap">' + JSON.stringify(theirs) + '<\/script>');
    } catch (err) {
      // Not valid JSON, so the browser rejects their map anyway — replace it.
      parent.postMessage({ type: 'console', level: 'warn', text: "This project's importmap is not valid JSON, so it was replaced (" + err.message + ').' }, '*');
      index = index.replace(found[0], () => tag);
    }
    return '';
  }
  // `<script>` blocks written straight into index.html belong to index.html, so
  // their relative refs resolve from the root.
  function mapInlineScripts() {
    index = index.replace(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, (m, attrs, code) =>
      /\bsrc\s*=/.test(attrs) ? m : '<script' + attrs + '>' + mapImports(code, 'index.html') + '<\/script>');
  }
  // Inline JS carrying import/export needs type="module" — a plain <script>
  // throws on it. Same rule as the Studio preview (scriptTag in glox.ts).
  function needsModule(js) {
    return /(^|[;{}])\s*import\b\s*(?:["'{*]|[A-Za-z_$])/.test(js) ||
      /(^|[;{}])\s*export\s/.test(js) || /\bimport\.meta\b/.test(js);
  }
  let index = files['index.html'] || '';
  if (!index) {
    parent.postMessage({ type: 'console', level: 'error', text: 'No index.html in project' }, '*');
    return;
  }
  // Binary siblings in the files map -> data: URLs (sandbox-safe).
  const BIN = /\.(png|jpe?g|gif|svg|webp|ico|mp3|wav|ogg|mp4|webm|pdf)$/i;
  const dataUrls = {};
  for (const p of Object.keys(files)) {
    if (BIN.test(p) && typeof files[p] === 'string') {
      try { dataUrls[p] = await dataUrl(mimeOf(p), files[p]); } catch (err) {}
    }
  }
  function assetUrl(p) {
    const hit = find(p);
    if (hit && dataUrls[hit]) return dataUrls[hit];
    const keys = Object.keys(assets);
    for (let i = 0; i < keys.length; i++) {
      if (keys[i] === p || keys[i].endsWith('/' + p)) return assetsBase + assets[keys[i]];
    }
    return null;
  }
  // A relative .js/.css we could not inline is a 404 inside the frame. Say so
  // in the game console instead of rendering half a page with no explanation.
  // A leading '/' is a platform path (/cudic-save.js), not a missing file.
  const missed = [];
  // Inline local stylesheets: <link href="x.css"> -> <style>…</style>
  index = index.replace(/<link\b[^>]*\bhref=["']([^"']+)["'][^>]*>/gi, (tag, p) => {
    if (/^(https?:|data:|blob:|#)/.test(p)) return tag;
    const key = find(p);
    if (!key || !/\.css$/i.test(key) || typeof files[key] !== 'string') { if (/\.css$/i.test(norm(p)) && !/^\//.test(p.trim())) missed.push(p); return tag; }
    return '<style>\n' + esc(files[key], 'style') + '\n</style>';
  });
  // Inline local scripts: script tags with src="x.js" get their content inlined
  index = index.replace(/<script\b([^>]*?)\bsrc=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (tag, pre, p, post) => {
    if (/^(https?:|data:|blob:|#)/.test(p)) return tag;
    const key = find(p);
    if (!key || !/\.js$/i.test(key) || typeof files[key] !== 'string') { if (/\.(js|mjs)$/i.test(norm(p)) && !/^\//.test(p.trim())) missed.push(p); return tag; }
    const code = esc(files[key], 'script');
    const attrs = pre + post + (needsModule(code) && !/\btype\s*=/i.test(pre + post) ? ' type="module"' : '');
    return '<script' + attrs + '>\n' + mapImports(code, key) + '\n<\/script>';
  });
  for (const p of missed) {
    parent.postMessage({ type: 'console', level: 'error', text: 'Cannot inline "' + p + '": no such file in this project, so the game will not load it.' }, '*');
  }
  mapInlineScripts();
  drainModules();
  const mapTag = mergeMapTag(moduleImports());
  // Remaining relative refs (images, etc.): public asset URL or data: URL
  index = index.replace(/(src|href)=["'](?!https?:|data:|blob:|#)([^"']+)["']/g, (m, attr, p) => {
    const u = assetUrl(p);
    return u ? attr + '="' + u + '"' : m;
  });
  // Runtime-fetched assets (Scratch imports) resolve through this map: binary
  // siblings as data: URLs, saved binaries as public storage URLs.
  const binMap = {};
  for (const p of Object.keys(dataUrls)) binMap[p] = dataUrls[p];
  for (const k of Object.keys(assets)) {
    const p = k.split('/').slice(2).join('/');
    if (p) binMap[p] = assetsBase + assets[k];
  }
  const binTag = '<script>window.__CUDIC_BIN__ = ' + JSON.stringify(binMap).replace(/<\//g, '<\\/') + ';<\/script>';
  const fwd = '<script>["log","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){var t=Array.prototype.map.call(arguments,String).join(" ");parent.postMessage({type:"console",level:k==="log"?"info":k,text:t},"*");o.apply(console,arguments)}});window.addEventListener("error",function(e){parent.postMessage({type:"console",level:"error",text:e.message},"*")})<\/script>' + binTag + mapTag;
  parent.postMessage({ type: 'console', level: 'info', text: 'Running' }, '*');
  // ponytail: doctype must stay first or the frame renders in quirks mode
  const doc = (/^\s*<!doctype html>/i.test(index))
    ? index.replace(/^(\s*<!doctype html>)/i, '$1' + fwd)
    : fwd + index;
  document.open();
  document.write(doc);
  document.close();
});
// Compat rule: bump v (and view.html's check) on any protocol change.
// Old players announce themselves instead of silently misbehaving.
parent.postMessage({ type: 'ready', v: 2 }, '*');
</script>
</body>
</html>
