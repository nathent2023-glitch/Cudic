<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake — made with Cudic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0e10; color: #dbe4ff; font-family: "Space Grotesk", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; letter-spacing: 0.02em; }
  h1 span { color: #855CD6; }
  .hud { display: flex; gap: 18px; margin: 10px 0 14px; font-size: 0.95rem; color: #8b8b96; }
  .hud b { color: #FF8C1A; }
  #wrap { position: relative; width: min(92vw, 420px); }
  canvas { width: 100%; aspect-ratio: 1; display: block; background: #141318;
    border: 1px solid #2a2a33; border-radius: 12px; touch-action: none; }
  #over { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(13,14,16,0.82);
    border-radius: 12px; text-align: center; }
  #over.show { display: flex; }
  #over p { color: #8b8b96; font-size: 0.9rem; }
  button { background: #855CD6; color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.1); }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #55555f; }
  footer { margin-top: auto; padding-top: 18px; font-size: 0.75rem; color: #55555f; }
</style>
</head>
<body>
  <h1><span>◆</span> Snake</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="420" height="420"></canvas>
    <div id="over"><h2 id="overTitle">Game over</h2><p id="overSub"></p><button id="again">Play again</button></div>
  </div>
  <p class="hint">Arrows / WASD or swipe to steer · Space to restart</p>
  <footer>Made with Cudic — fork it and make it yours.</footer>
<script>
(function () {
  var N = 21, CELL = 420 / N;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var over = document.getElementById('over'), overSub = document.getElementById('overSub');
  var snake, dir, queue, food, score, best, timer, alive, step;
  try { best = parseInt(localStorage.getItem('cudic-snake-best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; queue = [];
    score = 0; step = 120; alive = true;
    scoreEl.textContent = '0';
    over.classList.remove('show');
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, step);
  }
  function placeFood() {
    while (true) {
      var f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
      var hit = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === f.x && snake[i].y === f.y) { hit = true; break; }
      }
      if (!hit) { food = f; return; }
    }
  }
  function steer(x, y) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -x && last.y === -y) return;      // no 180s
    if (last.x === x && last.y === y) return;        // no dupes
    if (queue.length < 3) queue.push({ x: x, y: y });
  }
  function tick() {
    if (queue.length) dir = queue.shift();
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) return die();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === h.x && snake[i].y === h.y) return die();
    }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('cudic-snake-best', String(best)); } catch (e) {}
      }
      if (step > 55) { step -= 3; clearInterval(timer); timer = setInterval(tick, step); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function die() {
    alive = false;
    clearInterval(timer);
    overSub.textContent = 'You scored ' + score + ' points.';
    over.classList.add('show');
  }
  function draw() {
    ctx.fillStyle = '#141318';
    ctx.fillRect(0, 0, 420, 420);
    ctx.fillStyle = '#FF8C1A';
    round(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, 5);
    ctx.fill();
    for (var i = snake.length - 1; i >= 0; i--) {
      ctx.fillStyle = i === 0 ? '#855CD6' : '#4a3a7a';
      round(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, 4);
      ctx.fill();
    }
  }
  function round(x, y, s, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, s, s, r);
  }
  var KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  document.addEventListener('keydown', function (e) {
    if (KEYS[e.code]) { e.preventDefault(); if (alive) steer(KEYS[e.code][0], KEYS[e.code][1]); }
    else if (e.code === 'Space') { e.preventDefault(); reset(); }
  });
  var tx = 0, ty = 0;
  cv.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!alive) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0);
    else steer(0, dy > 0 ? 1 : -1);
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });
  document.getElementById('again').addEventListener('click', reset);
  reset();
  draw();
})();
</script>
</body>
</html>
