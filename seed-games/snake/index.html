<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  .hud { display: flex; gap: 18px; margin: 10px 0 14px; font-size: 0.95rem;
    font-weight: 800; text-transform: uppercase; color: #777777; }
  .hud b { color: #3c3c3c; }
  #wrap { position: relative; width: min(92vw, 420px); background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 20px; padding: 14px;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  canvas { width: 100%; aspect-ratio: 1; display: block; background: #f7f7f7;
    border: 2px solid #e5e5e5; border-radius: 16px; touch-action: none; }
  #over { position: absolute; inset: 14px; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(255,255,255,0.92);
    border-radius: 16px; text-align: center; }
  #over.show { display: flex; }
  #over h2 { font-weight: 900; text-transform: uppercase; }
  #over p { color: #777777; font-size: 0.9rem; }
  button { background: #58cc02; color: #ffffff; border: none; border-radius: 16px;
    padding: 12px 24px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #afafaf; }
</style>
</head>
<body>
  <h1><span>◆</span> Snake</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="420" height="420"></canvas>
    <div id="over"><h2>Game over</h2><p id="overSub"></p><button id="again">Play again</button></div>
  </div>
  <p class="hint">Arrows / WASD or swipe · Space to restart</p>
<script>
(function () {
  var N = 21, CELL = 420 / N;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var over = document.getElementById('over'), overSub = document.getElementById('overSub');
  var snake, dir, queue, food, score, best, timer, alive, step;
  try { best = parseInt(localStorage.getItem('cudic-snake-best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; queue = [];
    score = 0; step = 120; alive = true;
    scoreEl.textContent = '0';
    over.classList.remove('show');
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, step);
  }
  function placeFood() {
    while (true) {
      var f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
      var hit = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === f.x && snake[i].y === f.y) { hit = true; break; }
      }
      if (!hit) { food = f; return; }
    }
  }
  function steer(x, y) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -x && last.y === -y) return;
    if (last.x === x && last.y === y) return;
    if (queue.length < 3) queue.push({ x: x, y: y });
  }
  function tick() {
    if (queue.length) dir = queue.shift();
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) return die();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === h.x && snake[i].y === h.y) return die();
    }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('cudic-snake-best', String(best)); } catch (e) {}
      }
      if (step > 55) { step -= 3; clearInterval(timer); timer = setInterval(tick, step); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function die() {
    alive = false;
    clearInterval(timer);
    overSub.textContent = 'You scored ' + score + ' points.';
    over.classList.add('show');
  }
  function seg(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }
  function draw() {
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, 420, 420);
    var fx = food.x * CELL, fy = food.y * CELL;
    seg(fx + 3, fy + 5, CELL - 6, CELL - 6, 9, '#d33131');
    seg(fx + 3, fy + 2, CELL - 6, CELL - 6, 9, '#ff4b4b');
    ctx.fillStyle = '#58cc02';
    ctx.fillRect(fx + CELL / 2 - 1.5, fy - 2, 3, 7);
    for (var i = snake.length - 1; i >= 0; i--) {
      var sx = snake[i].x * CELL, sy = snake[i].y * CELL;
      seg(sx + 1, sy + 4, CELL - 2, CELL - 2, 6, '#46a302');
      seg(sx + 1, sy + 1, CELL - 2, CELL - 2, 6, '#58cc02');
      if (i === 0) {
        var cx = sx + CELL / 2, cy = sy + CELL / 2;
        var ex = dir.x * 4, ey = dir.y * 4;
        var pxv = -dir.y, pyv = dir.x;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(cx + pxv * 5 + ex, cy + pyv * 5 + ey, 4.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx - pxv * 5 + ex, cy - pyv * 5 + ey, 4.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#3c3c3c';
        ctx.beginPath(); ctx.arc(cx + pxv * 5 + ex * 1.6, cy + pyv * 5 + ey * 1.6, 2.2, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx - pxv * 5 + ex * 1.6, cy - pyv * 5 + ey * 1.6, 2.2, 0, 7); ctx.fill();
      }
    }
  }
  var KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  document.addEventListener('keydown', function (e) {
    if (KEYS[e.code]) { e.preventDefault(); if (alive) steer(KEYS[e.code][0], KEYS[e.code][1]); }
    else if (e.code === 'Space') { e.preventDefault(); reset(); }
  });
  var tx = 0, ty = 0;
  cv.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!alive) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0);
    else steer(0, dy > 0 ? 1 : -1);
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });
  document.getElementById('again').addEventListener('click', reset);
  reset();
  draw();
})();
</script>
</body>
</html>
