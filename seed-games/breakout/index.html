<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout — made with Cudic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0e10; color: #dbe4ff; font-family: "Space Grotesk", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; }
  h1 span { color: #855CD6; }
  .hud { display: flex; gap: 22px; margin: 10px 0 14px; font-size: 0.95rem; color: #8b8b96; }
  .hud b { color: #FF8C1A; }
  #wrap { position: relative; width: min(94vw, 560px); }
  canvas { width: 100%; aspect-ratio: 7/5; display: block; background: #141318;
    border: 1px solid #2a2a33; border-radius: 12px; touch-action: none; }
  #over { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(13,14,16,0.82);
    border-radius: 12px; text-align: center; }
  #over.show { display: flex; }
  #over p { color: #8b8b96; font-size: 0.9rem; }
  button { background: #855CD6; color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.1); }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #55555f; }
  footer { margin-top: auto; padding-top: 18px; font-size: 0.75rem; color: #55555f; }
</style>
</head>
<body>
  <h1><span>◆</span> Breakout</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span><span>Level <b id="level">1</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="560" height="400"></canvas>
    <div id="over"><h2 id="overTitle">Game over</h2><p id="overSub"></p><button id="again">Play again</button></div>
  </div>
  <p class="hint">Mouse, drag, or ← → keys · Click / Space to launch</p>
  <footer>Made with Cudic — fork it and make it yours.</footer>
<script>
(function () {
  var W = 560, H = 400, PW = 84, PH = 12, BR = 8;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), levelEl = document.getElementById('level');
  var over = document.getElementById('over'), overTitle = document.getElementById('overTitle'), overSub = document.getElementById('overSub');
  var ROWS = 5, COLS = 8;
  var COLORS = ['#855CD6', '#6a4fc4', '#FF8C1A', '#e67a00', '#4ec9b0'];
  var px, ball, bricks, score, lives, level, state, pv;

  function buildLevel() {
    bricks = [];
    var gw = (W - 40) / COLS, bh = 24;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({ x: 20 + c * gw + 3, y: 50 + r * (bh + 8), w: gw - 6, h: bh, color: COLORS[r % COLORS.length], dead: false });
      }
    }
  }
  function reset(full) {
    if (full) { score = 0; lives = 3; level = 1; }
    px = W / 2;
    scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level;
    over.classList.remove('show');
    buildLevel();
    stick();
  }
  function stick() {
    ball = { x: px, y: H - 40, vx: 0, vy: 0, stuck: true };
    state = 'serve';
  }
  function launch() {
    if (state !== 'serve') return;
    var sp = 4 + level * 0.5;
    var a = (Math.random() * 0.8 - 0.4) - Math.PI / 2;
    ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp;
    ball.stuck = false;
    state = 'play';
  }
  function loseLife() {
    lives--; livesEl.textContent = lives;
    if (lives <= 0) {
      overTitle.textContent = 'Game over';
      overSub.textContent = 'You scored ' + score + ' points on level ' + level + '.';
      over.classList.add('show');
      state = 'over';
    } else {
      stick();
    }
  }
  function step() {
    ctx.fillStyle = '#141318';
    ctx.fillRect(0, 0, W, H);
    px += pv;
    if (px < PW / 2 + 8) px = PW / 2 + 8;
    if (px > W - PW / 2 - 8) px = W - PW / 2 - 8;

    if (state === 'play') {
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x < BR + 6) { ball.x = BR + 6; ball.vx *= -1; }
      if (ball.x > W - BR - 6) { ball.x = W - BR - 6; ball.vx *= -1; }
      if (ball.y < BR + 6) { ball.y = BR + 6; ball.vy *= -1; }
      // paddle
      if (ball.vy > 0 && ball.y + BR >= H - 34 && ball.y + BR <= H - 22 && Math.abs(ball.x - px) < PW / 2 + BR) {
        var off = (ball.x - px) / (PW / 2);
        var sp = Math.min(8, Math.hypot(ball.vx, ball.vy) * 1.02);
        var ang = -Math.PI / 2 + off * 1.1;
        ball.vx = Math.cos(ang) * sp; ball.vy = Math.sin(ang) * sp;
        ball.y = H - 34 - BR;
      }
      // bricks
      var left = 0;
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (b.dead) continue;
        left++;
        if (ball.x + BR > b.x && ball.x - BR < b.x + b.w && ball.y + BR > b.y && ball.y - BR < b.y + b.h) {
          b.dead = true;
          ball.vy *= -1;
          score += 10;
          scoreEl.textContent = score;
        }
      }
      if (left === 0) {
        level++; levelEl.textContent = level;
        score += 100; scoreEl.textContent = score;
        buildLevel();
        stick();
      }
      if (ball.y > H + 20) loseLife();
    } else if (state === 'serve' && ball) {
      ball.x = px;
    }

    for (var j = 0; j < bricks.length; j++) {
      var bb = bricks[j];
      if (bb.dead) continue;
      ctx.fillStyle = bb.color;
      ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
    }
    ctx.fillStyle = '#855CD6';
    ctx.fillRect(px - PW / 2, H - 28, PW, PH);
    if (ball) {
      ctx.fillStyle = '#dbe4ff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fill();
    }
    if (state === 'serve') {
      ctx.fillStyle = '#55555f';
      ctx.font = '15px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('click or press space to launch', W / 2, H / 2 + 60);
    }
    requestAnimationFrame(step);
  }
  document.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft') { pv = -7; e.preventDefault(); }
    else if (e.code === 'ArrowRight') { pv = 7; e.preventDefault(); }
    else if (e.code === 'Space') { e.preventDefault(); launch(); }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') pv = 0;
  });
  function toX(clientX) {
    var r = cv.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  cv.addEventListener('mousemove', function (e) { px = toX(e.clientX); });
  cv.addEventListener('mousedown', launch);
  cv.addEventListener('touchstart', function (e) { px = toX(e.changedTouches[0].clientX); }, { passive: true });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); px = toX(e.changedTouches[0].clientX); }, { passive: false });
  document.getElementById('again').addEventListener('click', function () { reset(true); });
  pv = 0;
  reset(true);
  step();
})();
</script>
</body>
</html>
