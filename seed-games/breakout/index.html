<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  .hud { display: flex; gap: 22px; margin: 10px 0 14px; font-size: 0.9rem;
    font-weight: 800; text-transform: uppercase; color: #777777; }
  .hud b { color: #3c3c3c; }
  #wrap { position: relative; width: min(94vw, 560px); background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 20px; padding: 14px;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  canvas { width: 100%; aspect-ratio: 7/5; display: block; background: #f7f7f7;
    border: 2px solid #e5e5e5; border-radius: 16px; touch-action: none; }
  #over { position: absolute; inset: 14px; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(255,255,255,0.92);
    border-radius: 16px; text-align: center; }
  #over.show { display: flex; }
  #over h2 { font-weight: 900; text-transform: uppercase; }
  #over p { color: #777777; font-size: 0.9rem; }
  button { background: #58cc02; color: #ffffff; border: none; border-radius: 16px;
    padding: 12px 24px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #afafaf; }
</style>
</head>
<body>
  <h1><span>◆</span> Breakout</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Lives <b id="lives">3</b></span><span>Level <b id="level">1</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="560" height="400"></canvas>
    <div id="over"><h2 id="overTitle">Game over</h2><p id="overSub"></p><button id="again">Play again</button></div>
  </div>
  <p class="hint">Mouse, drag, or ← → keys · Click / Space to launch</p>
<script src="/cudic-save.js?v=1"></script>
<script>
(function () {
  var W = 560, H = 400, PW = 84, PH = 14, BR = 8;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), levelEl = document.getElementById('level'), bestEl = document.getElementById('best');
  var over = document.getElementById('over'), overTitle = document.getElementById('overTitle'), overSub = document.getElementById('overSub');
  var ROWS = 5, COLS = 8;
  var ROWCOLORS = [
    ['#ff4b4b', '#d33131'], ['#ffc800', '#e6a800'], ['#58cc02', '#46a302'],
    ['#1cb0f6', '#1899d6'], ['#ce82ff', '#a568cc']
  ];
  var px, ball, bricks, score, lives, level, state, pv, best = 0;
  var CS = window.CudicSave || null;
  function saveBest() {
    if (CS) { CS.save({ best: best }); return; }
    try { localStorage.setItem('cudic-breakout-best', String(best)); } catch (e) {}
  }
  function bumpBest() {
    if (score > best) { best = score; bestEl.textContent = best; saveBest(); }
  }
  try { best = parseInt(localStorage.getItem('cudic-breakout-best') || '0', 10) || 0; } catch (e) {}
  if (CS) CS.load({
    legacyKey: 'cudic-breakout-best',
    legacyMap: function (n) { n = parseInt(n, 10) || 0; return { best: n }; }
  }).then(function (d) {
    if (d && typeof d.best === 'number' && d.best > best) { best = d.best; bestEl.textContent = best; }
  }).catch(function () {});

  function buildLevel() {
    bricks = [];
    var gw = (W - 40) / COLS, bh = 24;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({ x: 20 + c * gw + 3, y: 50 + r * (bh + 8), w: gw - 6, h: bh, colors: ROWCOLORS[r % ROWCOLORS.length], dead: false });
      }
    }
  }
  function reset(full) {
    if (full) { score = 0; lives = 3; level = 1; }
    px = W / 2;
    scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level; bestEl.textContent = best;
    over.classList.remove('show');
    buildLevel();
    stick();
  }
  function stick() {
    ball = { x: px, y: H - 44, vx: 0, vy: 0, stuck: true };
    state = 'serve';
  }
  function launch() {
    if (state !== 'serve') return;
    var sp = 4 + level * 0.5;
    var a = (Math.random() * 0.8 - 0.4) - Math.PI / 2;
    ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp;
    ball.stuck = false;
    state = 'play';
  }
  function loseLife() {
    lives--; livesEl.textContent = lives;
    if (lives <= 0) {
      overTitle.textContent = 'Game over';
      overSub.textContent = 'You scored ' + score + ' points on level ' + level + '.';
      over.classList.add('show');
      state = 'over';
    } else {
      stick();
    }
  }
  function brick(x, y, w, h, colors) {
    ctx.fillStyle = colors[1];
    ctx.beginPath(); ctx.roundRect(x, y + 3, w, h, 6); ctx.fill();
    ctx.fillStyle = colors[0];
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill();
  }
  function step() {
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, W, H);
    px += pv;
    if (px < PW / 2 + 8) px = PW / 2 + 8;
    if (px > W - PW / 2 - 8) px = W - PW / 2 - 8;

    if (state === 'play') {
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x < BR + 6) { ball.x = BR + 6; ball.vx *= -1; }
      if (ball.x > W - BR - 6) { ball.x = W - BR - 6; ball.vx *= -1; }
      if (ball.y < BR + 6) { ball.y = BR + 6; ball.vy *= -1; }
      if (ball.vy > 0 && ball.y + BR >= H - 38 && ball.y + BR <= H - 26 && Math.abs(ball.x - px) < PW / 2 + BR) {
        var off = (ball.x - px) / (PW / 2);
        var sp = Math.min(8, Math.hypot(ball.vx, ball.vy) * 1.02);
        var ang = -Math.PI / 2 + off * 1.1;
        ball.vx = Math.cos(ang) * sp; ball.vy = Math.sin(ang) * sp;
        ball.y = H - 38 - BR;
      }
      var left = 0;
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (b.dead) continue;
        left++;
        if (ball.x + BR > b.x && ball.x - BR < b.x + b.w && ball.y + BR > b.y && ball.y - BR < b.y + b.h) {
          b.dead = true;
          ball.vy *= -1;
          score += 10;
          scoreEl.textContent = score;
          bumpBest();
        }
      }
      if (left === 0) {
        level++; levelEl.textContent = level;
        score += 100; scoreEl.textContent = score;
        bumpBest();
        buildLevel();
        stick();
      }
      if (ball.y > H + 20) loseLife();
    } else if (state === 'serve' && ball) {
      ball.x = px;
    }

    for (var j = 0; j < bricks.length; j++) {
      var bb = bricks[j];
      if (bb.dead) continue;
      brick(bb.x, bb.y, bb.w, bb.h, bb.colors);
    }
    ctx.fillStyle = '#46a302';
    ctx.beginPath(); ctx.roundRect(px - PW / 2, H - 28 + 3, PW, PH, 7); ctx.fill();
    ctx.fillStyle = '#58cc02';
    ctx.beginPath(); ctx.roundRect(px - PW / 2, H - 28, PW, PH, 7); ctx.fill();
    if (ball) {
      ctx.fillStyle = '#3c3c3c';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fill();
    }
    if (state === 'serve') {
      ctx.fillStyle = '#afafaf';
      ctx.font = "800 15px Nunito, system-ui, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('CLICK OR PRESS SPACE TO LAUNCH', W / 2, H / 2 + 60);
    }
    requestAnimationFrame(step);
  }
  document.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft') { pv = -7; e.preventDefault(); }
    else if (e.code === 'ArrowRight') { pv = 7; e.preventDefault(); }
    else if (e.code === 'Space') { e.preventDefault(); launch(); }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') pv = 0;
  });
  function toX(clientX) {
    var r = cv.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  cv.addEventListener('mousemove', function (e) { px = toX(e.clientX); });
  cv.addEventListener('mousedown', launch);
  cv.addEventListener('touchstart', function (e) { px = toX(e.changedTouches[0].clientX); }, { passive: true });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); px = toX(e.changedTouches[0].clientX); }, { passive: false });
  document.getElementById('again').addEventListener('click', function () { reset(true); });
  pv = 0;
  reset(true);
  step();
})();
</script>
</body>
</html>
