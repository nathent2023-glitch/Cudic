<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pong</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  .hud { display: flex; gap: 26px; margin: 10px 0 14px; font-size: 0.9rem;
    font-weight: 800; text-transform: uppercase; color: #777777; }
  .hud b { color: #3c3c3c; font-size: 1.5rem; }
  #wrap { position: relative; width: min(94vw, 620px); background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 20px; padding: 14px;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  canvas { width: 100%; aspect-ratio: 3/2; display: block; background: #f7f7f7;
    border: 2px solid #e5e5e5; border-radius: 16px; touch-action: none; cursor: none; }
  #over { position: absolute; inset: 14px; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(255,255,255,0.92);
    border-radius: 16px; text-align: center; }
  #over.show { display: flex; }
  #over h2 { font-weight: 900; text-transform: uppercase; }
  #over p { color: #777777; font-size: 0.9rem; }
  button { background: #58cc02; color: #ffffff; border: none; border-radius: 16px;
    padding: 12px 24px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #afafaf; }
</style>
</head>
<body>
  <h1><span>◆</span> Pong</h1>
  <div class="hud"><span>You <b id="ps">0</b></span><span><b id="cs">0</b> CPU</span></div>
  <div id="wrap">
    <canvas id="cv" width="600" height="400"></canvas>
    <div id="over"><h2 id="overTitle">You win!</h2><p>First to 5 takes it.</p><button id="again">Play again</button></div>
  </div>
  <p class="hint">Move mouse, drag, or ↑ ↓ keys · Click / Space to serve</p>
<script>
(function () {
  var W = 600, H = 400, PH = 84, PW = 10, WIN = 5;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var psEl = document.getElementById('ps'), csEl = document.getElementById('cs');
  var over = document.getElementById('over'), overTitle = document.getElementById('overTitle');
  var py = H / 2, cy = H / 2, pv = 0, ball, ps = 0, cs = 0, state = 'serve', pauseT = 0;

  function serve(toward) {
    ball = { x: W / 2, y: H / 2, vx: (toward || (Math.random() < 0.5 ? 1 : -1)) * 4.2, vy: (Math.random() * 4 - 2) };
    state = 'play';
  }
  function reset(full) {
    if (full) { ps = 0; cs = 0; psEl.textContent = '0'; csEl.textContent = '0'; }
    py = H / 2; cy = H / 2;
    over.classList.remove('show');
    state = 'serve';
  }
  function point(winner) {
    if (winner === 'p') { ps++; psEl.textContent = ps; } else { cs++; csEl.textContent = cs; }
    if (ps >= WIN || cs >= WIN) {
      overTitle.textContent = ps >= WIN ? 'You win!' : 'CPU wins!';
      over.classList.add('show');
      state = 'over';
    } else {
      state = 'pause'; pauseT = 50;
    }
  }
  function paddle(x, y, color, dark) {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.roundRect(x, y - PH / 2 + 4, PW, PH, 5); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x, y - PH / 2, PW, PH, 5); ctx.fill();
  }
  function step() {
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e5e5e5';
    for (var y = 6; y < H; y += 22) ctx.fillRect(W / 2 - 2, y, 4, 10);

    py += pv;
    if (py < PH / 2) py = PH / 2;
    if (py > H - PH / 2) py = H - PH / 2;

    var target = ball && state === 'play' ? ball.y : H / 2;
    var diff = target - cy;
    var max = 3.4;
    cy += Math.max(-max, Math.min(max, diff * 0.09));

    if (state === 'play' && ball) {
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y < 6 || ball.y > H - 6) ball.vy *= -1;
      if (ball.vx < 0 && ball.x - 6 < 20 + PW && ball.x > 20 && Math.abs(ball.y - py) < PH / 2 + 6) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy += (ball.y - py) * 0.045;
        ball.x = 20 + PW + 6;
      }
      if (ball.vx > 0 && ball.x + 6 > W - 20 - PW && ball.x < W - 20 && Math.abs(ball.y - cy) < PH / 2 + 6) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy += (ball.y - cy) * 0.045;
        ball.x = W - 20 - PW - 6;
      }
      if (Math.abs(ball.vy) > 7) ball.vy = ball.vy > 0 ? 7 : -7;
      if (ball.x < -20) point('c');
      if (ball.x > W + 20) point('p');
    } else if (state === 'pause') {
      if (--pauseT <= 0) serve();
    } else if (state === 'serve' && ball == null) {
      ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    }

    paddle(20, py, '#58cc02', '#46a302');
    paddle(W - 20 - PW, cy, '#1cb0f6', '#1899d6');
    if (ball && state !== 'serve') {
      ctx.fillStyle = '#3c3c3c';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, 7); ctx.fill();
    } else if (state === 'serve') {
      ctx.fillStyle = '#afafaf';
      ctx.font = "800 15px Nunito, system-ui, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('CLICK OR PRESS SPACE TO SERVE', W / 2, H / 2 + 40);
    }
    requestAnimationFrame(step);
  }
  function go() { if (state === 'serve') serve(); }
  document.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowUp') { pv = -6; e.preventDefault(); }
    else if (e.code === 'ArrowDown') { pv = 6; e.preventDefault(); }
    else if (e.code === 'Space') { e.preventDefault(); go(); }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') pv = 0;
  });
  function toY(clientY) {
    var r = cv.getBoundingClientRect();
    return (clientY - r.top) / r.height * H;
  }
  cv.addEventListener('mousemove', function (e) { py = toY(e.clientY); });
  cv.addEventListener('mousedown', go);
  cv.addEventListener('touchstart', function (e) { py = toY(e.changedTouches[0].clientY); }, { passive: true });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); py = toY(e.changedTouches[0].clientY); }, { passive: false });
  document.getElementById('again').addEventListener('click', function () { reset(true); });
  reset(true);
  step();
})();
</script>
</body>
</html>
