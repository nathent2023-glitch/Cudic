<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  .hud { display: flex; gap: 22px; margin: 10px 0 14px; font-size: 0.9rem;
    font-weight: 800; text-transform: uppercase; color: #777777; }
  .hud b { color: #3c3c3c; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(92vw, 420px); }
  .card { aspect-ratio: 1; border-radius: 14px; border: none; background: #58cc02;
    color: #ffffff; font-size: 1.6rem; font-weight: 900; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 0 #46a302; transition: transform 0.08s, box-shadow 0.08s, background 0.15s; }
  .card:active:not(.done):not(.open) { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .card.open { background: #ffffff; color: #3c3c3c; border: 2px solid #e5e5e5;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  .card.done { background: #ffffff; color: #58cc02; border: 2px solid #58cc02;
    box-shadow: 0 4px 0 0 #46a302; cursor: default; }
  #win { margin-top: 16px; display: none; flex-direction: column; gap: 10px;
    align-items: center; text-align: center; background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 20px; padding: 20px 28px;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  #win.show { display: flex; }
  #win h2 { font-weight: 900; text-transform: uppercase; }
  #win p { color: #777777; font-size: 0.9rem; }
  button.action { background: #58cc02; color: #ffffff; border: none; border-radius: 16px;
    padding: 12px 24px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  button.action:active { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  #newBtn { margin-top: 16px; background: #ffffff; color: #777777; border: 2px solid #e5e5e5;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  #newBtn:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>
  <h1><span>◆</span> Memory</h1>
  <div class="hud"><span>Moves <b id="moves">0</b></span><span>Pairs <b id="pairs">0/8</b></span><span>Time <b id="time">0s</b></span></div>
  <div id="grid"></div>
  <div id="win"><h2>You cleared it!</h2><p id="winSub"></p><button class="action" id="again">Play again</button></div>
  <button class="action" id="newBtn">Shuffle new game</button>
<script src="/cudic-save.js?v=1"></script>
<script>
(function () {
  var GLYPHS = ['★', '♥', '●', '▲', '✚', '◆', '◉', '✖'];
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves'), pairsEl = document.getElementById('pairs'), timeEl = document.getElementById('time');
  var win = document.getElementById('win'), winSub = document.getElementById('winSub');
  var first, lock, moves, found, secs, clock;
  var best = { moves: 0, time: 0 };
  var CS = window.CudicSave || null;
  function better(a, b) {
    if (!b || !b.moves) return false;
    if (!a || !a.moves) return true;
    if (b.moves !== a.moves) return b.moves < a.moves;
    return (b.time || 9999) < (a.time || 9999);
  }
  function saveBest() {
    if (CS) { CS.save({ moves: best.moves, time: best.time }); return; }
    try { localStorage.setItem('cudic-memory-best', JSON.stringify(best)); } catch (e) {}
  }
  try {
    var oldBest = JSON.parse(localStorage.getItem('cudic-memory-best') || 'null');
    if (better(best, oldBest)) best = oldBest;
  } catch (e) {}
  if (CS) CS.load({ legacyKey: 'cudic-memory-best' }).then(function (d) {
    if (better(best, d)) best = { moves: d.moves, time: d.time || 0 };
  }).catch(function () {});

  function reset() {
    var deck = GLYPHS.concat(GLYPHS);
    for (var i = deck.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    grid.innerHTML = '';
    deck.forEach(function (g) {
      var c = document.createElement('button');
      c.className = 'card';
      c.textContent = g;
      c.setAttribute('aria-label', 'Hidden card');
      c.addEventListener('click', function () { flip(c); });
      grid.appendChild(c);
    });
    first = null; lock = false; moves = 0; found = 0; secs = 0;
    movesEl.textContent = '0'; pairsEl.textContent = '0/8'; timeEl.textContent = '0s';
    win.classList.remove('show');
    clearInterval(clock);
    clock = setInterval(function () {
      secs++;
      timeEl.textContent = secs + 's';
    }, 1000);
  }
  function showFace(c, faceUp) {
    c.textContent = faceUp ? c.getAttribute('data-g') : '?';
  }
  function flip(c) {
    if (lock || c.classList.contains('open') || c.classList.contains('done')) return;
    c.classList.add('open');
    showFace(c, true);
    if (!first) { first = c; return; }
    moves++;
    movesEl.textContent = moves;
    if (first.getAttribute('data-g') === c.getAttribute('data-g')) {
      var a = first;
      first = null;
      setTimeout(function () {
        a.classList.remove('open'); a.classList.add('done');
        c.classList.remove('open'); c.classList.add('done');
        found++;
        pairsEl.textContent = found + '/8';
        if (found === 8) {
          clearInterval(clock);
          var rec = { moves: moves, time: secs };
          if (better(best, rec)) { best = rec; saveBest(); }
          winSub.textContent = moves + ' moves in ' + secs + ' seconds.' +
            (best.moves ? ' Best: ' + best.moves + ' moves · ' + best.time + 's.' : '');
          win.classList.add('show');
        }
      }, 350);
    } else {
      var b = first, d = c;
      first = null;
      lock = true;
      setTimeout(function () {
        showFace(b, false); b.classList.remove('open');
        showFace(d, false); d.classList.remove('open');
        lock = false;
      }, 750);
    }
  }
  function deal() {
    reset();
    var cards = grid.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].setAttribute('data-g', cards[i].textContent);
      showFace(cards[i], false);
    }
  }
  document.getElementById('again').addEventListener('click', deal);
  document.getElementById('newBtn').addEventListener('click', deal);
  deal();
})();
</script>
</body>
</html>
