<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  #count { font-size: 3rem; font-weight: 900; color: #3c3c3c; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  #rate { color: #777777; font-size: 0.9rem; font-weight: 800; text-transform: uppercase; margin-bottom: 18px; }
  #big { width: min(70vw, 220px); aspect-ratio: 1; border-radius: 50%; border: none; cursor: pointer;
    font-size: 4rem; background: #58cc02; color: #ffffff; font-family: inherit;
    box-shadow: 0 8px 0 0 #46a302; transition: all 0.08s ease;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #big:active { transform: translateY(8px); box-shadow: 0 0 0 0 #46a302; }
  #shop { width: min(92vw, 380px); margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 0 0 #e5e5e5; }
  .item .info { flex: 1; }
  .item .info b { display: block; font-size: 0.95rem; font-weight: 800; }
  .item .info span { font-size: 0.78rem; color: #777777; }
  .item button { background: #58cc02; color: #ffffff; border: none; border-radius: 12px;
    padding: 10px 14px; font-weight: 800; cursor: pointer; font-family: inherit;
    white-space: nowrap; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  .item button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .item button:disabled { background: #e5e5e5; color: #afafaf; box-shadow: 0 4px 0 0 #d5d5d5; cursor: default; }
  #reset { margin-top: 18px; background: none; border: none; color: #afafaf;
    font-size: 0.78rem; font-weight: 800; text-transform: uppercase; cursor: pointer; font-family: inherit; }
  #reset:hover { color: #ff4b4b; }
  .pop { position: fixed; font-weight: 900; color: #58cc02; pointer-events: none;
    animation: rise 0.7s ease-out forwards; font-size: 1.1rem; }
  @keyframes rise { to { transform: translateY(-60px); opacity: 0; } }
</style>
</head>
<body>
  <h1><span>◆</span> Clicker</h1>
  <div id="count">0</div>
  <div id="rate">0 per click · 0 per second</div>
  <button id="big" aria-label="Click">◉</button>
  <div id="shop"></div>
  <button id="reset">reset everything</button>
<script src="/cudic-save.js?v=1"></script>
<script>
(function () {
  var S = { n: 0, click: 1, cps: 0, cursors: 0, mults: 0 };
  var CS = window.CudicSave || null;
  var ready = !CS;
  function validSave(d) { return d && typeof d.n === 'number'; }
  var countEl = document.getElementById('count'), rateEl = document.getElementById('rate');
  var shopEl = document.getElementById('shop');
  var UPGRADES = [
    { id: 'cursors', name: 'Auto-clicker', desc: '+1 per second each', base: 15, growth: 1.15,
      level: function () { return S.cursors; },
      apply: function () { S.cursors++; S.cps++; } },
    { id: 'mults', name: 'Click power', desc: '+1 per click each', base: 100, growth: 2.1,
      level: function () { return S.mults; },
      apply: function () { S.mults++; S.click++; } }
  ];
  function cost(u) { return Math.floor(u.base * Math.pow(u.growth, u.level())); }
  function fmt(n) {
    if (n < 1000) return Math.floor(n).toString();
    var units = ['K', 'M', 'B', 'T'];
    var u = -1, v = n;
    while (v >= 1000 && u < units.length - 1) { v /= 1000; u++; }
    return (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + units[u];
  }
  function save() {
    if (CS) {
      if (ready) CS.save({ n: S.n, click: S.click, cps: S.cps, cursors: S.cursors, mults: S.mults });
      return;
    }
    try { localStorage.setItem('cudic-clicker', JSON.stringify(S)); } catch (e) {}
  }
  function bootSave() {
    if (!CS) {
      try {
        var saved = JSON.parse(localStorage.getItem('cudic-clicker') || 'null');
        if (validSave(saved)) S = saved;
      } catch (e) {}
      paint();
      return;
    }
    CS.load({ legacyKey: 'cudic-clicker' }).then(function (d) {
      if (validSave(d)) S = d;
      ready = true; paint();
    }).catch(function () { ready = true; paint(); });
  }
  function paint() {
    countEl.textContent = fmt(S.n);
    rateEl.textContent = S.click + ' per click · ' + S.cps + ' per second';
    shopEl.innerHTML = '';
    UPGRADES.forEach(function (u) {
      var c = cost(u);
      var row = document.createElement('div');
      row.className = 'item';
      var info = document.createElement('div');
      info.className = 'info';
      var b = document.createElement('b');
      b.textContent = u.name + ' ×' + u.level();
      var s = document.createElement('span');
      s.textContent = u.desc;
      info.appendChild(b); info.appendChild(s);
      var btn = document.createElement('button');
      btn.textContent = fmt(c);
      btn.disabled = S.n < c;
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (S.n < cost(u)) return;
        S.n -= cost(u);
        u.apply();
        save(); paint();
      });
      row.appendChild(info); row.appendChild(btn);
      shopEl.appendChild(row);
    });
  }
  document.getElementById('big').addEventListener('click', function (e) {
    if (!ready) return;
    S.n += S.click;
    var p = document.createElement('div');
    p.className = 'pop';
    p.textContent = '+' + S.click;
    p.style.left = (e.clientX - 10) + 'px';
    p.style.top = (e.clientY - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(function () { p.remove(); }, 700);
    save(); paint();
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('Reset everything?')) return;
    S = { n: 0, click: 1, cps: 0, cursors: 0, mults: 0 };
    save(); paint();
  });
  setInterval(function () {
    if (S.cps > 0) { S.n += S.cps / 10; save(); paint(); }
  }, 100);
  setInterval(save, 5000);
  bootSave();
})();
</script>
</body>
</html>
