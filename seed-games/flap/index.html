<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flap</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #3c3c3c; font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 700; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px; }
  h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 span { color: #58cc02; }
  .hud { display: flex; gap: 22px; margin: 10px 0 14px; font-size: 0.9rem;
    font-weight: 800; text-transform: uppercase; color: #777777; }
  .hud b { color: #3c3c3c; font-size: 1.3rem; }
  #wrap { position: relative; width: min(94vw, 440px); background: #ffffff;
    border: 2px solid #e5e5e5; border-radius: 20px; padding: 14px;
    box-shadow: 0 4px 0 0 #e5e5e5; }
  canvas { width: 100%; aspect-ratio: 11/14; display: block; background: #ddf4ff;
    border: 2px solid #e5e5e5; border-radius: 16px; touch-action: none; }
  #over { position: absolute; inset: 14px; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(255,255,255,0.92);
    border-radius: 16px; text-align: center; }
  #over.show { display: flex; }
  #over h2 { font-weight: 900; text-transform: uppercase; }
  #over p { color: #777777; font-size: 0.9rem; }
  button { background: #58cc02; color: #ffffff; border: none; border-radius: 16px;
    padding: 12px 24px; font-size: 1rem; font-weight: 800; text-transform: uppercase;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 0 #46a302; transition: all 0.1s ease; }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 0 #46a302; }
  .hint { margin-top: 12px; font-size: 0.8rem; color: #afafaf; }
</style>
</head>
<body>
  <h1><span>◆</span> Flap</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="440" height="560"></canvas>
    <div id="over"><h2>Splat!</h2><p id="overSub"></p><button id="again">Try again</button></div>
  </div>
  <p class="hint">Click, tap, or Space to flap</p>
<script>
(function () {
  var W = 440, H = 560, BX = 110, BR = 15, GRAV = 0.45, FLAP = -7.5;
  var PW = 74, GAP = 158, SPEED = 2.6;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var over = document.getElementById('over'), overSub = document.getElementById('overSub');
  var y, vy, pipes, score, best, state, frame;
  try { best = parseInt(localStorage.getItem('cudic-flap-best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function reset() {
    y = H / 2; vy = 0; pipes = []; score = 0; frame = 0;
    scoreEl.textContent = '0';
    over.classList.remove('show');
    state = 'ready';
  }
  function flap() {
    if (state === 'over') return;
    if (state === 'ready') state = 'play';
    vy = FLAP;
  }
  function die() {
    state = 'over';
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('cudic-flap-best', String(best)); } catch (e) {}
    }
    overSub.textContent = 'You scored ' + score + ' point' + (score === 1 ? '' : 's') + '.';
    over.classList.add('show');
  }
  function step() {
    frame++;
    ctx.fillStyle = '#ddf4ff';
    ctx.fillRect(0, 0, W, H);

    if (state === 'play') {
      vy += GRAV;
      if (vy > 10) vy = 10;
      y += vy;
      if (frame % 105 === 0) {
        var margin = 70;
        var gy = margin + Math.random() * (H - GAP - margin * 2);
        pipes.push({ x: W + 10, gapY: gy, scored: false });
      }
      for (var i = pipes.length - 1; i >= 0; i--) {
        var p = pipes[i];
        p.x -= SPEED;
        if (!p.scored && p.x + PW < BX - BR) {
          p.scored = true;
          score++;
          scoreEl.textContent = score;
        }
        if (p.x < -PW - 10) pipes.splice(i, 1);
      }
      if (y + BR >= H - 8 || y - BR <= 0) return die();
      for (var j = 0; j < pipes.length; j++) {
        var q = pipes[j];
        if (BX + BR > q.x && BX - BR < q.x + PW &&
            (y - BR < q.gapY || y + BR > q.gapY + GAP)) return die();
      }
    }

    ctx.fillStyle = '#e5e5e5';
    for (var k = 0; k < pipes.length; k++) {
      var pp = pipes[k];
      ctx.fillStyle = '#46a302';
      ctx.fillRect(pp.x, 0, PW, pp.gapY);
      ctx.fillRect(pp.x, pp.gapY + GAP, PW, H - pp.gapY - GAP);
      ctx.fillStyle = '#58cc02';
      ctx.fillRect(pp.x, 0, PW, pp.gapY - 4);
      ctx.fillRect(pp.x, pp.gapY + GAP + 4, PW, H - pp.gapY - GAP - 4);
      ctx.fillStyle = '#46a302';
      ctx.fillRect(pp.x - 3, pp.gapY - 15, PW + 6, 12);
      ctx.fillRect(pp.x - 3, pp.gapY + GAP + 3, PW + 6, 12);
      ctx.fillStyle = '#58cc02';
      ctx.fillRect(pp.x - 3, pp.gapY - 15, PW + 6, 9);
      ctx.fillRect(pp.x - 3, pp.gapY + GAP + 3, PW + 6, 9);
    }
    ctx.fillStyle = '#e5e5e5';
    ctx.fillRect(0, H - 8, W, 8);

    var tilt = Math.max(-0.5, Math.min(0.6, vy * 0.07));
    ctx.save();
    ctx.translate(BX, y);
    ctx.rotate(tilt);
    ctx.fillStyle = '#e6a800';
    ctx.beginPath(); ctx.arc(0, 3, BR, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffc800';
    ctx.beginPath(); ctx.arc(0, 0, BR, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(5, -4, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#3c3c3c';
    ctx.beginPath(); ctx.arc(6, -4, 2.4, 0, 7); ctx.fill();
    ctx.restore();

    if (state === 'ready') {
      ctx.fillStyle = '#afafaf';
      ctx.font = "800 15px Nunito, system-ui, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('CLICK, TAP, OR PRESS SPACE', W / 2, H / 2 + 70);
    }
    if (state !== 'over') requestAnimationFrame(step);
  }
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
  });
  cv.addEventListener('mousedown', flap);
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); flap(); }, { passive: false });
  document.getElementById('again').addEventListener('click', function () { reset(); step(); });
  reset();
  step();
})();
</script>
</body>
</html>
