<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/*__TERMINAL_CSS__*/
/* Cudic AI, terminal skin. Zinc monochrome, monospace everywhere, no
   bubbles, no pills. terminal.css (above) supplies the base rhythm;
   everything below themes it to vscode tokens and the agent layout. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 0; display: flex; flex-direction: column;
  font-family: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: 12.5px; line-height: 1.65;
  color: var(--vscode-foreground, #fafafa);
  background: transparent;
}
button { font: inherit; cursor: pointer; }
button:disabled { opacity: 0.35; cursor: default; }
.hidden { display: none !important; }
/* ── Header: cudic-ai · main · model ── */
#topbar {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, #27272a);
  flex-shrink: 0; font-size: 12px; white-space: nowrap; overflow: hidden;
}
#topbar .brand { font-weight: 700; }
#topbar .sess { color: var(--vscode-descriptionForeground, #a1a1aa); }
#topbar .sp { flex: 1; }
#modelPill {
  color: var(--vscode-descriptionForeground, #a1a1aa);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%;
}
.tbtn { background: none; border: none; color: var(--vscode-descriptionForeground, #a1a1aa); padding: 2px 4px; font-size: 12px; }
.tbtn:hover { color: var(--vscode-foreground, #fafafa); text-decoration: underline; }
/* ── Boot / gate: $ cudic init ── */
#gate { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 20px; }
#gate.hidden { display: none !important; }
.boot { color: var(--vscode-descriptionForeground, #a1a1aa); margin: 0 0 4px; }
.boot b { color: var(--vscode-foreground, #fafafa); font-weight: 700; }
.gorow {
  display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--vscode-foreground, #fafafa); padding: 7px 2px; font-size: 12.5px;
}
.gorow .chev { color: var(--vscode-descriptionForeground, #a1a1aa); margin-right: 8px; }
.gorow:hover { background: var(--vscode-toolbar-hoverBackground, #1c1c1f); }
.gorow small { display: block; margin-left: 18px; font-size: 11px; color: var(--vscode-descriptionForeground, #a1a1aa); }
/* ── Setup screens ── */
.screen { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 8px; }
.screen h2 { margin: 2px 0 4px; font-size: 13px; font-weight: 700; }
.screen h2::before { content: '$ '; color: var(--vscode-descriptionForeground, #a1a1aa); }
.screen .sub { font-size: 12px; color: var(--vscode-descriptionForeground, #a1a1aa); line-height: 1.55; margin: 0 0 2px; }
.backrow { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; }
#psearch {
  background: transparent; color: var(--vscode-input-foreground, #fafafa);
  border: none; border-bottom: 1px solid var(--vscode-input-border, #27272a);
  border-radius: 0; padding: 7px 2px; font: inherit; width: 100%;
}
#psearch:focus { outline: none; border-bottom-color: #71717a; }
#psearch::placeholder { color: var(--vscode-input-placeholderForeground, #52525b); }
#plist { display: flex; flex-direction: column; }
#plist button {
  background: none; border: none; border-bottom: 1px solid #1e1e22;
  color: var(--vscode-foreground, #fafafa); text-align: left;
  padding: 8px 2px; font-size: 12.5px; display: flex; align-items: baseline; gap: 8px;
}
#plist button:hover { background: var(--vscode-toolbar-hoverBackground, #1c1c1f); }
#plist button .chev { margin-left: auto; color: var(--vscode-descriptionForeground, #a1a1aa); }
#plist button small { display: block; font-size: 11px; color: var(--vscode-descriptionForeground, #a1a1aa); }
.mlist { display: flex; flex-direction: column; padding: 2px 0 6px 14px; }
.mlist button {
  background: none; border: none; border-bottom: 1px solid #1a1a1e;
  color: var(--vscode-foreground, #fafafa); text-align: left;
  padding: 6px 2px; font-size: 12px; display: flex; align-items: baseline; gap: 8px;
}
.mlist button:hover { background: var(--vscode-toolbar-hoverBackground, #1c1c1f); }
.mlist button .tick { margin-left: auto; }
.mlist button.current { color: #fafafa; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
.field::before { content: none; }
.field > :first-child { color: var(--vscode-descriptionForeground, #a1a1aa); }
.field input {
  background: transparent; color: var(--vscode-input-foreground, #fafafa);
  border: none; border-bottom: 1px solid var(--vscode-input-border, #27272a);
  border-radius: 0; padding: 7px 2px; font: inherit; width: 100%;
}
.field input:focus { outline: none; border-bottom-color: #fafafa; box-shadow: none; }
.hint { font-size: 11.5px; color: var(--vscode-descriptionForeground, #a1a1aa); line-height: 1.55; }
.ok { color: var(--vscode-testing-iconPassed, #4ec9b0); }
.err { color: var(--vscode-errorForeground, #f48771); }
.btnrow { display: flex; gap: 14px; margin-top: 4px; }
.tbtn.big { font-size: 12.5px; color: var(--vscode-foreground, #fafafa); border-bottom: 1px solid #52525b; padding-bottom: 1px; }
.tbtn.big:hover { border-bottom-color: #fafafa; text-decoration: none; }
.checkrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
.checkrow input { width: auto; accent-color: #fafafa; }
/* ── Scrollback ── */
#chatwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#msgs { flex: 1; min-height: 90px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
.tline { overflow-wrap: break-word; white-space: pre-wrap; }
.t-user { color: var(--vscode-foreground, #fafafa); }
.t-user::before { content: '> '; color: var(--vscode-descriptionForeground, #a1a1aa); }
.t-sys { color: var(--vscode-descriptionForeground, #a1a1aa); }
.t-sys::before { content: '· '; }
.t-ai { color: var(--vscode-foreground, #fafafa); }
.t-ai .cursor { display: inline-block; width: 7px; height: 1em; background: var(--vscode-foreground, #fff); vertical-align: text-bottom; animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
/* ── Tool cards ── */
.tool {
  border-left: 2px solid #3f3f46; padding: 1px 0 1px 9px; margin: 2px 0;
}
.tool.bad { border-left-color: var(--vscode-errorForeground, #f48771); }
.toolhead {
  display: flex; align-items: baseline; gap: 8px; width: 100%;
  background: none; border: none; color: var(--vscode-foreground, #fafafa);
  padding: 2px 0; font-size: 12px; text-align: left;
}
.toolhead .tg { color: var(--vscode-descriptionForeground, #a1a1aa); }
.toolhead .stat-add { color: var(--vscode-testing-iconPassed, #4ec9b0); }
.toolhead .stat-del { color: var(--vscode-errorForeground, #f48771); }
.toolhead .chev { margin-left: auto; color: var(--vscode-descriptionForeground, #a1a1aa); }
.toolbody { margin: 4px 0 2px; }
.toolbody pre.diff {
  margin: 0; padding: 7px 9px; overflow-x: auto; font-size: 11.5px; line-height: 1.6;
  background: #00000033; border: 1px solid #27272a; border-radius: 6px; white-space: pre-wrap;
}
.diff .add { color: var(--vscode-testing-iconPassed, #4ec9b0); }
.diff .del { color: var(--vscode-errorForeground, #f48771); }
.toolsum { font-size: 11.5px; color: var(--vscode-descriptionForeground, #a1a1aa); }
/* ── Permission row ── */
.ask {
  border: 1px solid #52525b; border-radius: 6px; padding: 8px 10px; margin: 2px 0;
  display: flex; flex-direction: column; gap: 7px; font-size: 12px;
}
.ask .aq { color: var(--vscode-foreground, #fafafa); }
.ask .aq::before { content: '? '; color: #fbbf24; }
.ask .opts { display: flex; gap: 6px; }
.ask .opts button {
  background: none; border: 1px solid #52525b; border-radius: 5px;
  color: var(--vscode-foreground, #fafafa); padding: 3px 11px; font-size: 11.5px;
}
.ask .opts button:hover { border-color: #fafafa; }
.ask .opts button b { color: #fbbf24; font-weight: 700; }
/* ── Code blocks in prose ── */
.codeblock { margin: 7px 0; border: 1px solid #27272a; border-radius: 6px; overflow: hidden; background: #00000033; }
.codeblock .chead {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px;
  font-size: 11px; color: var(--vscode-descriptionForeground, #a1a1aa);
  border-bottom: 1px solid #27272a;
}
.codeblock .chead .fname { overflow: hidden; text-overflow: ellipsis; }
.codeblock .chead .sp { flex: 1; }
.codeblock .chead button { background: none; border: none; color: var(--vscode-descriptionForeground, #a1a1aa); font-size: 11px; padding: 2px 4px; }
.codeblock .chead button:hover { color: var(--vscode-foreground, #fafafa); text-decoration: underline; }
.codeblock pre { margin: 0; padding: 8px 10px; overflow-x: auto; font-size: 11.5px; line-height: 1.6; }
.errline { color: var(--vscode-errorForeground, #f48771); }
.errline button { background: none; border: none; color: inherit; text-decoration: underline; padding: 0; font-size: inherit; }
/* ── Empty suggestions ── */
#emptyState { display: flex; flex-direction: column; gap: 3px; padding: 6px 0; }
#emptyState .sugs { display: flex; flex-direction: column; }
#emptyState .sugs button {
  background: none; border: none; text-align: left; padding: 6px 2px;
  color: var(--vscode-descriptionForeground, #a1a1aa); font-size: 12.5px;
}
#emptyState .sugs button:hover { color: var(--vscode-foreground, #fafafa); }
#emptyState .sugs button::before { content: '› '; }
/* ── Status line + composer ── */
#status {
  padding: 3px 12px; font-size: 11px; color: var(--vscode-descriptionForeground, #a1a1aa);
  border-top: 1px solid #1e1e22; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#status.live { color: var(--vscode-foreground, #fafafa); }
#composer { padding: 6px 12px 10px; flex-shrink: 0; position: relative; }
#promptrow { display: flex; align-items: flex-start; gap: 7px; }
#promptrow .dollar { color: var(--vscode-descriptionForeground, #a1a1aa); padding-top: 1px; flex-shrink: 0; }
#q {
  border: none; background: transparent; min-height: 22px; max-height: 130px; resize: none;
  padding: 0; color: inherit; font: inherit; width: 100%; flex: 1;
}
#q:focus { outline: none; }
#q::placeholder { color: var(--vscode-input-placeholderForeground, #52525b); }
#ctxrow { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font-size: 11px; }
.chip { background: none; border: none; color: var(--vscode-descriptionForeground, #a1a1aa); padding: 0; font-size: 11px; }
.chip:hover { color: var(--vscode-foreground, #fafafa); }
.chip.off { opacity: 0.4; text-decoration: line-through; }
#slashpop {
  position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 2px;
  background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; padding: 4px;
  display: flex; flex-direction: column; z-index: 5;
}
#slashpop button {
  background: none; border: none; text-align: left; padding: 6px 9px; border-radius: 5px;
  color: var(--vscode-foreground, #fafafa); font-size: 12px; display: flex; gap: 10px;
}
#slashpop button small { color: var(--vscode-descriptionForeground, #a1a1aa); }
#slashpop button.sel, #slashpop button:hover { background: #27272a; }
/* ── Motion (stillness is opt-out via reduced-motion) ── */
@media (prefers-reduced-motion: no-preference) {
  .screen:not(.hidden), #chatwrap:not(.hidden), #gate:not(.hidden) { animation: screenIn 0.2s ease both; }
  .tline, .tool, .ask { animation: msgIn 0.2s ease both; }
}
@keyframes screenIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes msgIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div id="topbar">
    <span class="brand">✦ cudic-ai</span>
    <span class="sess">· main</span>
    <span class="sp"></span>
    <span id="modelPill" title="Active provider · model">…</span>
    <button class="tbtn" id="gearBtn" title="Providers & keys (/model)">models</button>
    <button class="tbtn" id="clearBtn2" title="Clear chat (/clear)">clear</button>
  </div>

  <!-- Boot: flat terminal init -->
  <div id="gate" class="hidden">
    <p class="boot"><b>$ cudic init</b></p>
    <p class="boot">terminal agent · keys stay in this browser</p>
    <button class="gorow" id="gateAdd"><span class="chev">›</span>set up a model<small>50+ providers · keys · free and local options</small></button>
    <button class="gorow" id="gateMore"><span class="chev">›</span>options<small>autocomplete · completion model · custom endpoint</small></button>
  </div>

  <!-- Provider list -->
  <div id="providersScreen" class="screen hidden">
    <div class="backrow"><button class="tbtn" id="provBack" aria-label="Back">‹ back</button><h2 style="margin:0">providers</h2></div>
    <input id="psearch" type="text" placeholder="$ search 50+ providers…" autocomplete="off" spellcheck="false">
    <div id="plist"></div>
  </div>

  <!-- Key + model for one provider -->
  <div id="keyScreen" class="screen hidden">
    <div class="backrow"><button class="tbtn" id="keyBack" aria-label="Back">‹ back</button><h2 style="margin:0" id="keyProvName">provider</h2></div>
    <p class="sub" id="keyProvHelp"></p>
    <div class="field">model
      <div style="display:flex;gap:6px">
        <input id="model" type="text" list="modelList" placeholder="pick or type a model id" style="flex:1;min-width:0">
        <datalist id="modelList"></datalist>
        <button class="tbtn" id="modelsBtn" title="Fetch live model list" style="flex-shrink:0">⟳</button>
      </div>
    </div>
    <div class="field"><span id="keyLabel">api key</span>
      <input id="key" type="password" placeholder="paste key" autocomplete="off" spellcheck="false">
    </div>
    <div class="hint" id="keyState"></div>
    <div class="btnrow" style="margin-top:2px">
      <button class="tbtn big" id="saveBtn">save</button>
      <button class="tbtn big" id="testBtn" title="Send a tiny test completion">test</button>
    </div>
  </div>

  <!-- More options -->
  <div id="optionsScreen" class="screen hidden">
    <div class="backrow"><button class="tbtn" id="optBack" aria-label="Back">‹ back</button><h2 style="margin:0">options</h2></div>
    <label class="checkrow"><input id="completeOn" type="checkbox"> ghost autocomplete (tab)</label>
    <div class="field">completion model (blank = chat model)
      <input id="completeModel" type="text" placeholder="e.g. a small fast model">
    </div>
    <div class="field">custom endpoint (blank = provider default)
      <input id="baseUrl" type="text" placeholder="https://my-host/v1" autocomplete="off" spellcheck="false">
    </div>
    <p class="sub" id="provNote"></p>
  </div>

  <!-- Chat -->
  <div id="chatwrap" class="hidden">
    <div id="msgs"><div id="emptyState"></div></div>
    <div id="status">idle</div>
    <div id="composer">
      <div id="slashpop" class="hidden"></div>
      <div id="promptrow"><span class="dollar">$</span><textarea id="q" rows="1" placeholder="ask about your project…  ( / for commands)"></textarea></div>
      <div id="ctxrow"><div id="chips"></div></div>
    </div>
  </div>

<script nonce="__NONCE__">
(function () {
  var api = (function () {
    try { if (typeof acquireVsCodeApi === 'function') return acquireVsCodeApi(); } catch (e) {}
    return { postMessage: function (m) { parent.postMessage(m, '*'); } };
  })();
  function $(id) { return document.getElementById(id); }
  var modelEl = $('model'), modelList = $('modelList'),
    keyEl = $('key'), keyLabel = $('keyLabel'), keyState = $('keyState'),
    completeOn = $('completeOn'), completeModel = $('completeModel'), baseUrlEl = $('baseUrl'),
    provNote = $('provNote'), msgs = $('msgs'), q = $('q'), chips = $('chips'),
    statusEl = $('status'), slashpop = $('slashpop'),
    modelPill = $('modelPill'), keyHint = null;
  var PRESETS = [], SETTINGS = { provider: 'zen', model: '', baseOverride: '', completeOn: true, completeModel: '', hasKey: false, keyed: [], skills: [] }, SKILLCAT = [];
  var history = [], streaming = null, attachActive = true, chatted = false, fetchedFor = {}, lastQ = '', baseOverrideVal = '', justSavedKey = false;
  var hist = [], hidx = -1;
  var hasSupa = false;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function preset() { return PRESETS.find(function (p) { return p.id === SETTINGS.provider; }) || PRESETS[0]; }
  function needsKey() {
    var p = preset();
    return !!(p && !p.keyOptional && !SETTINGS.hasKey);
  }
  function modelName() {
    var p = preset();
    var m = (SETTINGS.model || '').trim() || ((p && p.models[0]) || '');
    return ((p && p.name) || '…') + (m ? ' · ' + m : '');
  }
  var SCREENS = ['gate', 'providersScreen', 'keyScreen', 'optionsScreen', 'chatwrap'];
  function show(name) {
    SCREENS.forEach(function (id) { $(id).classList.toggle('hidden', id !== name); });
  }
  // Route: chat only when usable, otherwise the gate. Never yank the user
  // out of the providers/key/options screens mid-setup (ai:state/ai:init).
  function exitSetup() {
    if (chatted || !needsKey()) show('chatwrap');
    else show('gate');
  }
  function decide() {
    var cur = null;
    SCREENS.forEach(function (id) { if (!$(id).classList.contains('hidden')) cur = id; });
    if (cur === 'providersScreen' || cur === 'keyScreen' || cur === 'optionsScreen') return;
    exitSetup();
  }
  function setStatus(mode, extra) {
    if (!statusEl) return;
    if (mode === 'stream') {
      statusEl.className = 'live';
      statusEl.textContent = 'streaming… · ~' + (extra || 0) + ' tok · esc stops';
    } else {
      statusEl.className = '';
      statusEl.textContent = (extra || modelName()) + ' · main' + (hasSupa ? '' : ' · not logged in');
    }
  }

  function refreshCfg() {
    var p = preset();
    modelList.innerHTML = ((p && p.models) || []).map(function (m) { return '<option value="' + esc(m) + '">'; }).join('');
    if (!modelEl.value && SETTINGS.model) modelEl.value = SETTINGS.model;
    if (p) {
      $('keyProvName').textContent = p.name;
      $('keyProvHelp').textContent = p.keyHelp || '';
      keyLabel.textContent = p.keyLabel || 'api key';
    }
    provNote.textContent = (p && p.loopback) ? 'local engine — called direct from your browser, never proxied.' : 'cloud calls route through your Cudic login (sign in on the site). keys stay in this browser.';
    keyState.innerHTML = !p ? '' : (p.keyOptional ? '<span class="ok">no key needed</span>' :
      (SETTINGS.hasKey ? '<span class="ok">✓ key saved in this browser</span>' : '<span class="err">no key saved yet</span>'));
    keyEl.placeholder = SETTINGS.hasKey ? '•••••••• (saved — paste to replace)' : 'paste key';
    completeOn.checked = !!SETTINGS.completeOn;
    if (SETTINGS.completeModel) completeModel.value = SETTINGS.completeModel;
    baseOverrideVal = SETTINGS.baseOverride || '';
    if (document.activeElement !== baseUrlEl) baseUrlEl.value = baseOverrideVal;
    modelPill.textContent = modelName();
    modelPill.title = modelName();
    if (!streaming) setStatus('idle');
  }
  // A company's full catalog loads whenever we can: public lists,
  // local engines, or a saved key for that company.
  function canList(p, pid) {
    if (!p || !p.modelsPath) return false;
    if (p.publicModels || p.loopback) return true;
    return (SETTINGS.keyed || []).indexOf(pid || p.id) !== -1;
  }
  function maybeFetch() {
    var p = preset();
    if (!p || !p.modelsPath || fetchedFor[SETTINGS.provider]) return;
    if (!canList(p, SETTINGS.provider)) return;
    fetchedFor[SETTINGS.provider] = true;
    api.postMessage({ type: 'ai:models' });
  }
  function saveAll(withKey) {
    var msg = { type: 'ai:saveSettings', provider: SETTINGS.provider, model: modelEl.value.trim(), baseOverride: baseOverrideVal, completeOn: completeOn.checked, completeModel: completeModel.value.trim(), skills: (SETTINGS.skills || []).slice() };
    if (withKey) msg.key = keyEl.value;
    api.postMessage(msg);
    if (withKey) keyEl.value = '';
  }

  function chipHtml() {
    var html = '<button class="chip' + (attachActive ? '' : ' off') + '" id="chipFile" title="Include the active file as context">[f] active file</button>';
    SKILLCAT.forEach(function (s) {
      var on = (SETTINGS.skills || []).indexOf(s.id) !== -1;
      html += '<button class="chip' + (on ? '' : ' off') + '" data-sk="' + esc(s.id) + '" title="' + esc(s.blurb || '') + '">[+] ' + esc(s.label) + '</button>';
    });
    chips.innerHTML = html;
    $('chipFile').onclick = function () { attachActive = !attachActive; chipHtml(); };
    chips.querySelectorAll('[data-sk]').forEach(function (c) {
      c.onclick = function () {
        var id = c.getAttribute('data-sk');
        var arr = (SETTINGS.skills || []).slice();
        var i = arr.indexOf(id);
        if (i === -1) arr.push(id); else arr.splice(i, 1);
        SETTINGS.skills = arr;
        chipHtml();
        saveAll(false);
      };
    });
  }

  var SUGS = ['Explain the active file', 'Review my code for bugs', 'What should I build next?'];
  function showEmpty() {
    var box = $('emptyState');
    if (!box || chatted) return;
    box.innerHTML = '<div class="sugs">' +
      SUGS.map(function (s, i) { return '<button data-sug="' + i + '">' + esc(s) + '</button>'; }).join('') +
      '</div>';
    box.querySelectorAll('[data-sug]').forEach(function (b) {
      b.onclick = function () { q.value = SUGS[+b.getAttribute('data-sug')]; autoresize(); send(); };
    });
  }

  // Company rows expand into their model lineups, like each provider's own
  // picker. Tapping a model selects it and moves to key entry.
  var expandedId = null, LISTS = {}, FETCHERR = {};
  function modelsOf(p) {
    var seen = {}, out = [];
    (LISTS[p.id] || []).concat(p.models || []).forEach(function (m) {
      if (m && !seen[m]) { seen[m] = 1; out.push(m); }
    });
    return out;
  }
  function renderPlist(filter) {
    var list = $('plist');
    var f = (filter || '').toLowerCase();
    var html = '';
    PRESETS.forEach(function (p) {
      var ms = modelsOf(p);
      var matchProv = !f || p.name.toLowerCase().indexOf(f) !== -1 || p.id.indexOf(f) !== -1;
      var matchModels = ms.filter(function (m) { return m.toLowerCase().indexOf(f) !== -1; });
      if (f && !matchProv && !matchModels.length) return;
      var sub = (LISTS[p.id] && LISTS[p.id].length) ? LISTS[p.id].length + ' models'
        : esc((p.models[0] || p.keyHelp || '').slice(0, 60));
      html += '<button data-prov="' + p.id + '"><span>› ' + esc(p.name) +
        '<small>' + sub + '</small></span><span class="chev">+</span></button>';
      if (expandedId === p.id) {
        var show = (f && !matchProv) ? matchModels : ms;
        html += '<div class="mlist">' + (show.map(function (m) {
          var cur = (SETTINGS.provider === p.id && (SETTINGS.model || p.models[0] || '') === m);
          return '<button data-model="' + esc(m) + '" data-pid="' + p.id + '"' + (cur ? ' class="current"' : '') + '>' +
            '<span>› ' + esc(m) + '</span>' + (cur ? '<span class="tick">✓</span>' : '') + '</button>';
        }).join('') || '<p class="hint">no models listed — open it and hit ⟳.</p>');
        if (FETCHERR[p.id]) html += '<p class="hint err">⚠ ' + esc(FETCHERR[p.id]) + '</p>';
        if (!canList(p, p.id)) {
          html += '<p class="hint">' + (p.modelsPath
            ? 'save ' + esc(p.keyLabel || 'an api key') + ' to load every available model here.'
            : 'no list endpoint — curated set shown.') + '</p>';
        }
        html += '</div>';
      }
    });
    list.innerHTML = html || '<p class="hint">no providers match.</p>';
    list.querySelectorAll('[data-prov]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-prov');
        expandedId = (expandedId === id) ? null : id;
        if (expandedId) {
          var p = PRESETS.find(function (x) { return x.id === id; });
          if (p && p.modelsPath && !LISTS[id] && !fetchedFor[id] && canList(p, id)) {
            fetchedFor[id] = true;
            delete FETCHERR[id];
            api.postMessage({ type: 'ai:models', provider: id });
          }
        }
        renderPlist($('psearch').value);
      };
    });
    list.querySelectorAll('[data-model]').forEach(function (b) {
      b.onclick = function () {
        var pid = b.getAttribute('data-pid'), m = b.getAttribute('data-model');
        expandedId = null;
        SETTINGS.provider = pid; modelEl.value = m;
        baseOverrideVal = '';
        api.postMessage({ type: 'ai:saveSettings', provider: pid, model: m, baseOverride: '', completeOn: completeOn.checked, completeModel: completeModel.value.trim() });
        show('keyScreen');
      };
    });
  }

  function sysline(text) {
    var d = document.createElement('div');
    d.className = 'tline t-sys';
    d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function addUser(text) {
    var d = document.createElement('div');
    d.className = 'tline t-user';
    d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function addAi() {
    var wrap = document.createElement('div');
    wrap.className = 'tline t-ai';
    wrap.innerHTML = '<span class="cursor" role="status"></span>';
    msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
    return { row: wrap, body: wrap };
  }
  function diffHtml(text) {
    return esc(text).split('\n').map(function (ln) {
      if (ln.charAt(0) === '+') return '<span class="add">' + ln + '</span>';
      if (ln.charAt(0) === '-') return '<span class="del">' + ln + '</span>';
      return '<span>' + ln + '</span>';
    }).join('\n');
  }
  function renderAi(bodyEl, raw) {
    var html = '', last = 0, re = /```(\w*)(?::([^\n]*))?\n([\s\S]*?)(?:```|$)/g, m;
    function text(t) { return esc(t); }
    while ((m = re.exec(raw)) !== null) {
      html += text(raw.slice(last, m.index));
      var lang = m[1] || 'code', fpath = (m[2] || '').trim(), code = m[3].replace(/\n$/, '');
      var id = 'cb' + Math.random().toString(36).slice(2, 8);
      html += '<div class="codeblock" data-code="' + id + '"><div class="chead"><span>' + esc(lang) + '</span>' +
        (fpath ? '<span class="fname">' + esc(fpath) + '</span>' : '') + '<span class="sp"></span>' +
        (fpath ? '<button data-apply="' + id + '">[apply]</button>' : '') +
        '<button data-copy="' + id + '" aria-label="Copy code">[copy]</button></div><pre>' + esc(code) + '</pre></div>';
      html += '<span data-store="' + id + '" data-path="' + esc(fpath) + '" style="display:none">' + esc(code) + '</span>';
      last = m.index + m[0].length;
    }
    html += text(raw.slice(last));
    bodyEl.innerHTML = html + '<span class="cursor" role="status"></span>';
    msgs.scrollTop = msgs.scrollHeight;
  }
  function toolCard(tc, data) {
    // data: { ok, summary, diff?, added?, removed? } — old shapes without
    // diff degrade to a summary row (forward compatible both ways).
    var wrap = document.createElement('div');
    wrap.className = 'tool' + (data.ok ? '' : ' bad');
    var icon = data.ok === false ? '⚠' : (tc === 'save_file' ? '✎' : (tc === 'read_file' ? '⧉' : '·'));
    var stat = '';
    if (typeof data.added === 'number' || typeof data.removed === 'number') {
      stat = ' <span class="stat-add">+' + (data.added || 0) + '</span> <span class="stat-del">−' + (data.removed || 0) + '</span>';
    }
    var open = data.ok === false;
    wrap.innerHTML = '<button class="toolhead" aria-expanded="' + open + '"><span class="tg">' + icon + '</span>' +
      '<span>' + esc(tc) + ' ' + esc((data.summary || '').replace(/^(saved|read) /, '')) + '</span>' + stat +
      '<span class="chev">' + (open ? '▾' : '▸') + '</span></button>' +
      '<div class="toolbody"' + (open ? '' : ' hidden') + '></div>';
    var body = wrap.querySelector('.toolbody');
    if (data.diff) body.innerHTML = '<pre class="diff">' + diffHtml(data.diff) + '</pre>';
    else body.innerHTML = '<div class="toolsum">' + esc(data.summary || tc) + '</div>';
    wrap.querySelector('.toolhead').onclick = function () {
      var isOpen = !body.classList.contains('hidden');
      body.classList.toggle('hidden', isOpen);
      this.setAttribute('aria-expanded', String(!isOpen));
      this.querySelector('.chev').textContent = isOpen ? '▸' : '▾';
    };
    msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
  }
  function askRow(m) {
    var opts = Array.isArray(m.options) && m.options.length ? m.options : ['yes', 'no'];
    var wrap = document.createElement('div');
    wrap.className = 'ask';
    wrap.innerHTML = '<div class="aq">' + esc(m.question || 'proceed?') + '</div><div class="opts"></div>';
    var box = wrap.querySelector('.opts');
    opts.slice(0, 4).forEach(function (o, i) {
      var b = document.createElement('button');
      b.innerHTML = '<b>' + (i + 1) + '</b> ' + esc(o);
      b.onclick = function () {
        api.postMessage({ type: 'ai:answer', id: m.id, choice: o });
        wrap.innerHTML = '<div class="aq">› chose ' + esc(o) + '</div>';
        q.focus();
      };
      box.appendChild(b);
    });
    // Number keys answer without leaving the keyboard.
    wrap.tabIndex = -1;
    wrap.addEventListener('keydown', function (e) {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= opts.length) {
        var btns = box.querySelectorAll('button');
        if (btns[n - 1]) btns[n - 1].click();
      }
    });
    msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
    var first = box.querySelector('button');
    if (first) first.focus();
  }
  msgs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-copy],button[data-apply],button[data-retry],button[data-msgcopy]');
    if (!b) return;
    if (b.hasAttribute('data-retry')) { q.value = lastQ; autoresize(); send(); return; }
    if (b.hasAttribute('data-msgcopy')) {
      try { navigator.clipboard.writeText(b.getAttribute('data-raw') || ''); } catch (err) {}
      return;
    }
    var id = b.getAttribute('data-copy') || b.getAttribute('data-apply');
    var store = msgs.querySelector('span[data-store="' + id + '"]');
    if (!store) return;
    if (b.hasAttribute('data-copy')) {
      try { navigator.clipboard.writeText(store.textContent); b.textContent = '[copied]'; } catch (err) {}
      setTimeout(function () { b.textContent = '[copy]'; }, 1200);
    } else {
      api.postMessage({ type: 'ai:apply', path: store.getAttribute('data-path'), content: store.textContent });
      b.textContent = '[applying…]';
      setTimeout(function () { b.textContent = '[apply]'; }, 2000);
    }
  });

  function autoresize() {
    q.style.height = 'auto';
    q.style.height = Math.min(130, q.scrollHeight) + 'px';
  }
  q.addEventListener('input', autoresize);

  /* ── Slash commands ── */
  var SLASH = [
    { cmd: '/help', blurb: 'this list' },
    { cmd: '/status', blurb: 'provider · model · session' },
    { cmd: '/model', blurb: 'switch provider / model' },
    { cmd: '/clear', blurb: 'clear chat' }
  ];
  function slashMatch() {
    var v = q.value;
    if (v.charAt(0) !== '/') return null;
    var frag = v.slice(1).split(/\s/)[0];
    return SLASH.filter(function (s) { return s.cmd.slice(1).indexOf(frag) === 0; });
  }
  function renderSlash() {
    var ms = slashMatch();
    if (!ms || !ms.length || q.value.indexOf(' ') !== -1) { slashpop.classList.add('hidden'); return; }
    slashpop.innerHTML = ms.map(function (s, i) {
      return '<button data-slash="' + s.cmd + '"' + (i === 0 ? ' class="sel"' : '') + '><span>' + s.cmd + '</span><small>' + esc(s.blurb) + '</small></button>';
    }).join('');
    slashpop.classList.remove('hidden');
  }
  slashpop.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-slash]');
    if (!b) return;
    q.value = b.getAttribute('data-slash') + ' ';
    slashpop.classList.add('hidden');
    autoresize(); q.focus();
  });
  function runSlash(text) {
    var cmd = text.trim().split(/\s/)[0];
    if (cmd === '/clear') { clearChat(); return true; }
    if (cmd === '/model') { renderPlist($('psearch').value); show('providersScreen'); return true; }
    if (cmd === '/status') { sysline(modelName() + ' · session main · ' + history.length + ' msgs · cudic login ' + (hasSupa ? 'yes' : 'no')); return true; }
    if (cmd === '/help') {
      sysline('commands — ' + SLASH.map(function (s) { return s.cmd + ' (' + s.blurb + ')'; }).join(' · '));
      return true;
    }
    sysline('unknown command — try /help');
    return true;
  }

  function send() {
    var text = q.value.trim();
    if (!text || streaming) return;
    slashpop.classList.add('hidden');
    if (text.charAt(0) === '/') { q.value = ''; autoresize(); runSlash(text); return; }
    lastQ = text;
    var box = $('emptyState');
    if (box) box.remove();
    chatted = true;
    show('chatwrap');
    addUser(text);
    hist.unshift(text); hidx = -1;
    q.value = ''; autoresize();
    var slot = addAi();
    var id = 'm' + Date.now().toString(36);
    streaming = { id: id, aiRow: slot.row, raw: '' };
    setStatus('stream', 0);
    api.postMessage({ type: 'ai:chat', id: id, text: text, attachActive: attachActive, skills: (SETTINGS.skills || []).slice() });
  }
  function stop() {
    if (streaming) api.postMessage({ type: 'ai:stop', id: streaming.id });
  }
  function clearChat() {
    history = []; lastQ = '';
    msgs.innerHTML = '<div id="emptyState"></div>';
    chatted = false; decide();
    showEmpty();
    setStatus('idle');
  }
  $('clearBtn2').onclick = clearChat;
  $('gearBtn').onclick = function () { renderPlist($('psearch').value); show('providersScreen'); };
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    else if (e.key === 'Escape') { if (streaming) { e.preventDefault(); stop(); } slashpop.classList.add('hidden'); }
    else if (e.key === 'ArrowUp' && !e.shiftKey) {
      if (q.value === '' || hidx !== -1) {
        e.preventDefault();
        if (hidx + 1 < hist.length) { hidx++; q.value = hist[hidx]; autoresize(); }
      }
    } else if (e.key === 'ArrowDown' && !e.shiftKey) {
      if (hidx !== -1) {
        e.preventDefault();
        hidx--;
        q.value = hidx === -1 ? '' : hist[hidx];
        autoresize();
      }
    } else if (e.key === 'Tab' && !slashpop.classList.contains('hidden')) {
      e.preventDefault();
      var first = slashpop.querySelector('button');
      if (first) { q.value = first.getAttribute('data-slash') + ' '; slashpop.classList.add('hidden'); autoresize(); }
    } else { renderSlash(); }
  });
  q.addEventListener('input', renderSlash);

  // Gate
  $('gateAdd').onclick = function () { renderPlist(''); $('psearch').value = ''; show('providersScreen'); };
  $('gateMore').onclick = function () { show('optionsScreen'); };
  // Providers list
  $('psearch').addEventListener('input', function () { renderPlist($('psearch').value); });
  $('provBack').onclick = exitSetup;
  // Key screen
  $('keyBack').onclick = function () { renderPlist($('psearch').value); show('providersScreen'); };
  $('saveBtn').onclick = function () {
    justSavedKey = !!keyEl.value;
    // A fresh key deserves a fresh catalog attempt.
    delete fetchedFor[SETTINGS.provider]; delete FETCHERR[SETTINGS.provider];
    saveAll(true);
  };
  $('testBtn').onclick = function () { api.postMessage({ type: 'ai:test' }); };
  $('modelsBtn').onclick = function () { api.postMessage({ type: 'ai:models' }); };
  // Options screen
  $('optBack').onclick = exitSetup;
  function saveOpts() {
    baseOverrideVal = baseUrlEl.value.trim();
    saveAll(false);
  }
  completeOn.onchange = saveOpts;
  completeModel.onchange = saveOpts;
  baseUrlEl.onchange = saveOpts;

  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type === 'ai:init') {
      PRESETS = m.presets || []; SETTINGS = Object.assign(SETTINGS, m.settings || {}); SKILLCAT = m.skills || [];
      refreshCfg(); chipHtml(); showEmpty(); decide(); maybeFetch();
    } else if (m.type === 'ai:state') {
      SETTINGS = Object.assign(SETTINGS, m.settings || {});
      refreshCfg(); showEmpty(); maybeFetch();
      // A fresh key lands the user in chat; anything else respects screens.
      if (justSavedKey) {
        justSavedKey = false;
        if (!needsKey()) show('chatwrap');
        else decide();
      } else decide();
    } else if (m.type === 'ai:supa') {
      hasSupa = !!m.ok;
      if (!streaming) setStatus('idle');
    } else if (m.type === 'ai:chunk') {
      if (streaming && streaming.id === m.id) {
        streaming.raw += m.token;
        renderAi(streaming.aiRow, streaming.raw);
        setStatus('stream', Math.round(streaming.raw.length / 4));
      }
    } else if (m.type === 'ai:done') {
      if (streaming && streaming.id === m.id) {
        history.push({ q: m.q, a: streaming.raw });
        var c = streaming.aiRow.querySelector('.cursor');
        if (c) c.remove();
        streaming = null;
        setStatus('idle');
      }
    } else if (m.type === 'ai:error') {
      if (streaming && streaming.id === m.id) {
        streaming.aiRow.innerHTML = '<div class="tline errline">⚠ ' + esc(m.error || 'Request failed.') + ' <button data-retry>[retry]</button></div>';
        streaming = null;
        setStatus('idle');
      } else {
        keyState.innerHTML = '<span class="err">⚠ ' + esc(m.error || 'Request failed.') + '</span>';
      }
    } else if (m.type === 'ai:modelsResult') {
      if (m.provider) fetchedFor[m.provider] = true;
      if (m.provider && !m.error && Array.isArray(m.models)) {
        LISTS[m.provider] = m.models;
        delete FETCHERR[m.provider];
      }
      if (m.provider && m.error) {
        FETCHERR[m.provider] = m.error;
      }
      // Background refresh lands here too: if the list screen is open,
      // update counts live instead of waiting for a re-expand.
      if (!$('providersScreen').classList.contains('hidden')) renderPlist($('psearch').value);
      if (m.error && (!m.provider || m.provider === SETTINGS.provider))
        keyState.innerHTML = '<span class="err">⚠ ' + esc(m.error) + '</span>';
      else if (Array.isArray(m.models) && m.models.length && (!m.provider || m.provider === SETTINGS.provider)) {
        modelList.innerHTML = m.models.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
        keyState.innerHTML = '<span class="ok">✓ ' + m.models.length + ' models found — pick from the list</span>';
      }
    } else if (m.type === 'ai:tool') {
      if (streaming && streaming.id === m.id) {
        toolCard(m.name || 'tool', { ok: m.ok, summary: m.summary, diff: m.diff, added: m.added, removed: m.removed });
      }
    } else if (m.type === 'ai:ask') {
      askRow(m);
    } else if (m.type === 'ai:applied') {
      keyState.innerHTML = m.ok ? '<span class="ok">✓ wrote ' + esc(m.path) + '</span>'
        : '<span class="err">⚠ ' + esc(m.error || ('Could not write ' + m.path)) + '</span>';
    } else if (m.type === 'ai:testResult') {
      keyState.innerHTML = m.ok ? '<span class="ok">✓ connected — "' + esc(m.text) + '"</span>'
        : '<span class="err">⚠ ' + esc(m.error || 'Test failed.') + '</span>';
    }
  });
  api.postMessage({ type: 'ai:ready' });
})();
</script>
</body>
</html>
